<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090b11">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Além da Realidade: fichas, campanhas, escudo do mestre e bestiário do sistema A.R.RPG.">
<title>Além da Realidade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@1&family=Barlow:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="banco.js"></script>
<style>
/* Layout: barra fixa no topo com a "linha do destino" (ouro > sangue > violeta), páginas em coluna
   central larga. Escudo do mestre: feed de rolagens à esquerda, abas à direita. Visual escuro único. */
:root {
  color-scheme: dark;
  --noite: #0b0d14; --painel: #121624; --painel-2: #191e30; --painel-3: #20263b;
  --linha: rgba(190,198,224,.13); --linha-2: rgba(190,198,224,.24);
  --lua: #dcdfe9; --lua-dim: #8f95ab; --lua-faint: #5b6075;
  --sangue: #b4333b; --sangue-hi: #e3666d; --ouro: #c8a35a; --violeta: #7b5ca8;
  --sanid: #5d86c4; --fole: #6fa58a;
  --guerra: #d0773a; --fome: #c23b45; --peste: #8a9a3c; --morte: #9aa0ad; --neutro: #c8a35a; --conquista: #a066c8; --karma: #b98ad8; --caos: #6b4fd0;
  --f-disp: 'IM Fell English SC', 'Times New Roman', serif;
  --f-ital: 'IM Fell English', 'Times New Roman', serif;
  --f-body: 'Barlow', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { background: var(--noite); }
body { margin: 0; color: var(--lua); font: 15px/1.5 var(--f-body); min-height: 100vh;
  background: radial-gradient(60vmax 60vmax at 90% -20%, rgba(200,163,90,.06), transparent 60%),
              radial-gradient(50vmax 50vmax at -10% 120%, rgba(180,51,59,.07), transparent 60%), var(--noite);
  background-attachment: fixed; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: #090b11; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ouro); outline-offset: 2px; }
a { color: var(--ouro); }
img { max-width: 100%; }

/* topo */
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: #090b11;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topo-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 18px; min-height: 64px; flex-wrap: wrap; padding-block: 6px; }
.marca { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--lua); }
.marca svg { width: 34px; height: 34px; }
.marca b { font: 400 22px/1 var(--f-disp); letter-spacing: .14em; }
.nav { display: flex; gap: 2px 18px; flex-wrap: wrap; flex: 1; }
.nav a { color: var(--lua-dim); text-decoration: none; font: 400 19px/1 var(--f-disp); padding: 8px 0; border-bottom: 1px solid transparent; }
.nav a:hover { color: var(--lua); }
.nav a.aqui { color: var(--lua); border-bottom-color: var(--ouro); }
.quem { font-size: 12px; color: var(--lua-dim); display: flex; align-items: center; gap: 8px; }
.ava { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 700 13px var(--f-body); color: #0b0d14; flex-shrink: 0; }
.linha-destino { height: 2px; background: linear-gradient(90deg, transparent, var(--ouro) 18%, var(--sangue) 55%, var(--violeta) 85%, transparent); }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 80px; }
.pagina { max-width: 1240px; margin: 0 auto; display: grid; gap: 20px; }
.estreita { max-width: 900px; }
h1, h2, h3 { font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font: 400 clamp(30px, 5vw, 48px)/1.05 var(--f-disp); }
h2 { font: 400 26px/1.1 var(--f-disp); }
h3 { font: 400 20px/1.15 var(--f-disp); }
p { margin: 0; }
.dim { color: var(--lua-dim); } .faint { color: var(--lua-faint); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.rotulo { font: 600 10.5px/1.2 var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--lua-faint); }
.cab-pagina { display: flex; justify-content: space-between; align-items: end; gap: 14px; flex-wrap: wrap; }

/* botões e campos */
.btn { border: 1px solid var(--sangue); background: var(--sangue); color: #fff; padding: 8px 14px; font: 600 13px/1.1 var(--f-body); letter-spacing: .04em; border-radius: 2px; }
.btn:hover { background: #c63e46; }
.btn.sec { background: transparent; color: var(--lua); border-color: var(--linha-2); }
.btn.sec:hover { border-color: var(--lua-dim); background: var(--painel-2); }
.btn.ouro { background: transparent; color: var(--ouro); border-color: var(--ouro); }
.btn.ouro:hover { background: rgba(200,163,90,.12); }
.btn.mini { padding: 4px 9px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-x { background: none; border: none; color: var(--lua-faint); font-size: 18px; line-height: 1; padding: 2px 6px; }
.btn-x:hover { color: var(--sangue-hi); }
input[type=text], input[type=number], input[type=search], select, textarea {
  background: #07080d; border: 1px solid var(--linha); padding: 8px 10px; border-radius: 2px; width: 100%; min-width: 0; }
textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ouro); }
.campo { display: grid; gap: 5px; min-width: 0; }
.busca { position: relative; }
.busca input { padding-left: 34px; }
.busca svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--lua-faint); }
.grade-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }

/* abas */
.abas { display: flex; gap: 2px 18px; border-bottom: 1px solid var(--linha); overflow-x: auto; flex-wrap: nowrap; }
.abas button { background: none; border: none; padding: 10px 0; color: var(--lua-dim); font: 400 17px/1 var(--f-disp); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.abas button:hover { color: var(--lua); }
.abas button.aqui { color: var(--lua); border-bottom-color: var(--sangue); }
.filtros { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--linha); background: var(--painel); color: var(--lua-dim); padding: 4px 10px; font-size: 12.5px; border-radius: 999px; }
.chip.aqui { color: var(--noite); background: var(--ouro); border-color: var(--ouro); font-weight: 600; }
.tag { font: 11px var(--f-mono); color: var(--lua-dim); border: 1px solid var(--linha); padding: 1px 6px; white-space: nowrap; display: inline-block; }
.tag.crit { color: var(--ouro); border-color: rgba(200,163,90,.4); }
.el { font: 600 10.5px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; padding: 4px 7px; border: 1px solid currentColor; white-space: nowrap; }
.el-Guerra { color: var(--guerra); } .el-Fome { color: var(--fome); } .el-Peste { color: var(--peste); } .el-Morte { color: var(--morte); }
.el-Neutro, .el-Destino { color: var(--neutro); } .el-Conquista { color: var(--conquista); } .el-Karma { color: var(--karma); } .el-Caos { color: var(--caos); }
.el-x { color: var(--lua-faint); }

.caixa { background: var(--painel); border: 1px solid var(--linha); padding: 16px; }
.aviso { background: rgba(123,92,168,.14); border: 1px solid rgba(123,92,168,.45); padding: 12px 16px; font-size: 14px; }
.aviso-pts { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; border-color: rgba(200,163,90,.5); background: rgba(200,163,90,.1); }
.vazio { padding: 36px 16px; text-align: center; color: var(--lua-dim); font-family: var(--f-ital); font-style: italic; font-size: 18px; }

/* cards de agente / campanha */
.grade-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.card-ag { display: grid; grid-template-columns: 112px 1fr; background: var(--painel); border: 1px solid var(--linha); min-height: 128px; }
.card-ag .foto { background: var(--painel-3) center/cover no-repeat; display: grid; place-items: center; font: 400 38px var(--f-disp); color: var(--lua-faint); }
.card-ag .corpo { padding: 12px 14px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.card-ag .nm { font: 400 21px/1.1 var(--f-disp); overflow-wrap: anywhere; }
.card-ag .acoes { display: flex; gap: 8px; justify-content: flex-end; align-items: end; margin-top: auto; }
.card-camp { position: relative; background: var(--painel) center/cover no-repeat; border: 1px solid var(--linha); min-height: 190px; display: flex; align-items: end; overflow: hidden; }
.card-camp::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,13,20,.15), rgba(11,13,20,.92) 75%); }
.card-camp .corpo { position: relative; padding: 14px; display: flex; justify-content: space-between; align-items: end; gap: 10px; width: 100%; }
.card-camp .qtd { position: absolute; top: 10px; left: 12px; font: 12px var(--f-mono); color: var(--lua-dim); }

/* ficha */
.ficha-topo { display: grid; grid-template-columns: 170px 1fr; gap: 20px; align-items: start; }
@media (max-width: 640px) { .ficha-topo { grid-template-columns: 1fr; } }
.retrato { width: 170px; aspect-ratio: 1; max-width: 100%; border: 1px solid var(--linha-2); background: var(--painel-3) center/cover; display: grid; place-items: center; font: 400 64px var(--f-disp); color: var(--lua-faint); position: relative; }
.principal { display: grid; grid-template-columns: minmax(250px, 320px) 1fr; gap: 20px; }
@media (max-width: 860px) { .principal { grid-template-columns: 1fr; } }
.penta svg { width: 100%; max-width: 290px; display: block; margin: 0 auto; }
.attr-lista { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; text-align: center; }
.attr-lista .v { font: 700 22px/1 var(--f-mono); }
.mini-stats { display: flex; gap: 8px; flex-wrap: wrap; }
.mini-stats > div { flex: 1 1 80px; border: 1px solid var(--linha); padding: 7px 10px; }
.mini-stats .n { font: 700 17px/1.2 var(--f-mono); }
.ident { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 22px; }
.ident .linha { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--linha); }
.ident .k { width: 72px; flex-shrink: 0; padding-top: 3px; }
.ident .v { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.vital { display: grid; gap: 4px; }
.vital .cab { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.vital .nome { font: 600 12px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; }
.vital .ctrl { display: flex; gap: 5px; align-items: center; }
.vbtn { width: 30px; height: 30px; border: 1px solid var(--linha); background: var(--painel-2); color: var(--lua-dim); font: 12px var(--f-mono); flex-shrink: 0; }
.vbtn:hover { color: var(--lua); border-color: var(--lua-dim); }
.trilho { position: relative; flex: 1; height: 30px; background: #07080d; border: 1px solid var(--linha); overflow: hidden; min-width: 60px; }
.trilho.fino { height: 16px; }
.cheio { position: absolute; inset: 0 auto 0 0; transition: width .4s cubic-bezier(.2,.8,.2,1); }
.pv .cheio { background: linear-gradient(90deg, #4d1519, var(--sangue)); }
.ps .cheio { background: linear-gradient(90deg, #1b2a45, var(--sanid)); }
.pst .cheio { background: linear-gradient(90deg, #1d3529, var(--fole)); }
.trilho .txt { position: relative; text-align: center; font: 700 12.5px/28px var(--f-mono); text-shadow: 0 1px 3px #000; }
.trilho.fino .txt { line-height: 14px; font-size: 10.5px; }
.barra-teste { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }
.barra-teste .campo input { width: 80px; text-align: center; font-family: var(--f-mono); }
.grade-per { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.per { background: var(--painel); border: 1px solid var(--linha); padding: 11px 13px; display: grid; gap: 7px; align-content: start; }
.per.zero { opacity: .62; }
.per .topo-p { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pips { display: flex; gap: 3px; }
.pip { width: 8px; height: 8px; border: 1px solid var(--lua-faint); transform: rotate(45deg); }
.pip.on { background: var(--sangue-hi); border-color: var(--sangue-hi); }
.pip.vt { background: var(--ouro); border-color: var(--ouro); }
.res { font: 12.5px/1.5 var(--f-mono); color: var(--lua-dim); overflow-wrap: anywhere; }
.res:empty { display: none; }
.res b { color: var(--lua); font-size: 15px; }
.res .melhor { color: var(--lua); text-decoration: underline; text-underline-offset: 3px; }
.ok { color: var(--fole); font-weight: 700; } .falha { color: var(--sangue-hi); font-weight: 700; } .critico { color: var(--ouro); font-weight: 700; }
.lista { display: grid; gap: 10px; }
.item { background: var(--painel); border: 1px solid var(--linha); padding: 12px 14px; display: grid; gap: 7px; }
.item .cab { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.item .nm { font-weight: 700; }
.item .acoes { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.chk { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--lua-dim); cursor: pointer; }
.chk input { accent-color: var(--sangue); width: 16px; height: 16px; }
.grade-hab { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
.hab { background: var(--painel); border: 1px solid var(--linha); padding: 13px 15px; display: grid; gap: 6px; align-content: start; }
.hab .cab { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.hab .nm { font: 400 18px/1.15 var(--f-disp); }
.hab p { color: var(--lua-dim); font-size: 14px; }
.hab.bloq { opacity: .45; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 7px 0; border-block: 1px solid var(--linha); }
.stats .v { font: 700 13px var(--f-mono); }
#ficha:not(.editando) .edit-only { display: none !important; }

/* gaveta / modal */
.fundo-modal { position: fixed; inset: 0; z-index: 50; background: rgba(5,6,10,.72); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { width: min(720px, 100%); max-height: 86vh; overflow: auto; background: var(--painel); border: 1px solid var(--linha-2); padding: 18px; display: grid; gap: 14px; }
.modal .cab-m { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.opcao { display: flex; justify-content: space-between; gap: 12px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--linha); }
.opcao p { font-size: 13.5px; color: var(--lua-dim); }
.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: max(20px, env(safe-area-inset-bottom, 0px)); background: var(--painel-3); border: 1px solid var(--linha-2); padding: 10px 16px; font-size: 14px; max-width: calc(100% - 32px); }

/* criação */
.passos { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
.passos span { font: 400 19px var(--f-disp); color: var(--lua-faint); }
.passos span.aqui { color: var(--ouro); }
.passos span.feito { color: var(--lua); }
.passos i { width: 40px; height: 1px; background: var(--linha-2); }
.roda-attr { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.attr-box { border: 1px solid var(--linha-2); padding: 14px; text-align: center; display: grid; gap: 8px; background: var(--painel); }
.attr-box .v { font: 700 40px/1 var(--f-mono); }
.attr-box .ctrl { display: flex; justify-content: center; gap: 8px; }
.escolha { border: 1px solid var(--linha); background: var(--painel); padding: 14px; display: grid; gap: 8px; text-align: left; align-content: start; }
.escolha.aqui { border-color: var(--ouro); box-shadow: inset 0 0 0 1px var(--ouro); }
.escolha h3 { font-size: 21px; }
.base-cls { display: flex; gap: 12px; flex-wrap: wrap; font: 12px var(--f-mono); color: var(--lua-dim); }

/* ameaças */
.card-am { display: grid; grid-template-columns: 120px 1fr; background: var(--painel); border: 1px solid var(--linha); text-align: left; padding: 0; color: inherit; min-height: 120px; }
.card-am:hover { border-color: var(--linha-2); background: var(--painel-2); }
.card-am .img { background: #f2efe6 center/contain no-repeat; }
.card-am .corpo { padding: 12px 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.det-am { display: grid; grid-template-columns: minmax(240px, 360px) 1fr; gap: 24px; }
@media (max-width: 860px) { .det-am { grid-template-columns: 1fr; } }
.det-am .img { background: #f2efe6; border: 1px solid var(--linha-2); }
.det-am .img img { display: block; width: 100%; }
.relato { display: grid; gap: 14px; }
.relato h3 { color: var(--ouro); font-size: 17px; }
.relato p { max-width: 70ch; color: #c9ccd8; }
.nota-arthur { font-family: var(--f-ital); font-style: italic; font-size: 19px; line-height: 1.4; color: var(--sangue-hi); border-left: 2px solid var(--sangue); padding-left: 14px; }
.uv { background: #120a24; border: 1px dashed #6b4fd0; padding: 12px 14px; color: #c9b8ff; font-family: var(--f-ital); font-style: italic; font-size: 17px; }

/* escudo */
.escudo { display: grid; grid-template-columns: 290px 1fr; gap: 18px; align-items: start; }
@media (max-width: 980px) { .escudo { grid-template-columns: 1fr; } }
.feed { background: var(--painel); border: 1px solid var(--linha); display: grid; align-content: start; max-height: 80vh; overflow: auto; position: sticky; top: 84px; }
@media (max-width: 980px) { .feed { position: static; max-height: 360px; } }
.feed .cab-f { padding: 12px 14px; border-bottom: 1px solid var(--linha); display: flex; justify-content: space-between; align-items: center; }
.rol { padding: 10px 14px; border-bottom: 1px solid var(--linha); display: grid; grid-template-columns: 38px 1fr; gap: 10px; align-items: start; }
.rol-tx { display: grid; gap: 3px; min-width: 0; }
.rol-av { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--linha-2); background: var(--painel-3) center/cover no-repeat; display: grid; place-items: center; font: 700 13px var(--f-mono); color: var(--lua-dim); }
.btn-hist { position: fixed; z-index: 41; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); width: 54px; height: 54px; border-radius: 50%; border: 1px solid var(--linha-2); background: var(--painel-3); color: var(--lua); display: grid; place-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.5); cursor: pointer; }
.btn-hist svg { width: 24px; height: 24px; }
.hist-gaveta { position: fixed; z-index: 45; top: 0; right: 0; bottom: 0; width: min(380px, 100vw); background: var(--painel); border-left: 1px solid var(--linha-2); display: grid; grid-template-rows: auto 1fr; box-shadow: -10px 0 30px rgba(0,0,0,.5); padding-top: env(safe-area-inset-top, 0px); }
.hist-topo { padding: 12px 14px; border-bottom: 1px solid var(--linha); display: grid; gap: 8px; }
.hist-cab { display: flex; justify-content: space-between; align-items: center; }
.hist-lista { overflow-y: auto; overscroll-behavior: contain; padding-bottom: 80px; }
.rol .l1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.rol .total { font: 700 22px var(--f-mono); }
.rol.oculta { background: rgba(123,92,168,.12); }
.combatente { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; background: var(--painel); border: 1px solid var(--linha); padding: 10px 12px; }
.combatente.vez { border-color: var(--ouro); box-shadow: inset 3px 0 0 var(--ouro); }
.combatente .ini { width: 64px; text-align: center; font: 700 20px var(--f-mono); }
.combatente .ini input { width: 64px; text-align: center; font: 700 18px var(--f-mono); padding: 6px 2px; }

<script>
'use strict';
/* =================================================================
   NÚCLEO
   ================================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const nl = s => esc(s).replace(/\n/g, '<br>');
const app = $('#app');
const CADEADO = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
const DADO_SVG = '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 2 21 7v10l-9 5-9-5V7z"/><path d="M12 2 7 10h10zM3 7l4 3-4 7M21 7l-4 3 4 7M7 10l5 12 5-12"/></svg>';
const ICON_BUSCA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>';
const ATR = [['forca','Força','FOR'],['destreza','Destreza','DES'],['constituicao','Constituição','CON'],['inteligencia','Inteligência','INT'],['presenca','Presença','PRE']];
const SIGLA = Object.fromEntries(ATR.map(a => [a[0], a[2]]));
const ELEMS = ['Guerra','Fome','Peste','Morte','Neutro','Conquista','Karma','Destino','Caos'];
const elDe = nomeAl => String(nomeAl || '').replace(/ \(.*\)$/, '');
const elTag = e => `<span class="el ${e ? 'el-' + esc(e) : 'el-x'}">${esc(e || 'Indefinido')}</span>`;
const iniciais = n => (n || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();
const fmtKg = n => (Math.round(n * 10) / 10).toLocaleString('pt-BR') + 'kg';
const corDe = id => { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `hsl(${h % 360} 45% 62%)`; };
const dataBR = t => t ? new Date(t).toLocaleDateString('pt-BR') : '';
const horaBR = t => t ? new Date(t).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
const uid8 = () => Math.random().toString(36).slice(2, 10);
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* ---------- dados estáticos do sistema ---------- */
let SIS = null, CRI = [], RIT = [], LORE = null, FEIT = [];
async function carregarBase() {
  const [s, c, r, f] = await Promise.all(['dados/sistema.json', 'dados/criaturas.json', 'dados/rituais.json', 'dados/feiticos.json'].map(u => fetch(u).then(x => x.json())));
  SIS = s; CRI = c; RIT = r; FEIT = f;
}
const classe = n => SIS.classes.find(c => c.nome === n);
const subclasse = (c, s) => classe(c)?.subclasses.find(x => x.nome === s);
const patente = n => SIS.patentes.find(p => n >= p.de && n <= p.ate) || SIS.patentes[0];
const vontade = n => SIS.vontades.find(v => v.nome === n);
// Perícias que a Vontade dá. "A|B" é escolha do jogador (ex.: Ocultismo ou Bruxaria); sem escolha, vale a primeira.
const opcoesVontade = n => (vontade(n)?.pericias || []).filter(x => x.includes('|'));
const periciasVontade = (n, escolha = {}) => (vontade(n)?.pericias || []).map(x => x.includes('|') ? (x.split('|').includes(escolha?.[x]) ? escolha[x] : x.split('|')[0]) : x);
const textoBonusVontade = v => v.pericias.map(x => '+1 ' + x.split('|').join(' ou ')).join(' / ');
function seletorEscolhaVontade(nomeV, escolha, idPref) {
  return opcoesVontade(nomeV).map((op, i) => `<div class="campo"><label class="rotulo" for="${idPref}-${i}">Vontade de ${esc(nomeV)}: escolha a perícia</label>
    <select id="${idPref}-${i}" data-op-vontade="${esc(op)}">${op.split('|').map(x => `<option ${(escolha?.[op] || op.split('|')[0]) === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>`).join('');
}
const nivelAm = n => SIS.niveisAmeaca.find(x => x[0] === +n) || [n, '?', ''];
function pontosAtributo(nivel) { let p = 12; if (nivel >= 4) p += 2; if (nivel >= 8) p += 3; if (nivel >= 12) p += 5; return p; }
// Pontos de perícia: a base da classe (+ Int) na criação e de novo a cada patente alcançada (Veterano no 5, Alto Escalão no 9)
const patentesAlcancadas = nivel => SIS.patentes.filter(p => nivel >= p.de).length;
function pontosPericiaTotal(cls, intel, nivel) { const C = classe(cls); return ((C?.pericias || 0) + (intel || 0)) * patentesAlcancadas(nivel); }
function pontosPericia(f) { const total = pontosPericiaTotal(f.classe, f.atributos?.inteligencia, +f.nivel || 1); const gastos = (f.pericias || []).reduce((a, p) => a + (+p.pontos || 0), 0); return { total, gastos, livres: total - gastos }; }
function qtdPassivas(nivel) { return [2, 6, 9, 11].filter(x => nivel >= x).length; }

/* ---------- regras de cálculo ---------- */
const ehBruxa = f => f?.classe === 'Bruxa';
const nivelFeitMax = f => Math.max(0, ...(SIS.feiticoNivel || []).filter(x => (+f?.nivel || 1) >= x.desde).map(x => x.nivel));
const desdeFeit = n => (SIS.feiticoNivel || []).find(x => x.nivel === +n)?.desde || 1;
const reqFeitico = r => [r.ingrediente, r.item].filter(Boolean);
const USOS_SACO = 3, ehSaco = it => /^Saco de Ingredientes/i.test(it?.nome || '');
const usosSaco = it => it.usos ?? USOS_SACO;
const tagUsos = it => ehSaco(it) ? `<span class="tag">${usosSaco(it)}/${USOS_SACO} usos</span>` : '';
const htmlReq = r => (r.ingrediente || r.item || r.sacrificio) ? `<p class="preparo"><b>Requer.</b> ${[r.ingrediente ? r.ingrediente + ' (1 uso)' : '', r.item ? r.item + ' (consumido)' : ''].filter(Boolean).map(esc).join(' + ')}${r.sacrificio ? `<br><b>Sacrifício.</b> ${esc(r.sacrificio)}` : ''}</p>` : '';
const tagNivelF = r => r.nivel ? `<span class="tag">Nível ${esc(r.nivel)}</span>` : '';
const sabeFeitico = f => ehBruxa(f) || (f?.passivas || []).some(p => p.nome === 'Aprender Feitiço') || (f?.habilidades || []).some(p => p.nome === 'Aprender Feitiço');
const vetorLiberado = f => !!(f?.vetor?.liberado);
const vetorAtivo = f => vetorLiberado(f) && !!f.vetorVestido;
const fotoEf = f => (vetorAtivo(f) && f.vetor.foto) || f?.foto || '';
function calc(f) {
  const C = classe(f.classe) || { pv: 0, ps: 0, pst: 0 };
  const A = f.atributos || {}, N = +f.nivel || 1;
  const VB = vetorAtivo(f) ? 5 * N : 0;
  const pt = n => (f.pericias || []).find(p => p.nome === n)?.pontos || 0;
  const vig = pt('Vigor'), vtd = pt('Vontade');
  const max = {
    pv:  8 + (C.pv + (A.constituicao || 0)) * N + vig * 5,
    ps:  5 + (C.ps + (A.inteligencia || 0)) * N + vtd * 5,
    pst: 5 + (C.pst + (A.constituicao || 0)) * N + vig * 2,
  };
  if (VB) { max.pv += VB; max.ps += VB; max.pst += VB; }
  const form = {
    pv: `8 + (${C.pv} + ${A.constituicao || 0}) × ${N}${vig ? ` + ${vig * 5} Vigor` : ''}`,
    ps: `5 + (${C.ps} + ${A.inteligencia || 0}) × ${N}${vtd ? ` + ${vtd * 5} Vontade` : ''}`,
    pst: `5 + (${C.pst} + ${A.constituicao || 0}) × ${N}${vig ? ` + ${vig * 2} Vigor` : ''}`,
  };
  if (VB) for (const k in form) form[k] += ` + ${VB} Vetor`;
  const eq = f.equipamentos || [];
  const bruto = eq.reduce((s, i) => s + (+i.peso || 0) * (+i.qtd || 1), 0);
  const alivio = eq.reduce((s, i) => s + (+i.alivio || 0), 0);
  const carga = Math.max(0, bruto - alivio);
  const cc = ((A.forca || 0) + (A.constituicao || 0)) * 2;
  const rd = eq.reduce((s, i) => s + (+i.rd || 0), 0);
  return { max, form, carga, cc, rd, mov: 5 + (A.destreza || 0), pat: patente(N), vb: VB };
}
function dadosPericia(f, nome) {
  const p = (f.pericias || []).find(x => x.nome === nome);
  const base = SIS.pericias.find(x => x.nome === nome);
  const atr = p?.atributo || base?.atributo || 'inteligencia';
  const vt = periciasVontade(f.vontade, f.vontadeEscolha).includes(nome) ? 1 : 0;
  const pontos = p?.pontos || 0;
  // Vetor vestido: +1 em toda perícia, mesmo passando do limite; passou do limite, ganha +1 dado
  const vb = vetorAtivo(f) ? 1 : 0;
  const alem = vb && pontos + 1 > patente(+f.nivel || 1).limite ? 1 : 0;
  return { pontos, vt, vb, alem, atr, dados: Math.max(1, pontos + vt + vb + alem), mod: f.atributos?.[atr] || 0 };
}

/* ---------- dados (rolagem) ---------- */
const d = s => 1 + Math.floor(Math.random() * s);
// "2d8+1d6+3" soma; "3d20m+4" = 3d20 fica o maior
function rolar(expr) {
  const limpo = String(expr).replace(/\s/g, '').toLowerCase();
  if (!limpo) return null;
  let total = 0; const partes = [];
  const termos = limpo.match(/[+-]?[^+-]+/g) || [];
  for (const t of termos) {
    const s = t[0] === '-' ? -1 : 1, c = t.replace(/^[+-]/, '');
    let m = /^(\d*)d(\d+)(m?)$/.exec(c);
    if (m) {
      const q = Math.min(100, +(m[1] || 1)), f = +m[2];
      if (!f) return null;
      const ds = Array.from({ length: q }, () => d(f));
      if (m[3]) { const mx = Math.max(...ds); let marcou = false; total += s * mx;
        partes.push(`[${ds.map(x => { if (!marcou && x === mx) { marcou = true; return `<span class="melhor">${x}</span>`; } return x; }).join(', ')}]`);
      } else { total += s * ds.reduce((a, b) => a + b, 0); partes.push(`${s < 0 ? '-' : ''}[${ds.join(', ')}]`); }
    } else if (/^\d+$/.test(c)) { total += s * +c; partes.push(`${s < 0 ? '- ' : '+ '}${c}`); }
    else return null;
  }
  return { total, detalhe: partes.join(' ') };
}
function teste(qtd, mod) {
  const ds = Array.from({ length: Math.max(1, qtd) }, () => d(20));
  const mx = Math.max(...ds); let marcou = false;
  const lista = ds.map(x => { if (!marcou && x === mx) { marcou = true; return `<span class="melhor">${x}</span>`; } return x; }).join(', ');
  return { total: mx + mod, nat: mx, nat20: mx === 20, detalhe: `[${lista}] ${mod >= 0 ? '+' : '-'} ${Math.abs(mod)}` };
}
const veredito = (total, dt) => dt ? (total >= dt ? ` contra DT ${dt}: <span class="ok">Sucesso</span>` : ` contra DT ${dt}: <span class="falha">Falha</span>`) : '';

function desenharLua(cv) {
  const ctx = cv.getContext('2d'), W = cv.width, c = W / 2, R = W * 0.3;
  let t0 = performance.now(), parar = false;
  const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const linhas = Array.from({ length: 28 }, (_, i) => ({ a: i / 28 * Math.PI * 2, r: R * (1.08 + (i % 5) * .08), v: (i % 2 ? 1 : -1) * (.00006 + (i % 7) * .00002) }));
  function quadro(t) {
    if (!cv.isConnected) return;
    const dt = t - t0;
    ctx.clearRect(0, 0, W, W);
    linhas.forEach((l, i) => {
      ctx.beginPath(); const a = l.a + dt * l.v;
      ctx.arc(c, c, l.r, a, a + 1.1 + (i % 3) * .5);
      ctx.strokeStyle = i % 4 === 0 ? 'rgba(180,51,59,.55)' : 'rgba(200,163,90,.28)'; ctx.lineWidth = i % 4 === 0 ? 2 : 1; ctx.stroke();
    });
    const g = ctx.createRadialGradient(c - R * .3, c - R * .3, R * .1, c, c, R);
    g.addColorStop(0, '#e7e3d6'); g.addColorStop(1, '#8a8678');
    ctx.beginPath(); ctx.arc(c, c, R, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = 'rgba(11,13,20,.86)'; ctx.beginPath(); ctx.arc(c + R * .42 + Math.sin(dt / 4000) * R * .05, c - R * .1, R * .95, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.beginPath(); ctx.arc(c - R * .28, c + R * .05, R * .13, 0, Math.PI * 2); ctx.fillStyle = 'rgba(11,13,20,.5)'; ctx.fill();
    ctx.beginPath(); ctx.arc(c - R * .28, c + R * .05, R * .05, 0, Math.PI * 2); ctx.fillStyle = '#b4333b'; ctx.fill();
    if (!reduz && !parar) requestAnimationFrame(quadro);
  }
  requestAnimationFrame(quadro);
}

  function ligar() {
    $('#zerar').onclick = () => { try { localStorage.removeItem(CH); } catch (e) {} ROTAS.novo(); };
    $('#voltar').onclick = () => { R.passo--; render(); };
    $('#avancar')?.addEventListener('click', () => { R.passo++; render(); });
    $('#nv')?.addEventListener('change', e => { R.nivel = +e.target.value; const lim = patente(R.nivel).limite; for (const k in R.atributos) R.atributos[k] = Math.min(R.atributos[k], lim); R.passivas = R.passivas.slice(0, qtdPassivas(R.nivel)); render(); });
    $$('[data-a]').forEach(b => b.onclick = () => { const k = b.dataset.a, lim = patente(R.nivel).limite; const usados = Object.values(R.atributos).reduce((a, x) => a + x, 0);
      const nv = R.atributos[k] + +b.dataset.d; if (nv < 0 || nv > lim) return; if (+b.dataset.d > 0 && usados >= pontosAtributo(R.nivel)) return; R.atributos[k] = nv; render(); });

    $$('#app [data-op-vontade]').forEach(sel => sel.onchange = () => { R.vontadeEscolha = { ...(R.vontadeEscolha || {}), [sel.dataset.opVontade]: sel.value }; render(); });
    $$('[data-cl]').forEach(b => b.onclick = () => { if (R.classe !== b.dataset.cl) { R.classe = b.dataset.cl; R.subclasse = ''; } render(); });
    $$('[data-sc]').forEach(b => b.onclick = () => { R.subclasse = b.dataset.sc; render(); });
    $$('[data-rp]').forEach(b => b.onclick = () => { R.passivas.splice(+b.dataset.rp, 1); render(); });
    $('#add-pas')?.addEventListener('click', () => seletor('Habilidades passivas', SIS.passivas.filter(p => !R.passivas.some(x => x.nome === p.nome)),
      p => `<b>${esc(p.nome)}</b><p>${esc(p.texto)}</p>`, p => { if (R.passivas.length < qtdPassivas(R.nivel)) { R.passivas.push(p); render(); $('#camada').innerHTML = ''; } }));
    $$('[data-pr]').forEach(b => b.onclick = () => { const tot = pontosPericiaTotal(R.classe, R.atributos.inteligencia, R.nivel);
      const gastos = Object.values(R.pericias).reduce((a, x) => a + x, 0); const n = b.dataset.pr, v = (R.pericias[n] || 0) + +b.dataset.d;
      if (v < 0 || v > patente(R.nivel).limite) return; if (+b.dataset.d > 0 && gastos >= tot) return; R.pericias[n] = v; if (!v) delete R.pericias[n]; render(); });
    $$('[data-t]').forEach(i => i.addEventListener('input', () => { R[i.dataset.t] = i.value; guardar(); if (i.dataset.t === 'nome') $('#finalizar').disabled = !R.nome.trim(); }));
    $('#foto-url')?.addEventListener('change', e => { R.foto = e.target.value.trim(); render(); });
    $('#foto-arq')?.addEventListener('change', async e => { const f = e.target.files[0]; if (!f) return; const u = await enviarImagem(f); if (u) { R.foto = u; render(); } });
    $('#finalizar')?.addEventListener('click', async e => {
      e.target.disabled = true; e.target.textContent = 'Registrando…';
      const vt = periciasVontade(R.vontade, R.vontadeEscolha);
      const nomes = new Set([...Object.keys(R.pericias), ...vt]);
      const ficha = { dono: ME, criado: Date.now(), nome: R.nome.trim(), jogador: R.jogador, idade: R.idade, vontade: R.vontade, vontadeEscolha: R.vontadeEscolha || {}, vetor: R.vetor, classe: R.classe, subclasse: R.subclasse, nivel: R.nivel,
        atributos: R.atributos, pericias: [...nomes].map(n => ({ nome: n, pontos: R.pericias[n] || 0, atributo: SIS.pericias.find(p => p.nome === n)?.atributo || 'inteligencia' })),
        equipamentos: [], passivas: R.passivas, habilidades: [], rituais: [], aparencia: R.aparencia, personalidade: R.personalidade, historico: R.historico, objetivo: R.objetivo, foto: R.foto, campanhas: [], anotacoes: '' };
      const m = calc(ficha).max; ficha.atual = { ...m };
      try { const ref = await db.collection('fichas').add(ficha); try { localStorage.removeItem(CH); } catch (x) {} window._abaFicha = 'alinhamento'; location.hash = 'agente-' + ref.id; }
      catch (err) { e.target.disabled = false; e.target.textContent = 'Finalizar agente'; toast(err.code === 'quota_exceeded' ? 'O arquivo está cheio. Apague agentes antigos.' : 'Não deu para salvar: ' + (err.message || err.code)); }
    });
  }
  render();
};

ROTAS.agente = async id => {

  async function salvar(campos) { try { await ref.update(campos); } catch (e) { toast('Não deu para salvar: ' + (e.message || e.code)); } }
  function formAuto(nome) {

        F.autos = { ...(F.autos || {}), [nome]: cfg }; salvar({ autos: F.autos }); fechar(); render(); };
      m.querySelector('#au-rm')?.addEventListener('click', () => { const x = { ...(F.autos || {}) }; delete x[nome]; F.autos = x; salvar({ autos: x }); fechar(); render(); });

  }
  function usarHab(nome, armaEscolhida) {

    if (a.ataques && arma) {

  async function checarPermissao() {

  assinar(ref.onSnapshot(async s => {

      const PP = pontosPericia(F), nPat = patentesAlcancadas(+F.nivel || 1);

      const escolhaV = opcoesVontade(F.vontade).length && podeEditar ? `<div class="caixa grade-campos">${seletorEscolhaVontade(F.vontade, F.vontadeEscolha, 'fvesc')}</div>` : '';

            <select data-patr="${esc(n)}" style="width:auto; padding:4px">${ATR.map(([k, , s]) => `<option value="${k}" ${P.atr === k ? 'selected' : ''}>${s}</option>`).join('')}</select></div>

    if (aba === 'combate') {

        return `<div class="item"><div class="cab"><span class="nm">${esc(it.nome)} <span class="mono dim" style="font-weight:400; font-size:13px">${esc(it.dano)}</span></span><span style="display:flex; gap:6px">${it.tipoDano ? `<span class="tag">${esc(it.tipoDano)}</span>` : ''}${it.alcance ? `<span class="tag">${esc(it.alcance)}</span>` : ''}<span class="tag crit">${(+it.margem || 20) < 20 ? `${+it.margem}/` : ''}×${it.mult || 1}</span><span class="tag">${esc(it.pericia || 'Armas Brancas')} ${P.dados}d20+${P.mod}</span></span></div>

        <div class="lista">${AL.niveis.map((t, i) => `<article class="hab al-hab ${i < nv ? '' : 'bloq'}"><div class="cab"><span class="nm">${['Primeiro', 'Segundo', 'Terceiro', 'Quarto'][i]} nível</span>${i < nv ? `<span class="tag" style="color:var(--ca); border-color:var(--ca)">Desperto</span>` : `<span class="tag">${CADEADO} Trancado</span>`}</div><p>${esc(t)}</p></article>`).join('')}</div>
        <div style="display:flex; gap:8px; flex-wrap:wrap">${temRit && podeEditar ? `<button class="btn sec" id="al-rit">Aprender ritual de ${esc(el)}</button>` : ''}${ehMestre ? '<button class="btn sec" id="al-trocar">Retirar alinhamento</button>' : ''}</div>

          <div class="trilho fino"><div class="cheio" style="width:${Math.min(100, pct / 2)}%; background:var(--lua-dim)"></div></div><span class="dim" style="font-size:13px">${esc(est.texto)}</span></div>

function rolaveis(txt) { return [...new Set((String(txt || '').match(/\b\d+d\d+(?:\s*\+\s*\d+(?:d\d+)?)*\b/g) || []).map(x => x.replace(/\s/g, '')))].slice(0, 3); }
function pentagono(A) {
  const cx = 150, cy = 148, R = 104; const esc_ = Math.max(5, ...ATR.map(a => A?.[a[0]] || 0));
  const pt = (i, r) => { const ang = -Math.PI / 2 + i * 2 * Math.PI / 5; return [cx + r * Math.cos(ang), cy + r * Math.sin(ang)]; };
  let s = '';
  for (let k = 1; k <= esc_; k++) s += `<polygon points="${ATR.map((_, i) => pt(i, R * k / esc_).join(',')).join(' ')}" fill="none" stroke="rgba(190,198,224,${k === esc_ ? .28 : .1})"/>`;
  ATR.forEach((_, i) => { const [x, y] = pt(i, R); s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(190,198,224,.1)"/>`; });
  s += `<polygon points="${ATR.map((a, i) => pt(i, R * Math.max(.04, (A?.[a[0]] || 0) / esc_)).join(',')).join(' ')}" fill="rgba(180,51,59,.28)" stroke="#e3666d" stroke-width="1.5"/>`;
  ATR.forEach((a, i) => { const [x, y] = pt(i, R * Math.max(.04, (A?.[a[0]] || 0) / esc_)); s += `<circle cx="${x}" cy="${y}" r="3.5" fill="#e3666d"/>`; const [lx, ly] = pt(i, R + 20); s += `<text x="${lx}" y="${ly + 4}" text-anchor="middle" fill="#8f95ab" font-family="Barlow, sans-serif" font-size="11" letter-spacing="1.5">${a[2]}</text>`; });
  return s;
}

async function homebrewVisivel(tipo) {
  if (!db) return [];
  try {
    const [meus, comp] = await Promise.all([db.collection('homebrew').where('autor', '==', ME).get(), db.collection('homebrew').where('compartilhado', '==', true).get()]);
    const m = new Map(); [...meus.docs, ...comp.docs].forEach(x => m.set(x.id, { id: x.id, ...x.data() }));
    return [...m.values()].filter(x => !tipo || x.tipo === tipo);
  } catch (e) { return []; }
}
const TIPOS_HB = [['ameaca', 'Ameaças'], ['habilidade', 'Habilidades'], ['ritual', 'Rituais'], ['feitico', 'Feitiços'], ['item', 'Itens']];

    try { if (base.id) await db.doc('homebrew/' + base.id).set(obj); else await db.collection('homebrew').add(obj); toast('Salvo no homebrew.'); }
    catch (e) { toast('Não deu para salvar: ' + (e.message || e.code)); }

function ouvirCampanha(id, aoMudar) {
  const st = { camp: null, agentes: {}, fichas: {}, membros: [], rolagens: [], pistas: [], relatorios: [], combate: null };
  const subsFicha = {};
  assinar(db.doc('campanhas/' + id).onSnapshot(s => { st.camp = s.exists ? { id, ...s.data() } : false; aoMudar(st); }));
  assinar(db.collection(`campanhas/${id}/agentes`).onSnapshot(s => {
    const ids = s.docs.map(x => x.id); st.agentes = Object.fromEntries(s.docs.map(x => [x.id, x.data()]));
    ids.forEach(fid => { if (!subsFicha[fid]) subsFicha[fid] = assinar(db.doc('fichas/' + fid).onSnapshot(fs => { st.fichas[fid] = fs.exists ? { id: fid, ...fs.data() } : null; aoMudar(st); })); });
    Object.keys(subsFicha).forEach(fid => { if (!ids.includes(fid)) { subsFicha[fid](); delete subsFicha[fid]; delete st.fichas[fid]; } });
    aoMudar(st);
  }));
  assinar(db.collection(`campanhas/${id}/membros`).onSnapshot(s => { st.membros = s.docs.map(x => x.data()); aoMudar(st); }));
  assinar(db.collection(`campanhas/${id}/rolagens`).orderBy('t', 'desc').limit(40).onSnapshot(s => { st.rolagens = s.docs.map(x => ({ id: x.id, ...x.data() })); aoMudar(st, 'rolagens'); }));
  assinar(db.doc(`campanhas/${id}/publico/pistas`).onSnapshot(s => { st.pistas = s.exists ? s.data().itens || [] : []; aoMudar(st); }));
  assinar(db.doc(`campanhas/${id}/publico/relatorios`).onSnapshot(s => { st.relatorios = s.exists ? s.data().itens || [] : []; aoMudar(st); }));
  assinar(db.doc(`campanhas/${id}/publico/combate`).onSnapshot(s => { st.combate = s.exists ? s.data() : null; aoMudar(st); }));
  return st;
}

  assinar(sair);

}

    $('#dados-expr')?.addEventListener('keydown', e => { if (e.key === 'Enter') $('#dados-ok').click(); });

function editarVetor(f, v = {}, salvarFn) {
  v = v || {};
  abrirModal(v.nome ? 'Editar vetor' : 'Criar vetor', `<p class="dim">Vetor de <b>${esc(f.nome)}</b>. Ninguém além de você vê isto até você dar a chave.</p>
    <div class="grade-campos"><div class="campo"><label class="rotulo" for="vt-n">Nome do vetor</label><input type="text" id="vt-n" value="${esc(v.nome)}" placeholder="Rosto Oco"></div>
    <div class="campo"><label class="rotulo" for="vt-c">Cor</label><input type="color" id="vt-c" value="${esc(v.cor || '#b4333b')}" style="width:80px; height:40px; padding:2px"></div></div>
    <div class="campo"><label class="rotulo" for="vt-f">Foto do vetor</label><div style="display:flex; gap:12px; align-items:center"><div id="vt-prev" class="ava" style="width:64px; height:64px; ${v.foto ? `background:center/cover url('${esc(v.foto)}')` : 'background:var(--painel-3)'}"></div><input type="file" id="vt-f" accept="image/*"></div></div>
    <div class="campo"><label class="rotulo" for="vt-d">Descrição (o que o jogador lê ao receber)</label><textarea id="vt-d" style="min-height:80px">${esc(v.descricao)}</textarea></div>
    <div class="campo"><label class="rotulo" for="vt-h">Habilidades extras (uma por linha: Nome: efeito)</label><textarea id="vt-h" style="min-height:140px" placeholder="Intangível: uma vez por rodada, teste de Vontade DT 18 para ficar Intangível até o próximo turno.">${esc((v.habilidades || []).map(h => `${h.nome}: ${h.texto}`).join('\n'))}</textarea></div>
    <button class="btn" id="vt-ok">Salvar vetor</button>`, (m, fechar) => {
    let foto = v.foto || '';
    m.querySelector('#vt-f').onchange = async e => { const u = e.target.files[0] && await enviarImagem(e.target.files[0]); if (u) { foto = u; m.querySelector('#vt-prev').style.background = `center/cover url('${u}')`; } };
    m.querySelector('#vt-ok').onclick = () => { const nome = m.querySelector('#vt-n').value.trim(); if (!nome) return toast('Dê um nome ao vetor.');
      const habilidades = m.querySelector('#vt-h').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const i = l.indexOf(':'); return i > 0 ? { nome: l.slice(0, i).trim(), texto: l.slice(i + 1).trim() } : { nome: l, texto: '' }; });
      salvarFn({ nome, cor: m.querySelector('#vt-c').value, foto, descricao: m.querySelector('#vt-d').value.trim(), habilidades }); fechar(); };
  });
}
ROTAS.escudo = async id => {

  if (!camp.exists) { app.innerHTML = '<div class="vazio">Campanha não encontrada.</div>'; return; }
  if (camp.data().mestre !== ME) { app.innerHTML = `<div class="vazio">Só o mestre desta campanha abre o escudo. <a href="#campanha-${esc(id)}">Voltar para a campanha</a></div>`; return; }
  const refE = db.doc(`mestre/${ME}/escudo/${id}`);
  let E = { anotacoes: { geral: '', futuras: '', anteriores: '' }, combate: { rodada: 1, turno: 0, lista: [], ativo: false }, pistas: [], ocultas: [] };
  try { const s = await refE.get(); if (s.exists) E = { ...E, ...s.data() }; } catch (e) {}
  let aba = 'agentes', gravando = Promise.resolve();
  const VETORES = {};
  assinar(db.collection(`mestre/${ME}/vetores`).where('campanha', '==', id).onSnapshot(s => { for (const k in VETORES) delete VETORES[k]; s.docs.forEach(d => VETORES[d.id] = d.data()); if (aba === 'vetores') render(); }));
  const salvarE = debounce(() => { gravando = gravando.then(() => refE.set(E)).catch(() => toast('Não deu para salvar o escudo.')); }, 600);
  const publicarCombate = debounce(() => {
    const c = E.combate; const ordem = c.lista.map(x => ({ nome: x.nome, tipo: x.tipo, ini: x.ini, cond: x.cond || [] }));
    db.doc(`campanhas/${id}/publico/combate`).set({ ativo: !!c.ativo && c.lista.length > 0, rodada: c.rodada, turno: c.turno, ordem }).catch(() => {});
  }, 400);
  const publicarPistas = () => db.doc(`campanhas/${id}/publico/pistas`).set({ itens: E.pistas.filter(p => p.revelada).map(({ titulo, texto, imagem }) => ({ titulo, texto, imagem: imagem || '' })) }).catch(() => toast('Não deu para publicar as pistas.'));
  let st;
  const rolarMestre = async (rotulo, r, oculta) => {
    if (oculta) { E.ocultas = [{ autor: 'Mestre', rotulo, detalhe: r.detalhe, total: r.total, t: Date.now(), oculta: true }, ...(E.ocultas || [])].slice(0, 30); salvarE(); desenharFeed(); }
    else { try { await db.collection(`campanhas/${id}/rolagens`).add({ uid: ME, autor: 'Mestre', rotulo, detalhe: r.detalhe, total: r.total, t: Date.now() }); } catch (e) {} }
  };
  let publico = false;

  app.innerHTML = `<div class="cab-pagina"><div><span class="rotulo">Escudo do mestre</span><h1>${esc(camp.data().nome)}</h1></div><div style="display:flex; gap:8px; flex-wrap:wrap"><a class="btn sec" href="#campanha-${esc(id)}" style="text-decoration:none">Ver como jogador</a></div></div>
    <div class="escudo" id="escudo"><aside class="feed" id="feed"></aside><div style="display:grid; gap:16px; min-width:0"><div class="abas" id="abas-e"></div><div id="corpo-e"></div></div></div>`;
  function desenharFeed() {
    const todas = [...(st?.rolagens || []), ...(E.ocultas || [])].sort((a, b) => b.t - a.t).slice(0, 40);
    $('#feed').innerHTML = `<div class="cab-f"><b>Resultados</b><span class="faint" style="font-size:12px">${todas.length}</span></div>${todas.map(rolHtml).join('') || '<div class="vazio" style="font-size:15px">As rolagens dos jogadores aparecem aqui.</div>'}`;
  }
  st = ouvirCampanha(id, (s, tipo) => { desenharFeed(); if (tipo === 'rolagens') return; if (!document.activeElement?.closest?.('#corpo-e input, #corpo-e textarea, #corpo-e select')) render(); });

  function render() {

        <div style="display:flex; gap:8px; flex-wrap:wrap"><button class="btn sec mini" id="cb-ag">Adicionar agentes</button><button class="btn sec mini" id="cb-am">Adicionar ameaça</button><button class="btn sec mini" id="cb-npc">Adicionar NPC</button><button class="btn sec mini" id="cb-ini">Rolar iniciativa das ameaças</button><button class="btn sec mini" id="cb-ord">Ordenar</button><button class="btn-x" id="cb-limpar" style="font-size:13px">Limpar lista</button></div>
        <p class="faint" style="font-size:13px">Os jogadores veem a ordem e as condições, nunca os PV das ameaças.</p></div>
        <div class="lista">${c.lista.map((x, i) => { const f = x.tipo === 'agente' ? st.fichas[x.ref] : null; const K = f ? calc(f) : null; const pv = f ? (f.atual || K.max).pv : x.pv, pvM = f ? K.max.pv : x.pvMax;
          return `<div class="combatente ${c.ativo && i === c.turno ? 'vez' : ''}"><div class="ini"><input type="number" aria-label="Iniciativa de ${esc(x.nome)}" data-ini="${i}" value="${esc(x.ini ?? '')}"></div>

/* =================================================================
   LIGAÇÃO (voz por WebRTC, sinalização e presença pelo tempo real do Supabase)
   ================================================================= */
const CH = { sala: null, nomeSala: '', canal: null, dentro: false, local: null, pares: new Map(), mudo: false, presenca: {}, ctx: null, medidores: new Map(), timer: null, persona: null, ctxLig: null };
const ICE = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] }];
let ABA_INICIAL = null;
const MIC_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/><path d="M3 3l18 18" class="risco"/></svg>';

function abrirSala(campId, nome) {
  if (!sb || !ME) return false;
  if (CH.sala === campId) return true;
  if (CH.dentro) return false;           // já está em outra ligação
  fecharSala();
  CH.sala = campId; CH.nomeSala = nome;
  const canal = sb.channel('ligacao-' + campId, { config: { presence: { key: ME }, broadcast: { self: false } } });
  CH.canal = canal;
  canal.on('presence', { event: 'sync' }, () => {
    CH.presenca = Object.fromEntries(Object.entries(canal.presenceState()).map(([k, v]) => [k, v[v.length - 1]]));
    if (CH.dentro) conferirPares();
    desenharVoz();
  });
  canal.on('broadcast', { event: 'sinal' }, ({ payload }) => { if (CH.dentro && payload?.para === ME) tratarSinal(payload).catch(e => console.warn('sinal', e)); });
  canal.subscribe(st => { if (st === 'SUBSCRIBED' && CH.dentro) rastrear(); });
  return true;
}
function fecharSala() {
  if (CH.dentro || !CH.canal) return;
  try { sb.removeChannel(CH.canal); } catch (e) {}
  Object.assign(CH, { sala: null, canal: null, presenca: {} });
}
function rastrear() { CH.canal?.track({ ...(CH.persona || { nome: PERFIL?.nome || 'Agente' }), jogador: PERFIL?.nome || '', mudo: CH.mudo, t: Date.now() }).catch?.(() => {}); }

async function entrarLigacao(campId, nome) {
  if (!sb || !ME) return toast('Entre na sua conta para usar a ligação.');
  if (CH.dentro && CH.sala === campId) return;
  if (CH.dentro) await sairLigacao(true);
  if (!navigator.mediaDevices?.getUserMedia) return toast('Este navegador não deixa usar o microfone aqui.');
  try { CH.local = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false }); }
  catch (e) { return toast('Sem acesso ao microfone. Libere a permissão no navegador e tente de novo.'); }
  abrirSala(campId, nome);
  CH.dentro = true; CH.mudo = false;
  try { CH.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  medir(ME, CH.local);
  rastrear();
  CH.timer = setInterval(() => { conferirPares(); atualizarFala(); }, 150);
  desenharVoz();
}
async function sairLigacao(manterSala) {
  clearInterval(CH.timer); CH.timer = null;
  for (const id of [...CH.pares.keys()]) fecharPar(id);
  try { await CH.canal?.untrack(); } catch (e) {}
  CH.local?.getTracks().forEach(t => t.stop()); CH.local = null;
  try { await CH.ctx?.close(); } catch (e) {} CH.ctx = null; CH.medidores.clear();
  CH.dentro = false;
  const naTela = document.getElementById('ligacao')?.dataset.camp === CH.sala;
  if (!manterSala && !naTela) fecharSala();
  desenharVoz();
}
function enviarSinal(para, dados) { CH.canal?.send({ type: 'broadcast', event: 'sinal', payload: { ...dados, de: ME, para } }); }
function conferirPares() {
  if (!CH.dentro) return;
  const ids = Object.keys(CH.presenca).filter(i => i !== ME);
  for (const id of ids) if (!CH.pares.has(id) && ME < id) criarPar(id, true);
  for (const [id, p] of CH.pares) if (!ids.includes(id) || ['failed', 'closed'].includes(p.pc.connectionState)) fecharPar(id);
}
function criarPar(id, iniciador) {
  const pc = new RTCPeerConnection({ iceServers: ICE });
  const par = { pc, audio: new Audio(), pendentes: [], remoto: false };
  par.audio.autoplay = true; par.audio.playsInline = true;
  CH.pares.set(id, par);
  CH.local.getTracks().forEach(t => pc.addTrack(t, CH.local));
  pc.onicecandidate = e => { if (e.candidate) enviarSinal(id, { tipo: 'ice', cand: e.candidate.toJSON() }); };
  pc.ontrack = e => { const s = e.streams[0]; par.audio.srcObject = s; par.audio.play().catch(() => {}); medir(id, s); };
  pc.onconnectionstatechange = () => desenharVoz();
  if (iniciador) (async () => { const of = await pc.createOffer(); await pc.setLocalDescription(of); enviarSinal(id, { tipo: 'offer', sdp: pc.localDescription.toJSON() }); })().catch(e => console.warn(e));
  return par;
}
function fecharPar(id) { const p = CH.pares.get(id); if (!p) return; try { p.pc.close(); } catch (e) {} p.audio.srcObject = null; CH.pares.delete(id); CH.medidores.delete(id); }
async function tratarSinal(m) {
  if (m.tipo === 'offer') {
    if (CH.pares.has(m.de)) fecharPar(m.de);
    const par = criarPar(m.de, false);
    await par.pc.setRemoteDescription(m.sdp); par.remoto = true;
    for (const c of par.pendentes) await par.pc.addIceCandidate(c).catch(() => {});
    const r = await par.pc.createAnswer(); await par.pc.setLocalDescription(r);
    enviarSinal(m.de, { tipo: 'answer', sdp: par.pc.localDescription.toJSON() });
  } else if (m.tipo === 'answer') {
    const par = CH.pares.get(m.de); if (!par || par.pc.signalingState !== 'have-local-offer') return;
    await par.pc.setRemoteDescription(m.sdp); par.remoto = true;
    for (const c of par.pendentes) await par.pc.addIceCandidate(c).catch(() => {});
  } else if (m.tipo === 'ice') {
    const par = CH.pares.get(m.de); if (!par) return;
    if (par.remoto) await par.pc.addIceCandidate(m.cand).catch(() => {}); else par.pendentes.push(m.cand);
  }
}
function medir(id, stream) {
  if (!CH.ctx) return;
  try { const src = CH.ctx.createMediaStreamSource(stream); const an = CH.ctx.createAnalyser(); an.fftSize = 512; src.connect(an); CH.medidores.set(id, { an, buf: new Uint8Array(an.fftSize) }); } catch (e) {}
}
let ultimoFalante = null;
function atualizarFala() {
  if (CH.ctx?.state === 'suspended') CH.ctx.resume().catch(() => {});
  let maior = 0, falante = null;
  for (const [id, m] of CH.medidores) {
    m.an.getByteTimeDomainData(m.buf); let s = 0; for (const v of m.buf) { const x = (v - 128) / 128; s += x * x; }
    const rms = Math.sqrt(s / m.buf.length);
    const falando = rms > 0.04 && !(id === ME && CH.mudo) && !CH.presenca[id]?.mudo;
    if (falando && rms > maior) { maior = rms; falante = id; }
    document.querySelectorAll(`[data-voz="${CSS.escape(id)}"]`).forEach(el => el.classList.toggle('falando', falando));
  }
  // painel flutuante: mostra quem está falando (ou o seu personagem quando ninguém fala)
  const ava = document.getElementById('voz-ava'); if (!ava) return;
  const alvo = falante || ultimoFalanteValido() || ME;
  if (falante) { ultimoFalante = falante; ultimoFalanteEm = Date.now(); }
  if (ava.dataset.vozFixo !== alvo) {
    const p = alvo === ME ? (CH.persona || { nome: PERFIL?.nome || 'Você', cor: corDe(ME) }) : (CH.presenca[alvo] || { nome: '?', cor: corDe(alvo) });
    const cor = p.cor || corDe(alvo);
    ava.dataset.vozFixo = alvo; ava.style.setProperty('--cor', cor);
    ava.style.backgroundImage = p.foto ? `url('${p.foto.replace(/'/g, '%27')}')` : 'none'; ava.style.backgroundColor = p.foto ? '' : cor;
    ava.textContent = p.foto ? '' : iniciais(p.nome);
    const q = document.getElementById('voz-quem'); if (q) q.textContent = alvo === ME && !falante ? 'Voz conectada' : p.nome;
  }
  ava.classList.toggle('falando', !!falante);
}
let ultimoFalanteEm = 0;
function ultimoFalanteValido() { return ultimoFalante && Date.now() - ultimoFalanteEm < 1500 && (CH.presenca[ultimoFalante] || ultimoFalante === ME) ? ultimoFalante : null; }
function alternarMudo() { CH.mudo = !CH.mudo; CH.local?.getAudioTracks().forEach(t => t.enabled = !CH.mudo); rastrear(); desenharVoz(); }

/* persona: quem você interpreta nesta campanha */
function calcularPersona(st) {
  const meu = st?.membros?.find(m => m.uid === ME);
  const p = meu?.persona;
  if (!p) return { nome: PERFIL?.nome || 'Agente', foto: '', cor: corDe(ME), personagem: false };
  const f = p.ficha ? st.fichas?.[p.ficha] : null;
  return { nome: f?.nome || p.nome || PERFIL?.nome || 'Agente', foto: (f && fotoEf(f)) || p.foto || '', cor: p.cor || corDe(ME), personagem: !!(p.ficha || p.nome) };
}
function atualizarPersona(st) {
  const nova = calcularPersona(st);
  if (JSON.stringify(nova) !== JSON.stringify(CH.persona)) { CH.persona = nova; if (CH.dentro) rastrear(); }
}
function interpretarPersonagem(campId, C, st) {
  const meus = Object.values(st.fichas || {}).filter(f => f && f.dono === ME);
  const atual = st.membros?.find(m => m.uid === ME)?.persona || {};
  const mestre = C.mestre === ME;
  abrirModal('Interpretar personagem', `<p class="dim">Na ligação, todo mundo vê o nome, a foto e a cor de quem você interpreta.</p>
    <div class="campo"><label class="rotulo" for="ip-f">Personagem</label><select id="ip-f">
      <option value="">${mestre ? 'Personalizado (mestre, NPC, narrador)' : 'Eu mesmo, sem personagem'}</option>
      ${meus.map(f => `<option value="${esc(f.id)}" ${atual.ficha === f.id ? 'selected' : ''}>${esc(f.nome)}</option>`).join('')}</select></div>
    <div id="ip-custom" class="grade-campos"><div class="campo"><label class="rotulo" for="ip-n">Nome exibido</label><input type="text" id="ip-n" value="${esc(atual.nome || '')}" placeholder="${mestre ? 'Narrador' : esc(PERFIL?.nome || '')}"></div>
      <div class="campo"><label class="rotulo" for="ip-img">Imagem</label><input type="file" id="ip-img" accept="image/*"></div></div>
    <div class="campo"><label class="rotulo" for="ip-c">Cor do ícone</label><input type="color" id="ip-c" value="${esc(atual.cor || '#b4333b')}" style="width:80px; height:40px; padding:2px"></div>
    <div style="display:flex; gap:8px; flex-wrap:wrap"><button class="btn" id="ip-ok">Interpretar</button>${atual.ficha || atual.nome ? '<button class="btn sec" id="ip-limpar">Voltar a ser eu</button>' : ''}</div>`, (m, fechar) => {
    const sel = m.querySelector('#ip-f'), custom = m.querySelector('#ip-custom');
    const mostrar = () => { custom.hidden = !!sel.value; }; sel.onchange = mostrar; mostrar();
    let foto = atual.foto || '';
    m.querySelector('#ip-img').onchange = async e => { const u = e.target.files[0] && await enviarImagem(e.target.files[0]); if (u) { foto = u; toast('Imagem enviada.'); } };
    const gravar = async persona => { try { await db.doc(`campanhas/${campId}/membros/${ME}`).update({ persona }); fechar(); toast('Personagem atualizado na ligação.'); } catch (e) { toast('Não deu para salvar: ' + (e.message || e.code)); } };
    m.querySelector('#ip-ok').onclick = () => gravar(sel.value ? { ficha: sel.value, cor: m.querySelector('#ip-c').value } : { ficha: null, nome: m.querySelector('#ip-n').value.trim(), foto, cor: m.querySelector('#ip-c').value });
    m.querySelector('#ip-limpar')?.addEventListener('click', () => gravar(null));
  });
}

/* tela da ligação (aba) */
function montarLigacao(campId, C, st) {
  const el = document.getElementById('ligacao'); if (!el) return;
  el.dataset.camp = campId;
  CH.ctxLig = { campId, C, st };
  if (CH.sala !== campId || !CH.dentro) atualizarPersona(st); else atualizarPersona(st);
  if (!CH.dentro || CH.sala === campId) abrirSala(campId, C.nome);
  desenharVoz();
}
function tileVoz(id, p, conectando) {
  const cor = p.cor || corDe(id);
  return `<div class="tile" data-voz="${esc(id)}" style="--cor:${esc(cor)}">
    <div class="tile-ava" style="${p.foto ? `background-image:url('${esc(p.foto)}')` : `background:${esc(cor)}`}">${p.foto ? '' : esc(iniciais(p.nome))}</div>
    <div class="tile-nome"><b>${esc(p.nome)}</b>${p.jogador && p.jogador !== p.nome ? `<span>${esc(p.jogador)}</span>` : ''}</div>
    ${p.mudo ? `<span class="tile-mudo" title="Microfone desligado">${MIC_SVG}</span>` : ''}${conectando ? '<span class="tile-estado">Conectando…</span>' : ''}</div>`;
}
function desenharVoz() {
  // barra compacta quando a ligação está ativa e você está fora da aba
  const naAba = document.getElementById('ligacao')?.dataset.camp === CH.sala && CH.sala;
  let barra = document.getElementById('voz-barra');
  if (CH.dentro && !naAba) {
    if (!barra) { barra = document.createElement('section'); barra.id = 'voz-barra'; barra.className = 'voz-barra'; barra.setAttribute('aria-label', 'Ligação em andamento'); document.body.appendChild(barra); }
    const eu = CH.persona || { nome: PERFIL?.nome || 'Você', cor: corDe(ME), foto: '' };
    const gente = Object.entries(CH.presenca);
    barra.innerHTML = `<div class="voz-destaque" id="voz-ava" data-voz-fixo="${esc(ME)}" style="--cor:${esc(eu.cor)}; ${eu.foto ? `background-image:url('${esc(eu.foto)}')` : `background-color:${esc(eu.cor)}`}">${eu.foto ? '' : esc(iniciais(eu.nome))}</div>
      <div style="min-width:0"><div class="voz-ok"><span class="ponto-vivo"></span><span id="voz-quem">Voz conectada</span></div>
      <div class="voz-mini">${gente.map(([id, p]) => `<span class="ava" data-voz="${esc(id)}" title="${esc(p.nome)}" style="--cor:${esc(p.cor || corDe(id))}; ${p.foto ? `background:center/cover url('${esc(p.foto)}')` : `background:${esc(p.cor || corDe(id))}`}">${p.foto ? '' : esc(iniciais(p.nome))}</span>`).join('')}</div><a href="#campanha-${esc(CH.sala)}" id="voz-abrir" class="faint" style="font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block">${esc(CH.nomeSala)} · abrir ligação</a></div>
      <button class="vbtn ${CH.mudo ? 'ativo' : ''}" id="voz-mudo" aria-label="${CH.mudo ? 'Ligar microfone' : 'Silenciar'}">${MIC_SVG}</button><button class="vbtn sair" id="voz-sair" aria-label="Sair da ligação">✕</button>`;
    barra.querySelector('#voz-abrir').onclick = () => { ABA_INICIAL = 'ligacao'; };
    barra.querySelector('#voz-mudo').onclick = alternarMudo;
    barra.querySelector('#voz-sair').onclick = () => sairLigacao();
  } else barra?.remove();

  const el = document.getElementById('ligacao'); if (!el || !CH.ctxLig) return;
  const { campId, C, st } = CH.ctxLig;
  if (CH.dentro && CH.sala !== campId) {
    el.innerHTML = `<div class="vazio">Você está na ligação de <b>${esc(CH.nomeSala)}</b>.<br><button class="btn" id="trocar" style="margin-top:12px">Sair dela e entrar nesta</button></div>`;
    el.querySelector('#trocar').onclick = async () => { await sairLigacao(); abrirSala(campId, C.nome); entrarLigacao(campId, C.nome); };
    return;
  }
  const naLig = Object.entries(CH.presenca);
  const membros = [...new Set([C.mestre, ...(st.membros || []).map(m => m.uid)])];
  const fora = membros.filter(u => !CH.presenca[u]);
  const eu = CH.persona || calcularPersona(st);
  el.innerHTML = `<div class="call">
    <div class="call-main">
      <div class="call-topo"><span class="rotulo"><span class="ponto-vivo" style="${naLig.length ? '' : 'background:var(--lua-faint)'}"></span>Ligação · ${esc(C.nome)}</span>
        <span class="dim" style="font-size:13px">Você aparece como <b style="color:${esc(eu.cor)}">${esc(eu.nome)}</b></span></div>
      ${naLig.length ? `<div class="tiles n${Math.min(naLig.length, 9)}">${naLig.map(([id, p]) => tileVoz(id, p, CH.dentro && id !== ME && CH.pares.get(id)?.pc.connectionState !== 'connected')).join('')}</div>`
        : `<div class="call-vazia"><div class="tile-ava" style="${eu.foto ? `background-image:url('${esc(eu.foto)}')` : `background:${esc(eu.cor)}`}; --cor:${esc(eu.cor)}">${eu.foto ? '' : esc(iniciais(eu.nome))}</div><p>Ninguém na ligação ainda.</p></div>`}
      <div class="call-bar">
        <button class="btn sec" id="lg-persona">Interpretar personagem</button>
        ${CH.dentro ? `<button class="btn sec ${CH.mudo ? 'ouro' : ''}" id="lg-mudo">${CH.mudo ? 'Ligar microfone' : 'Silenciar'}</button><button class="btn" id="lg-sair" style="background:#a52a33">Sair da ligação</button>`
          : `<button class="btn" id="lg-entrar" style="background:var(--fole); border-color:var(--fole); color:#0b0d14">Entrar na ligação</button>`}
      </div>
    </div>
    <aside class="call-side">
      <div class="rotulo">Na ligação · ${naLig.length}</div>
      ${naLig.map(([id, p]) => `<div class="pessoa" data-voz="${esc(id)}" style="--cor:${esc(p.cor || corDe(id))}"><span class="ava" style="${p.foto ? `background:center/cover url('${esc(p.foto)}')` : `background:${esc(p.cor || corDe(id))}`}">${p.foto ? '' : esc(iniciais(p.nome))}</span><span style="min-width:0"><b style="display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${esc(p.nome)}</b>${p.jogador && p.jogador !== p.nome ? `<span class="faint" style="font-size:11.5px">${esc(p.jogador)}</span>` : ''}</span>${p.mudo ? `<span class="faint" style="margin-left:auto">${MIC_SVG}</span>` : ''}</div>`).join('') || '<p class="faint" style="font-size:13px">Vazia.</p>'}
      <div class="rotulo" style="margin-top:14px">Fora da ligação · ${fora.length}</div>
      <div id="lg-fora">${fora.map(u => `<div class="pessoa fora"><span class="ava" style="background:${corDe(u)}">·</span><span data-nome-uid="${esc(u)}">…</span></div>`).join('')}</div>
    </aside></div>`;
  nomeDe(fora).then(n => fora.forEach(u => { const s = el.querySelector(`[data-nome-uid="${CSS.escape(u)}"]`); if (s) { s.textContent = n[u] + (u === C.mestre ? ' (mestre)' : ''); s.previousElementSibling.textContent = iniciais(n[u]); } }));
  el.querySelector('#lg-persona').onclick = () => interpretarPersonagem(campId, C, st);
  el.querySelector('#lg-entrar')?.addEventListener('click', () => entrarLigacao(campId, C.nome));
  el.querySelector('#lg-mudo')?.addEventListener('click', alternarMudo);
  el.querySelector('#lg-sair')?.addEventListener('click', () => sairLigacao(true));
}
addEventListener('pagehide', () => { if (CH.dentro) { try { CH.canal?.untrack(); } catch (e) {} } });

/* =================================================================
   LOGIN
   ================================================================= */
ROTAS.entrar = async () => {
  app.className = 'pagina estreita';
  if (!sb) { app.innerHTML = '<div class="aviso">O site não encontrou a configuração do Supabase (config.js).</div>'; return; }
  if (ME) {
    app.innerHTML = `<div><span class="rotulo">Sua conta</span><h1>${esc(PERFIL?.nome || 'Agente')}</h1></div>
      <div class="caixa" style="display:grid; gap:12px"><div class="campo"><label class="rotulo" for="meu-nome">Nome que aparece na mesa</label><input type="text" id="meu-nome" value="${esc(PERFIL?.nome || '')}"></div>
      <div style="display:flex; gap:8px; flex-wrap:wrap"><button class="btn" id="salvar-nome">Salvar nome</button><button class="btn sec" id="sair-conta">Sair da conta</button></div>
      ${DONO ? '<span class="tag crit" style="justify-self:start">Administrador</span>' : ''}</div>`;
    $('#salvar-nome').onclick = async () => { const nome = $('#meu-nome').value.trim(); if (!nome) return toast('Escreva um nome.');
      const { error } = await sb.from('perfis').update({ nome }).eq('id', ME); if (error) return toast('Não deu para salvar: ' + error.message);
      PERFIL.nome = nome; PERFIS[ME] = nome; desenharQuem(); toast('Nome salvo.'); };
    $('#sair-conta').onclick = async () => { await sb.auth.signOut(); location.hash = 'inicio'; location.reload(); };
    return;
  }
  app.innerHTML = `<div><span class="rotulo">Acesso ao arquivo</span><h1>Entrar</h1></div>
    <div class="caixa" style="display:grid; gap:14px">
      <p class="dim">Digite seu e-mail. Você recebe um link de acesso, sem senha.</p>
      <div class="campo"><label class="rotulo" for="email">E-mail</label><input type="text" id="email" inputmode="email" autocomplete="email" placeholder="voce@exemplo.com"></div>
      <button class="btn" id="enviar-link" style="justify-self:start">Enviar link de acesso</button>
      <div id="msg-login" class="dim"></div>
      <hr style="border:none; border-top:1px solid var(--linha); width:100%">
      <button class="btn sec" id="discord" style="justify-self:start">Entrar com Discord</button>
    </div>`;
  $('#enviar-link').onclick = async () => {
    const email = $('#email').value.trim(); if (!/^\S+@\S+\.\S+$/.test(email)) return toast('E-mail inválido.');
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
    $('#msg-login').innerHTML = error ? `<span class="falha">${esc(error.message)}</span>` : 'Link enviado. Abra o e-mail neste mesmo navegador.';
  };
  $('#discord').onclick = async () => { const { error } = await sb.auth.signInWithOAuth({ provider: 'discord', options: { redirectTo: location.origin + location.pathname } }); if (error) toast('Discord não está ativado no Supabase: ' + error.message); };
};
function desenharQuem() {
  $('#quem').innerHTML = ME ? `<a href="#entrar" style="display:flex; gap:8px; align-items:center; color:var(--lua-dim); text-decoration:none"><span>${esc(PERFIL?.nome || '')}</span><span class="ava" style="background:${corDe(ME)}">${esc(iniciais(PERFIL?.nome || '?'))}</span></a>`
    : '<a class="btn mini" href="#entrar" style="text-decoration:none">Entrar</a>';
}

/* =================================================================
   INÍCIO DO APP
   ================================================================= */
async function carregarSessao(session) {
  ME = session?.user?.id || null; DONO = false; PERFIL = null;
  db = ME ? criarBanco(sb) : null;
  if (ME) {
    const { data } = await sb.from('perfis').select('id,nome,papel').eq('id', ME).maybeSingle();
    PERFIL = data || { id: ME, nome: session.user.email?.split('@')[0] || 'Agente', papel: 'jogador' };
    DONO = PERFIL.papel === 'admin'; PERFIS[ME] = PERFIL.nome;
  }
  desenharQuem();
}
(async function iniciar() {
  try { await carregarBase(); } catch (e) { app.innerHTML = '<div class="aviso">Não deu para carregar os dados do sistema. Abra o site por um servidor (não direto do arquivo) e recarregue.</div>'; return; }
  const cfg = window.ADR_CONFIG;
  if (window.supabase && cfg?.url && cfg?.chave) {
    sb = window.supabase.createClient(cfg.url, cfg.chave, { auth: { persistSession: true, detectSessionInUrl: true } });
    const { data } = await sb.auth.getSession();
    await carregarSessao(data.session);
    let primeiro = true;
    sb.auth.onAuthStateChange(async (ev, session) => {
      if (primeiro) { primeiro = false; if (ev === 'INITIAL_SESSION') return; }
      if ((session?.user?.id || null) !== ME) { await carregarSessao(session); if (location.hash === '#entrar' && ME) location.hash = 'agentes'; else rotear(); }
    });
  } else desenharQuem();
  rotear();
})();
</script>
