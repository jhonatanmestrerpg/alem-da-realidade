<title>Além da Realidade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@1&family=Barlow:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="banco.js"></script>
<style>
/* Layout: barra fixa no topo com a "linha do destino" (ouro > sangue > violeta), páginas em coluna
   central larga. Escudo do mestre: feed de rolagens à esquerda, abas à direita. Visual escuro único. */
:root {
  color-scheme: dark;
  --noite: #0b0d14; --painel: #121624; --painel-2: #191e30; --painel-3: #20263b;
  --linha: rgba(190,198,224,.13); --linha-2: rgba(190,198,224,.24);
  --lua: #dcdfe9; --lua-dim: #8f95ab; --lua-faint: #5b6075;
  --sangue: #b4333b; --sangue-hi: #e3666d; --ouro: #c8a35a; --violeta: #7b5ca8;
  --sanid: #5d86c4; --fole: #6fa58a;
  --guerra: #d0773a; --fome: #c23b45; --peste: #8a9a3c; --morte: #9aa0ad; --neutro: #c8a35a; --conquista: #a066c8; --karma: #b98ad8; --caos: #6b4fd0;
  --f-disp: 'IM Fell English SC', 'Times New Roman', serif;
  --f-ital: 'IM Fell English', 'Times New Roman', serif;
  --f-body: 'Barlow', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { background: var(--noite); }
body { margin: 0; color: var(--lua); font: 15px/1.5 var(--f-body); min-height: 100vh;
  background: radial-gradient(60vmax 60vmax at 90% -20%, rgba(200,163,90,.06), transparent 60%),
              radial-gradient(50vmax 50vmax at -10% 120%, rgba(180,51,59,.07), transparent 60%), var(--noite);
  background-attachment: fixed; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: #090b11; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ouro); outline-offset: 2px; }
a { color: var(--ouro); }
img { max-width: 100%; }

/* topo */
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: #090b11;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topo-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 18px; min-height: 64px; flex-wrap: wrap; padding-block: 6px; }
.marca { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--lua); }
.marca svg { width: 34px; height: 34px; }
.marca b { font: 400 22px/1 var(--f-disp); letter-spacing: .14em; }
.nav { display: flex; gap: 2px 18px; flex-wrap: wrap; flex: 1; }
.nav a { color: var(--lua-dim); text-decoration: none; font: 400 19px/1 var(--f-disp); padding: 8px 0; border-bottom: 1px solid transparent; }
.nav a:hover { color: var(--lua); }
.nav a.aqui { color: var(--lua); border-bottom-color: var(--ouro); }
.quem { font-size: 12px; color: var(--lua-dim); display: flex; align-items: center; gap: 8px; }
.ava { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 700 13px var(--f-body); color: #0b0d14; flex-shrink: 0; }
.linha-destino { height: 2px; background: linear-gradient(90deg, transparent, var(--ouro) 18%, var(--sangue) 55%, var(--violeta) 85%, transparent); }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 80px; }
.pagina { max-width: 1240px; margin: 0 auto; display: grid; gap: 20px; }
.estreita { max-width: 900px; }
h1, h2, h3 { font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font: 400 clamp(30px, 5vw, 48px)/1.05 var(--f-disp); }
h2 { font: 400 26px/1.1 var(--f-disp); }
h3 { font: 400 20px/1.15 var(--f-disp); }
p { margin: 0; }
.dim { color: var(--lua-dim); } .faint { color: var(--lua-faint); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.rotulo { font: 600 10.5px/1.2 var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--lua-faint); }
.cab-pagina { display: flex; justify-content: space-between; align-items: end; gap: 14px; flex-wrap: wrap; }

/* botões e campos */
.btn { border: 1px solid var(--sangue); background: var(--sangue); color: #fff; padding: 8px 14px; font: 600 13px/1.1 var(--f-body); letter-spacing: .04em; border-radius: 2px; }
.btn:hover { background: #c63e46; }
.btn.sec { background: transparent; color: var(--lua); border-color: var(--linha-2); }
.btn.sec:hover { border-color: var(--lua-dim); background: var(--painel-2); }
.btn.ouro { background: transparent; color: var(--ouro); border-color: var(--ouro); }
.btn.ouro:hover { background: rgba(200,163,90,.12); }
.btn.mini { padding: 4px 9px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-x { background: none; border: none; color: var(--lua-faint); font-size: 18px; line-height: 1; padding: 2px 6px; }
.btn-x:hover { color: var(--sangue-hi); }
input[type=text], input[type=number], input[type=search], select, textarea {
  background: #07080d; border: 1px solid var(--linha); padding: 8px 10px; border-radius: 2px; width: 100%; min-width: 0; }
textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ouro); }
.campo { display: grid; gap: 5px; min-width: 0; }
.busca { position: relative; }
.busca input { padding-left: 34px; }
.busca svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--lua-faint); }
.grade-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }

/* abas */
.abas { display: flex; gap: 2px 18px; border-bottom: 1px solid var(--linha); overflow-x: auto; flex-wrap: nowrap; }
.abas button { background: none; border: none; padding: 10px 0; color: var(--lua-dim); font: 400 17px/1 var(--f-disp); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.abas button:hover { color: var(--lua); }
.abas button.aqui { color: var(--lua); border-bottom-color: var(--sangue); }
.filtros { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--linha); background: var(--painel); color: var(--lua-dim); padding: 4px 10px; font-size: 12.5px; border-radius: 999px; }
.chip.aqui { color: var(--noite); background: var(--ouro); border-color: var(--ouro); font-weight: 600; }
.tag { font: 11px var(--f-mono); color: var(--lua-dim); border: 1px solid var(--linha); padding: 1px 6px; white-space: nowrap; display: inline-block; }
.tag.crit { color: var(--ouro); border-color: rgba(200,163,90,.4); }
.el { font: 600 10.5px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; padding: 4px 7px; border: 1px solid currentColor; white-space: nowrap; }
.el-Guerra { color: var(--guerra); } .el-Fome { color: var(--fome); } .el-Peste { color: var(--peste); } .el-Morte { color: var(--morte); }
.el-Neutro, .el-Destino { color: var(--neutro); } .el-Conquista { color: var(--conquista); } .el-Karma { color: var(--karma); } .el-Caos { color: var(--caos); }
.el-x { color: var(--lua-faint); }

.caixa { background: var(--painel); border: 1px solid var(--linha); padding: 16px; }
.aviso { background: rgba(123,92,168,.14); border: 1px solid rgba(123,92,168,.45); padding: 12px 16px; font-size: 14px; }
.vazio { padding: 36px 16px; text-align: center; color: var(--lua-dim); font-family: var(--f-ital); font-style: italic; font-size: 18px; }

/* cards de agente / campanha */
.grade-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.card-ag { display: grid; grid-template-columns: 112px 1fr; background: var(--painel); border: 1px solid var(--linha); min-height: 128px; }
.card-ag .foto { background: var(--painel-3) center/cover no-repeat; display: grid; place-items: center; font: 400 38px var(--f-disp); color: var(--lua-faint); }
.card-ag .corpo { padding: 12px 14px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.card-ag .nm { font: 400 21px/1.1 var(--f-disp); overflow-wrap: anywhere; }
.card-ag .acoes { display: flex; gap: 8px; justify-content: flex-end; align-items: end; margin-top: auto; }
.card-camp { position: relative; background: var(--painel) center/cover no-repeat; border: 1px solid var(--linha); min-height: 190px; display: flex; align-items: end; overflow: hidden; }
.card-camp::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,13,20,.15), rgba(11,13,20,.92) 75%); }
.card-camp .corpo { position: relative; padding: 14px; display: flex; justify-content: space-between; align-items: end; gap: 10px; width: 100%; }
.card-camp .qtd { position: absolute; top: 10px; left: 12px; font: 12px var(--f-mono); color: var(--lua-dim); }

/* ficha */
.ficha-topo { display: grid; grid-template-columns: 170px 1fr; gap: 20px; align-items: start; }
@media (max-width: 640px) { .ficha-topo { grid-template-columns: 1fr; } }
.retrato { width: 170px; aspect-ratio: 1; max-width: 100%; border: 1px solid var(--linha-2); background: var(--painel-3) center/cover; display: grid; place-items: center; font: 400 64px var(--f-disp); color: var(--lua-faint); position: relative; }
.principal { display: grid; grid-template-columns: minmax(250px, 320px) 1fr; gap: 20px; }
@media (max-width: 860px) { .principal { grid-template-columns: 1fr; } }
.penta svg { width: 100%; max-width: 290px; display: block; margin: 0 auto; }
.attr-lista { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; text-align: center; }
.attr-lista .v { font: 700 22px/1 var(--f-mono); }
.mini-stats { display: flex; gap: 8px; flex-wrap: wrap; }
.mini-stats > div { flex: 1 1 80px; border: 1px solid var(--linha); padding: 7px 10px; }
.mini-stats .n { font: 700 17px/1.2 var(--f-mono); }
.ident { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 22px; }
.ident .linha { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--linha); }
.ident .k { width: 72px; flex-shrink: 0; padding-top: 3px; }
.ident .v { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.vital { display: grid; gap: 4px; }
.vital .cab { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.vital .nome { font: 600 12px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; }
.vital .ctrl { display: flex; gap: 5px; align-items: center; }
.vbtn { width: 30px; height: 30px; border: 1px solid var(--linha); background: var(--painel-2); color: var(--lua-dim); font: 12px var(--f-mono); flex-shrink: 0; }
.vbtn:hover { color: var(--lua); border-color: var(--lua-dim); }
.trilho { position: relative; flex: 1; height: 30px; background: #07080d; border: 1px solid var(--linha); overflow: hidden; min-width: 60px; }
.trilho.fino { height: 16px; }
.cheio { position: absolute; inset: 0 auto 0 0; transition: width .4s cubic-bezier(.2,.8,.2,1); }
.pv .cheio { background: linear-gradient(90deg, #4d1519, var(--sangue)); }
.ps .cheio { background: linear-gradient(90deg, #1b2a45, var(--sanid)); }
.pst .cheio { background: linear-gradient(90deg, #1d3529, var(--fole)); }
.trilho .txt { position: relative; text-align: center; font: 700 12.5px/28px var(--f-mono); text-shadow: 0 1px 3px #000; }
.trilho.fino .txt { line-height: 14px; font-size: 10.5px; }
.barra-teste { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }
.barra-teste .campo input { width: 80px; text-align: center; font-family: var(--f-mono); }
.grade-per { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.per { background: var(--painel); border: 1px solid var(--linha); padding: 11px 13px; display: grid; gap: 7px; align-content: start; }
.per.zero { opacity: .62; }
.per .topo-p { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pips { display: flex; gap: 3px; }
.pip { width: 8px; height: 8px; border: 1px solid var(--lua-faint); transform: rotate(45deg); }
.pip.on { background: var(--sangue-hi); border-color: var(--sangue-hi); }
.pip.vt { background: var(--ouro); border-color: var(--ouro); }
.res { font: 12.5px/1.5 var(--f-mono); color: var(--lua-dim); overflow-wrap: anywhere; }
.res:empty { display: none; }
.res b { color: var(--lua); font-size: 15px; }
.res .melhor { color: var(--lua); text-decoration: underline; text-underline-offset: 3px; }
.ok { color: var(--fole); font-weight: 700; } .falha { color: var(--sangue-hi); font-weight: 700; } .critico { color: var(--ouro); font-weight: 700; }
.lista { display: grid; gap: 10px; }
.item { background: var(--painel); border: 1px solid var(--linha); padding: 12px 14px; display: grid; gap: 7px; }
.item .cab { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.item .nm { font-weight: 700; }
.item .acoes { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.chk { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--lua-dim); cursor: pointer; }
.chk input { accent-color: var(--sangue); width: 16px; height: 16px; }
.grade-hab { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }
.hab { background: var(--painel); border: 1px solid var(--linha); padding: 13px 15px; display: grid; gap: 6px; align-content: start; }
.hab .cab { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.hab .nm { font: 400 18px/1.15 var(--f-disp); }
.hab p { color: var(--lua-dim); font-size: 14px; }
.hab.bloq { opacity: .45; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 7px 0; border-block: 1px solid var(--linha); }
.stats .v { font: 700 13px var(--f-mono); }
#ficha:not(.editando) .edit-only { display: none !important; }

/* gaveta / modal */
.fundo-modal { position: fixed; inset: 0; z-index: 50; background: rgba(5,6,10,.72); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { width: min(720px, 100%); max-height: 86vh; overflow: auto; background: var(--painel); border: 1px solid var(--linha-2); padding: 18px; display: grid; gap: 14px; }
.modal .cab-m { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.opcao { display: flex; justify-content: space-between; gap: 12px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--linha); }
.opcao p { font-size: 13.5px; color: var(--lua-dim); }
.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: max(20px, env(safe-area-inset-bottom, 0px)); background: var(--painel-3); border: 1px solid var(--linha-2); padding: 10px 16px; font-size: 14px; max-width: calc(100% - 32px); }

/* criação */
.passos { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
.passos span { font: 400 19px var(--f-disp); color: var(--lua-faint); }
.passos span.aqui { color: var(--ouro); }
.passos span.feito { color: var(--lua); }
.passos i { width: 40px; height: 1px; background: var(--linha-2); }
.roda-attr { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.attr-box { border: 1px solid var(--linha-2); padding: 14px; text-align: center; display: grid; gap: 8px; background: var(--painel); }
.attr-box .v { font: 700 40px/1 var(--f-mono); }
.attr-box .ctrl { display: flex; justify-content: center; gap: 8px; }
.escolha { border: 1px solid var(--linha); background: var(--painel); padding: 14px; display: grid; gap: 8px; text-align: left; align-content: start; }
.escolha.aqui { border-color: var(--ouro); box-shadow: inset 0 0 0 1px var(--ouro); }
.escolha h3 { font-size: 21px; }
.base-cls { display: flex; gap: 12px; flex-wrap: wrap; font: 12px var(--f-mono); color: var(--lua-dim); }

/* ameaças */
.card-am { display: grid; grid-template-columns: 120px 1fr; background: var(--painel); border: 1px solid var(--linha); text-align: left; padding: 0; color: inherit; min-height: 120px; }
.card-am:hover { border-color: var(--linha-2); background: var(--painel-2); }
.card-am .img { background: #f2efe6 center/contain no-repeat; }
.card-am .corpo { padding: 12px 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.det-am { display: grid; grid-template-columns: minmax(240px, 360px) 1fr; gap: 24px; }
@media (max-width: 860px) { .det-am { grid-template-columns: 1fr; } }
.det-am .img { background: #f2efe6; border: 1px solid var(--linha-2); }
.det-am .img img { display: block; width: 100%; }
.relato { display: grid; gap: 14px; }
.relato h3 { color: var(--ouro); font-size: 17px; }
.relato p { max-width: 70ch; color: #c9ccd8; }
.nota-arthur { font-family: var(--f-ital); font-style: italic; font-size: 19px; line-height: 1.4; color: var(--sangue-hi); border-left: 2px solid var(--sangue); padding-left: 14px; }
.uv { background: #120a24; border: 1px dashed #6b4fd0; padding: 12px 14px; color: #c9b8ff; font-family: var(--f-ital); font-style: italic; font-size: 17px; }

/* escudo */
.escudo { display: grid; grid-template-columns: 290px 1fr; gap: 18px; align-items: start; }
@media (max-width: 980px) { .escudo { grid-template-columns: 1fr; } }
.feed { background: var(--painel); border: 1px solid var(--linha); display: grid; align-content: start; max-height: 80vh; overflow: auto; position: sticky; top: 84px; }
@media (max-width: 980px) { .feed { position: static; max-height: 360px; } }
.feed .cab-f { padding: 12px 14px; border-bottom: 1px solid var(--linha); display: flex; justify-content: space-between; align-items: center; }
.rol { padding: 10px 14px; border-bottom: 1px solid var(--linha); display: grid; gap: 3px; }
.rol .l1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.rol .total { font: 700 22px var(--f-mono); }
.rol.oculta { background: rgba(123,92,168,.12); }
.combatente { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; background: var(--painel); border: 1px solid var(--linha); padding: 10px 12px; }
.combatente.vez { border-color: var(--ouro); box-shadow: inset 3px 0 0 var(--ouro); }
.combatente .ini { width: 64px; text-align: center; font: 700 20px var(--f-mono); }
.combatente .ini input { width: 64px; text-align: center; font: 700 18px var(--f-mono); padding: 6px 2px; }
.cond-chip { font-size: 11.5px; border: 1px solid var(--sangue); color: var(--sangue-hi); padding: 1px 7px; border-radius: 999px; display: inline-flex; gap: 4px; align-items: center; }
.cond-chip button { background: none; border: none; color: inherit; padding: 0; font-size: 13px; line-height: 1; }
.ag-escudo { background: var(--painel); border: 1px solid var(--linha); padding: 12px; display: grid; gap: 8px; }
.ag-escudo .cab { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center; }
.ag-escudo .mini-f { width: 56px; height: 56px; background: var(--painel-3) center/cover; display: grid; place-items: center; font: 400 22px var(--f-disp); color: var(--lua-faint); }
.attr-linha { display: grid; grid-template-columns: repeat(5, 1fr); text-align: center; font-size: 10.5px; color: var(--lua-faint); letter-spacing: .1em; }
.attr-linha b { display: block; font: 700 16px var(--f-mono); color: var(--lua); letter-spacing: 0; }

.camp-topo { display: grid; gap: 24px; align-items: center; }
.camp-topo.com-capa { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); }
@media (max-width: 760px) { .camp-topo.com-capa { grid-template-columns: 1fr; } }
.acao-card { background: var(--painel-2); border: 1px solid var(--linha); }
.acao-card summary { cursor: pointer; padding: 12px 14px; font: 700 15px var(--f-body); border-bottom: 1px solid var(--violeta); list-style: none; display: flex; gap: 8px; align-items: center; }
.acao-card summary::-webkit-details-marker { display: none; }
.acao-card summary::before { content: "›"; color: var(--violeta); font-size: 20px; transition: transform .2s; }
.acao-card[open] summary::before { transform: rotate(90deg); }
.acao-tipo { color: var(--ouro); letter-spacing: .06em; }
.acao-corpo { padding: 12px 14px; display: grid; gap: 14px; }
.atq { display: grid; gap: 4px; }
.atq-cab { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.lbl-v { color: #b18ee6; }
.dado-btn { margin-left: auto; background: none; border: none; color: var(--lua); padding: 2px; }

<script>
'use strict';
/* =================================================================
   NÚCLEO
   ================================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const nl = s => esc(s).replace(/\n/g, '<br>');
const app = $('#app');
const DADO_SVG = '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 2 21 7v10l-9 5-9-5V7z"/><path d="M12 2 7 10h10zM3 7l4 3-4 7M21 7l-4 3 4 7M7 10l5 12 5-12"/></svg>';
const ICON_BUSCA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>';
const ATR = [['forca','Força','FOR'],['destreza','Destreza','DES'],['constituicao','Constituição','CON'],['inteligencia','Inteligência','INT'],['presenca','Presença','PRE']];
const SIGLA = Object.fromEntries(ATR.map(a => [a[0], a[2]]));
const ELEMS = ['Guerra','Fome','Peste','Morte','Neutro','Conquista','Karma','Destino','Caos'];
const elTag = e => `<span class="el ${e ? 'el-' + esc(e) : 'el-x'}">${esc(e || 'Indefinido')}</span>`;
const iniciais = n => (n || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();
const fmtKg = n => (Math.round(n * 10) / 10).toLocaleString('pt-BR') + 'kg';
const corDe = id => { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `hsl(${h % 360} 45% 62%)`; };
const dataBR = t => t ? new Date(t).toLocaleDateString('pt-BR') : '';
const horaBR = t => t ? new Date(t).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
const uid8 = () => Math.random().toString(36).slice(2, 10);
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* ---------- dados estáticos do sistema ---------- */
let SIS = null, CRI = [], RIT = [], LORE = null;
async function carregarBase() {
  const [s, c, r] = await Promise.all(['dados/sistema.json', 'dados/criaturas.json', 'dados/rituais.json'].map(u => fetch(u).then(x => x.json())));
  SIS = s; CRI = c; RIT = r;
}
const classe = n => SIS.classes.find(c => c.nome === n);
const subclasse = (c, s) => classe(c)?.subclasses.find(x => x.nome === s);
const patente = n => SIS.patentes.find(p => n >= p.de && n <= p.ate) || SIS.patentes[0];
const vontade = n => SIS.vontades.find(v => v.nome === n);
const nivelAm = n => SIS.niveisAmeaca.find(x => x[0] === +n) || [n, '?', ''];
function pontosAtributo(nivel) { let p = 12; if (nivel >= 4) p += 2; if (nivel >= 8) p += 3; if (nivel >= 12) p += 5; return p; }
function qtdPassivas(nivel) { return [2, 6, 9, 11].filter(x => nivel >= x).length; }

/* ---------- regras de cálculo ---------- */
function calc(f) {
  const C = classe(f.classe) || { pv: 0, ps: 0, pst: 0 };
  const A = f.atributos || {}, N = +f.nivel || 1;
  const pt = n => (f.pericias || []).find(p => p.nome === n)?.pontos || 0;
  const vig = pt('Vigor'), vtd = pt('Vontade');
  const max = {
    pv:  8 + (C.pv + (A.constituicao || 0)) * N + vig * 5,
    ps:  5 + (C.ps + (A.inteligencia || 0)) * N + vtd * 5,
    pst: 5 + (C.pst + (A.constituicao || 0)) * N + vig * 2,
  };
  const form = {
    pv: `8 + (${C.pv} + ${A.constituicao || 0}) × ${N}${vig ? ` + ${vig * 5} Vigor` : ''}`,
    ps: `5 + (${C.ps} + ${A.inteligencia || 0}) × ${N}${vtd ? ` + ${vtd * 5} Vontade` : ''}`,
    pst: `5 + (${C.pst} + ${A.constituicao || 0}) × ${N}${vig ? ` + ${vig * 2} Vigor` : ''}`,
  };
  const eq = f.equipamentos || [];
  const bruto = eq.reduce((s, i) => s + (+i.peso || 0) * (+i.qtd || 1), 0);
  const alivio = eq.reduce((s, i) => s + (+i.alivio || 0), 0);
  const carga = Math.max(0, bruto - alivio);
  const cc = ((A.forca || 0) + (A.constituicao || 0)) * 2;
  const rd = eq.reduce((s, i) => s + (+i.rd || 0), 0);
  return { max, form, carga, cc, rd, mov: 5 + (A.destreza || 0), pat: patente(N) };
}
function dadosPericia(f, nome) {
  const p = (f.pericias || []).find(x => x.nome === nome);
  const base = SIS.pericias.find(x => x.nome === nome);
  const atr = p?.atributo || base?.atributo || 'inteligencia';
  const vt = vontade(f.vontade)?.pericias.includes(nome) ? 1 : 0;
  return { pontos: p?.pontos || 0, vt, atr, dados: Math.max(1, (p?.pontos || 0) + vt), mod: f.atributos?.[atr] || 0 };
}

/* ---------- dados (rolagem) ---------- */
const d = s => 1 + Math.floor(Math.random() * s);
// "2d8+1d6+3" soma; "3d20m+4" = 3d20 fica o maior
function rolar(expr) {
  const limpo = String(expr).replace(/\s/g, '').toLowerCase();
  if (!limpo) return null;
  let total = 0; const partes = [];
  const termos = limpo.match(/[+-]?[^+-]+/g) || [];
  for (const t of termos) {
    const s = t[0] === '-' ? -1 : 1, c = t.replace(/^[+-]/, '');
    let m = /^(\d*)d(\d+)(m?)$/.exec(c);
    if (m) {
      const q = Math.min(100, +(m[1] || 1)), f = +m[2];
      if (!f) return null;
      const ds = Array.from({ length: q }, () => d(f));
      if (m[3]) { const mx = Math.max(...ds); let marcou = false; total += s * mx;
        partes.push(`[${ds.map(x => { if (!marcou && x === mx) { marcou = true; return `<span class="melhor">${x}</span>`; } return x; }).join(', ')}]`);
      } else { total += s * ds.reduce((a, b) => a + b, 0); partes.push(`${s < 0 ? '-' : ''}[${ds.join(', ')}]`); }
    } else if (/^\d+$/.test(c)) { total += s * +c; partes.push(`${s < 0 ? '- ' : '+ '}${c}`); }
    else return null;
  }
  return { total, detalhe: partes.join(' ') };
}
function teste(qtd, mod) {
  const ds = Array.from({ length: Math.max(1, qtd) }, () => d(20));
  const mx = Math.max(...ds); let marcou = false;
  const lista = ds.map(x => { if (!marcou && x === mx) { marcou = true; return `<span class="melhor">${x}</span>`; } return x; }).join(', ');
  return { total: mx + mod, nat20: mx === 20, detalhe: `[${lista}] ${mod >= 0 ? '+' : '-'} ${Math.abs(mod)}` };
}
const veredito = (total, dt) => dt ? (total >= dt ? ` contra DT ${dt}: <span class="ok">Sucesso</span>` : ` contra DT ${dt}: <span class="falha">Falha</span>`) : '';

/* =================================================================
   CAPACIDADES (banco compartilhado, quem está vendo, imagens)
   ================================================================= */
let db = null, sb = null, ME = null, DONO = false, PERFIL = null;
const PERFIS = {};
async function nomeDe(ids) {
  const falta = ids.filter(i => i && !(i in PERFIS));
  if (falta.length && sb) { try { const { data } = await sb.from('perfis').select('id,nome').in('id', falta); for (const i of falta) PERFIS[i] = data?.find(x => x.id === i)?.nome || ''; } catch (e) {} }
  return Object.fromEntries(ids.map(i => [i, PERFIS[i] || 'Alguém']));
}
let SUBS = [];
function assinar(un) { SUBS.push(un); return un; }
function limparSubs() { SUBS.forEach(u => { try { u(); } catch (e) {} }); SUBS = []; }
async function enviarImagem(file) {
  if (!sb || !ME) { toast('Entre na sua conta para enviar imagens.'); return null; }
  if (file.size > 8 * 1024 * 1024) { toast('Imagem acima de 8 MB. Reduza e tente de novo.'); return null; }
  const ext = (file.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '');
  const caminho = `${ME}/${Date.now()}-${uid8()}.${ext}`;
  const { error } = await sb.storage.from('imagens').upload(caminho, file, { contentType: file.type, upsert: false });
  if (error) { toast('Não deu para enviar a imagem: ' + error.message); return null; }
  return sb.storage.from('imagens').getPublicUrl(caminho).data.publicUrl;
}
const semBanco = () => `<div class="aviso">Para criar agentes e campanhas, <a href="#entrar">entre na sua conta</a>. Bestiário, grimório e regras funcionam sem login.</div>`;

/* participação em campanhas (lista privada de cada pessoa) */
let PART = { campanhas: [] };
const refPart = () => db.doc(`data/users/${ME}/participacoes`);
async function carregarPart() { if (!db || !ME) return; try { const s = await refPart().get(); PART = s.exists ? { campanhas: [], ...s.data() } : { campanhas: [] }; } catch (e) {} }
async function salvarPart() { try { await refPart().set({ campanhas: [...new Set(PART.campanhas)] }); } catch (e) { toast('Não deu para salvar sua lista de campanhas.'); } }

/* rolagens enviadas para as campanhas da ficha */
async function publicarRolagem(f, rotulo, r) {
  if (!db || !f?.campanhas?.length) return;
  for (const c of f.campanhas) {
    try { await db.collection(`campanhas/${c}/rolagens`).add({ uid: ME, autor: f.nome || 'Agente', rotulo, detalhe: r.detalhe, total: r.total, t: Date.now() }); } catch (e) {}
  }
}

function abrirModal(titulo, corpoHtml, ligar) {
  const camada = $('#camada');
  camada.innerHTML = `<div class="fundo-modal"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
    <div class="cab-m"><h2>${esc(titulo)}</h2><button class="btn-x" data-fechar aria-label="Fechar">×</button></div>${corpoHtml}</div></div>`;
  const fechar = () => { camada.innerHTML = ''; };
  camada.querySelector('[data-fechar]').onclick = fechar;
  camada.querySelector('.fundo-modal').addEventListener('click', e => { if (e.target.classList.contains('fundo-modal')) fechar(); });
  ligar?.(camada.querySelector('.modal'), fechar);
  camada.querySelector('input, textarea, select')?.focus();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#camada').innerHTML = ''; });

/* seletor de catálogo com busca */
function seletor(titulo, itens, render, aoEscolher, extra = '') {
  abrirModal(titulo, `${extra}<div class="busca">${ICON_BUSCA}<input type="search" id="sel-busca" placeholder="Buscar"></div><div id="sel-lista"></div>`, (m, fechar) => {
    const lista = m.querySelector('#sel-lista');
    const desenhar = q => {
      const ql = q.toLowerCase();
      const fil = itens.map((x, i) => [x, i]).filter(([x]) => !q || JSON.stringify(x).toLowerCase().includes(ql)).slice(0, 120);
      lista.innerHTML = fil.length ? fil.map(([x, i]) => `<div class="opcao"><div>${render(x)}</div><button class="btn mini" data-i="${i}">Adicionar</button></div>`).join('') : '<div class="vazio">Nada encontrado.</div>';
    };
    desenhar('');
    m.querySelector('#sel-busca').addEventListener('input', e => desenhar(e.target.value));
    lista.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (!b) return; aoEscolher(itens[+b.dataset.i]); b.textContent = 'Adicionado'; b.disabled = true; });
  });
}

  </div>`;
  desenharLua($('#lua'));
};
function desenharLua(cv) {
  const ctx = cv.getContext('2d'), W = cv.width, c = W / 2, R = W * 0.3;
  let t0 = performance.now(), parar = false;
  const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const linhas = Array.from({ length: 28 }, (_, i) => ({ a: i / 28 * Math.PI * 2, r: R * (1.08 + (i % 5) * .08), v: (i % 2 ? 1 : -1) * (.00006 + (i % 7) * .00002) }));
  function quadro(t) {
    if (!cv.isConnected) return;
    const dt = t - t0;
    ctx.clearRect(0, 0, W, W);
    linhas.forEach((l, i) => {
      ctx.beginPath(); const a = l.a + dt * l.v;
      ctx.arc(c, c, l.r, a, a + 1.1 + (i % 3) * .5);
      ctx.strokeStyle = i % 4 === 0 ? 'rgba(180,51,59,.55)' : 'rgba(200,163,90,.28)'; ctx.lineWidth = i % 4 === 0 ? 2 : 1; ctx.stroke();
    });
    const g = ctx.createRadialGradient(c - R * .3, c - R * .3, R * .1, c, c, R);
    g.addColorStop(0, '#e7e3d6'); g.addColorStop(1, '#8a8678');
    ctx.beginPath(); ctx.arc(c, c, R, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = 'rgba(11,13,20,.86)'; ctx.beginPath(); ctx.arc(c + R * .42 + Math.sin(dt / 4000) * R * .05, c - R * .1, R * .95, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.beginPath(); ctx.arc(c - R * .28, c + R * .05, R * .13, 0, Math.PI * 2); ctx.fillStyle = 'rgba(11,13,20,.5)'; ctx.fill();
    ctx.beginPath(); ctx.arc(c - R * .28, c + R * .05, R * .05, 0, Math.PI * 2); ctx.fillStyle = '#b4333b'; ctx.fill();
    if (!reduz && !parar) requestAnimationFrame(quadro);
  }
  requestAnimationFrame(quadro);
}

ROTAS.novo = async () => {
  if (!db) { app.innerHTML = semBanco(); return; }
  const CH = `adr-rascunho-${ME}`;
  let R; try { R = JSON.parse(localStorage.getItem(CH) || 'null'); } catch (e) {}
  R = R || { passo: 0, nivel: 1, atributos: { forca: 0, destreza: 0, constituicao: 0, inteligencia: 0, presenca: 0 }, vontade: '', classe: '', subclasse: '', passivas: [], pericias: {}, nome: '', jogador: '', idade: '', vetor: '', aparencia: '', personalidade: '', historico: '', objetivo: '', foto: '' };
  const guardar = () => { try { localStorage.setItem(CH, JSON.stringify(R)); } catch (e) {} };
  const PASSOS = ['Atributos', 'Vontade', 'Classe', 'Perícias', 'Toques finais'];
  app.className = 'pagina estreita';

  function render() {
    guardar();
    const pat = patente(R.nivel);
    const totalA = pontosAtributo(R.nivel), usados = Object.values(R.atributos).reduce((a, b) => a + b, 0);
    let corpo = '';
    if (R.passo === 0) {
      corpo = `<p>Todos os atributos começam em 0. Você distribui <b>${totalA} pontos</b> entre eles${R.nivel >= 4 ? ' (12 iniciais mais os aumentos de atributo do seu nível)' : ''}. Como ${esc(pat.nome)}, nenhum atributo passa de <b>${pat.limite}</b>.</p>
      <div class="grade-campos"><div class="campo"><label class="rotulo" for="nv">Nível inicial (combine com o mestre)</label><select id="nv">${Array.from({ length: 12 }, (_, i) => `<option ${R.nivel === i + 1 ? 'selected' : ''}>${i + 1}</option>`).join('')}</select></div>
      <div class="campo"><span class="rotulo">Pontos restantes</span><div class="mono" style="font-size:26px; color:${usados > totalA ? 'var(--sangue-hi)' : 'var(--ouro)'}">${totalA - usados}</div></div></div>
      <div class="roda-attr">${ATR.map(([k, n, s]) => `<div class="attr-box"><span class="rotulo">${n}</span><div class="v">${R.atributos[k]}</div><div class="ctrl"><button class="vbtn" data-a="${k}" data-d="-1" aria-label="Diminuir ${n}">−</button><button class="vbtn" data-a="${k}" data-d="1" aria-label="Aumentar ${n}">+</button></div><span class="faint" style="font-size:12px">${s}</span></div>`).join('')}</div>`;
    } else if (R.passo === 1) {
      corpo = `<p>Em vez de origem, o A.R. usa Vontade: para onde o seu agente quer chegar. Cada Vontade dá +1 em duas perícias, sem contar no limite da patente.</p>
      <div class="grade-cards">${SIS.vontades.map(v => `<button class="escolha ${R.vontade === v.nome ? 'aqui' : ''}" data-vt="${esc(v.nome)}"><h3>Vontade de ${esc(v.nome)}</h3><p class="dim" style="font-size:14px">${esc(v.texto)}</p><span class="tag crit">${esc(v.bonus)}</span></button>`).join('')}</div>`;
    } else if (R.passo === 2) {
      const C = classe(R.classe);
      corpo = `<p>A classe define PV, PS, PST e pontos de perícia. A subclasse dá habilidades nos níveis 1, 3, 5, 7 e 10.</p>
      <div class="grade-cards">${SIS.classes.map(c => `<button class="escolha ${R.classe === c.nome ? 'aqui' : ''}" data-cl="${esc(c.nome)}"><h3>${esc(c.nome)}</h3><p class="dim" style="font-size:14px">${esc(c.descricao)}</p><div class="base-cls"><span>PV ${c.pv}</span><span>PST ${c.pst}</span><span>PS ${c.ps}</span><span>Perícias ${c.pericias} + Int</span></div></button>`).join('')}</div>
      ${C ? `<h2>Subclasse de ${esc(C.nome)}</h2><div class="grade-cards">${C.subclasses.map(s => `<button class="escolha ${R.subclasse === s.nome ? 'aqui' : ''}" data-sc="${esc(s.nome)}"><h3>${esc(s.nome)}</h3><p class="dim" style="font-size:14px">${esc(s.descricao)}</p>
        <div style="display:grid; gap:4px">${s.habilidades.map(h => `<span style="font-size:13px; ${h.nivel > R.nivel ? 'opacity:.4' : ''}"><span class="tag">Nv ${h.nivel}</span> ${esc(h.nome)}</span>`).join('')}</div></button>`).join('')}</div>` : ''}
      ${qtdPassivas(R.nivel) ? `<h2>Habilidades passivas (${R.passivas.length}/${qtdPassivas(R.nivel)})</h2><p class="dim">Seu nível dá ${qtdPassivas(R.nivel)} passiva(s), nos níveis 2, 6, 9 e 11.</p>
        <div class="lista">${R.passivas.map((p, i) => `<div class="item"><div class="cab"><span class="nm">${esc(p.nome)}</span><button class="btn-x" data-rp="${i}" aria-label="Remover">×</button></div><p class="dim" style="font-size:13.5px">${esc(p.texto)}</p></div>`).join('')}</div>
        ${R.passivas.length < qtdPassivas(R.nivel) ? '<button class="btn sec" id="add-pas">Escolher passiva</button>' : ''}` : ''}`;
    } else if (R.passo === 3) {
      const C = classe(R.classe); const tot = (C?.pericias || 0) + R.atributos.inteligencia;
      const gastos = Object.values(R.pericias).reduce((a, b) => a + b, 0);
      const vt = vontade(R.vontade)?.pericias || [];
      corpo = `<p>Você tem <b>${tot} pontos</b> de perícia (${C?.pericias || 0} da classe + ${R.atributos.inteligencia} de Inteligência). Cada ponto é um d20 no teste, fica o maior e soma o atributo. Limite por perícia: <b>${pat.limite}</b>.</p>
      <div class="campo"><span class="rotulo">Pontos restantes</span><div class="mono" style="font-size:26px; color:${gastos > tot ? 'var(--sangue-hi)' : 'var(--ouro)'}">${tot - gastos}</div></div>
      <div class="grade-per">${SIS.pericias.map(p => { const v = R.pericias[p.nome] || 0, b = vt.includes(p.nome) ? 1 : 0;
        return `<div class="per ${v || b ? '' : 'zero'}"><div class="topo-p"><b>${esc(p.nome)}</b><span class="faint mono" style="font-size:11px">${SIGLA[p.atributo]}</span></div>
        <div class="topo-p"><div class="pips">${Array.from({ length: pat.limite }, (_, k) => `<span class="pip ${k < v ? 'on' : ''}"></span>`).join('')}${b ? '<span class="pip vt" title="Vontade"></span>' : ''}</div>
        <div style="display:flex; gap:4px"><button class="vbtn" data-pr="${esc(p.nome)}" data-d="-1" aria-label="Menos ${esc(p.nome)}">−</button><button class="vbtn" data-pr="${esc(p.nome)}" data-d="1" aria-label="Mais ${esc(p.nome)}">+</button></div></div></div>`; }).join('')}</div>`;
    } else {
      corpo = `<p>As escolhas mecânicas estão feitas. Agora o agente ganha rosto e história.</p>
      <div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap"><div class="retrato" id="prev-foto" style="${R.foto ? `background-image:url('${esc(R.foto)}')` : ''}">${R.foto ? '' : esc(iniciais(R.nome))}</div>
        <div class="campo" style="flex:1"><label class="rotulo" for="foto-arq">Retrato</label><input type="file" id="foto-arq" accept="image/*"><input type="text" id="foto-url" placeholder="ou cole o link de uma imagem" value="${esc(R.foto)}"></div></div>
      <div class="grade-campos">
        ${[['nome', 'Nome do agente'], ['jogador', 'Jogador'], ['idade', 'Idade'], ['vetor', 'Vetor']].map(([k, l]) => `<div class="campo"><label class="rotulo" for="t-${k}">${l}</label><input type="text" id="t-${k}" data-t="${k}" value="${esc(R[k])}"></div>`).join('')}
      </div>
      ${[['aparencia', 'Aparência', 'Gênero, idade, descrição física…'], ['personalidade', 'Personalidade', 'Traços marcantes, opiniões, ideais…'], ['historico', 'Histórico', 'Infância, família, primeiro contato com o paranormal…'], ['objetivo', 'Objetivo', 'Por que faz parte da Delta Green? Por que luta contra o Caos?']].map(([k, l, ph]) => `<div class="campo"><label class="rotulo" for="t-${k}">${l}</label><textarea id="t-${k}" data-t="${k}" placeholder="${ph}">${esc(R[k])}</textarea></div>`).join('')}`;
    }
    const pode = [usados <= totalA, !!R.vontade, !!(R.classe && R.subclasse), true, !!R.nome.trim()];
    app.innerHTML = `<div class="cab-pagina"><div><span class="rotulo">Novo agente</span><h1>${esc(PASSOS[R.passo])}</h1></div><button class="btn sec mini" id="zerar">Recomeçar</button></div>
      <div class="passos">${PASSOS.map((p, i) => `${i ? '<i></i>' : ''}<span class="${i === R.passo ? 'aqui' : i < R.passo ? 'feito' : ''}">${p}</span>`).join('')}</div>
      <section style="display:grid; gap:16px">${corpo}</section>
      <div style="display:flex; justify-content:space-between; gap:10px">
        <button class="btn sec" id="voltar" ${R.passo ? '' : 'disabled'}>Voltar</button>
        ${R.passo < 4 ? `<button class="btn" id="avancar" ${pode[R.passo] ? '' : 'disabled'}>Avançar</button>` : `<button class="btn" id="finalizar" ${pode[4] ? '' : 'disabled'}>Finalizar agente</button>`}
      </div>`;
    ligar();
  }
  function ligar() {
    $('#zerar').onclick = () => { try { localStorage.removeItem(CH); } catch (e) {} ROTAS.novo(); };
    $('#voltar').onclick = () => { R.passo--; render(); };
    $('#avancar')?.addEventListener('click', () => { R.passo++; render(); });
    $('#nv')?.addEventListener('change', e => { R.nivel = +e.target.value; const lim = patente(R.nivel).limite; for (const k in R.atributos) R.atributos[k] = Math.min(R.atributos[k], lim); R.passivas = R.passivas.slice(0, qtdPassivas(R.nivel)); render(); });
    $$('[data-a]').forEach(b => b.onclick = () => { const k = b.dataset.a, lim = patente(R.nivel).limite; const usados = Object.values(R.atributos).reduce((a, x) => a + x, 0);
      const nv = R.atributos[k] + +b.dataset.d; if (nv < 0 || nv > lim) return; if (+b.dataset.d > 0 && usados >= pontosAtributo(R.nivel)) return; R.atributos[k] = nv; render(); });
    $$('[data-vt]').forEach(b => b.onclick = () => { R.vontade = b.dataset.vt; render(); });
    $$('[data-cl]').forEach(b => b.onclick = () => { if (R.classe !== b.dataset.cl) { R.classe = b.dataset.cl; R.subclasse = ''; } render(); });
    $$('[data-sc]').forEach(b => b.onclick = () => { R.subclasse = b.dataset.sc; render(); });
    $$('[data-rp]').forEach(b => b.onclick = () => { R.passivas.splice(+b.dataset.rp, 1); render(); });
    $('#add-pas')?.addEventListener('click', () => seletor('Habilidades passivas', SIS.passivas.filter(p => !R.passivas.some(x => x.nome === p.nome)),
      p => `<b>${esc(p.nome)}</b><p>${esc(p.texto)}</p>`, p => { if (R.passivas.length < qtdPassivas(R.nivel)) { R.passivas.push(p); render(); $('#camada').innerHTML = ''; } }));
    $$('[data-pr]').forEach(b => b.onclick = () => { const C = classe(R.classe); const tot = (C?.pericias || 0) + R.atributos.inteligencia;
      const gastos = Object.values(R.pericias).reduce((a, x) => a + x, 0); const n = b.dataset.pr, v = (R.pericias[n] || 0) + +b.dataset.d;
      if (v < 0 || v > patente(R.nivel).limite) return; if (+b.dataset.d > 0 && gastos >= tot) return; R.pericias[n] = v; if (!v) delete R.pericias[n]; render(); });
    $$('[data-t]').forEach(i => i.addEventListener('input', () => { R[i.dataset.t] = i.value; guardar(); if (i.dataset.t === 'nome') $('#finalizar').disabled = !R.nome.trim(); }));
    $('#foto-url')?.addEventListener('change', e => { R.foto = e.target.value.trim(); render(); });
    $('#foto-arq')?.addEventListener('change', async e => { const f = e.target.files[0]; if (!f) return; const u = await enviarImagem(f); if (u) { R.foto = u; render(); } });
    $('#finalizar')?.addEventListener('click', async e => {
      e.target.disabled = true; e.target.textContent = 'Registrando…';
      const vt = vontade(R.vontade)?.pericias || [];
      const nomes = new Set([...Object.keys(R.pericias), ...vt]);
      const ficha = { dono: ME, criado: Date.now(), nome: R.nome.trim(), jogador: R.jogador, idade: R.idade, vontade: R.vontade, vetor: R.vetor, classe: R.classe, subclasse: R.subclasse, nivel: R.nivel,
        atributos: R.atributos, pericias: [...nomes].map(n => ({ nome: n, pontos: R.pericias[n] || 0, atributo: SIS.pericias.find(p => p.nome === n)?.atributo || 'inteligencia' })),
        equipamentos: [], passivas: R.passivas, habilidades: [], rituais: [], aparencia: R.aparencia, personalidade: R.personalidade, historico: R.historico, objetivo: R.objetivo, foto: R.foto, campanhas: [], anotacoes: '' };
      const m = calc(ficha).max; ficha.atual = { ...m };
      try { const ref = await db.collection('fichas').add(ficha); try { localStorage.removeItem(CH); } catch (x) {} location.hash = 'agente-' + ref.id; }
      catch (err) { e.target.disabled = false; e.target.textContent = 'Finalizar agente'; toast(err.code === 'quota_exceeded' ? 'O arquivo está cheio. Apague agentes antigos.' : 'Não deu para salvar: ' + (err.message || err.code)); }
    });
  }
  render();
};

/* =================================================================
   FICHA DO AGENTE
   ================================================================= */
ROTAS.agente = async id => {
  if (!db) { app.innerHTML = semBanco(); return; }
  app.innerHTML = '<div class="vazio">Abrindo dossiê…</div>';
  const ref = db.doc('fichas/' + id);
  let F = null, aba = 'pericias', editando = false, mostrarTodas = false, podeEditar = false, pendente = false;
  const salvarVitais = debounce(async () => { try { await ref.update({ atual: F.atual }); } catch (e) { toast('Não deu para salvar os vitais.'); } pendente = false; }, 500);
  async function salvar(campos) { try { await ref.update(campos); } catch (e) { toast('Não deu para salvar: ' + (e.message || e.code)); } }

  async function checarPermissao() {
    podeEditar = F.dono === ME || DONO;
    if (!podeEditar && F.campanhas?.length) {
      for (const c of F.campanhas) { try { const s = await db.doc('campanhas/' + c).get(); if (s.exists && s.data().mestre === ME) { podeEditar = true; break; } } catch (e) {} }
    }
  }
  assinar(ref.onSnapshot(async s => {
    if (!s.exists) { app.innerHTML = '<div class="vazio">Esta ficha não existe ou foi apagada.</div>'; return; }
    const novo = { id: s.id, ...s.data() };
    if (pendente && F) novo.atual = F.atual;
    const primeira = !F; F = novo;
    if (primeira) await checarPermissao();
    if (!document.activeElement?.closest?.('#ficha [data-texto]')) render();
  }, e => { app.innerHTML = `<div class="vazio">Não deu para abrir a ficha (${esc(e.code)}).</div>`; }));

  function render() {
    const K = calc(F); const A = F.atributos || {};
    F.atual = F.atual || { ...K.max };
    const C = classe(F.classe), S = subclasse(F.classe, F.subclasse);
    app.innerHTML = `<div id="ficha" class="${editando ? 'editando' : ''}" style="display:grid; gap:22px">
    <div class="ficha-topo">
      <div class="retrato" style="${F.foto ? `background-image:url('${esc(F.foto)}')` : ''}">${F.foto ? '' : esc(iniciais(F.nome))}</div>
      <div style="display:grid; gap:8px; min-width:0">
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center"><span class="el" style="color:var(--sangue-hi)">Dossiê de agente</span><span class="el" style="color:var(--ouro)">${esc(K.pat.nome)}</span>${F.vetor ? `<span class="el el-x">Vetor: ${esc(F.vetor)}</span>` : ''}</div>
        <h1>${esc(F.nome)}</h1>
        <div class="dim">${esc(F.classe)} · ${esc(F.subclasse)} · Nível ${+F.nivel || 1}${F.vontade ? ` · Vontade de ${esc(F.vontade)}` : ''}</div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:4px">
          ${podeEditar ? `<button class="btn ${editando ? '' : 'sec'}" id="editar">${editando ? 'Concluir edição' : 'Editar ficha'}</button>` : ''}
          ${F.campanhas?.length ? `<span class="faint" style="align-self:center; font-size:13px">Rolagens vão para ${F.campanhas.length} campanha(s)</span>` : ''}
        </div>
      </div>
    </div>

    <section class="principal">
      <div class="caixa penta" style="display:grid; gap:10px">
        <svg viewBox="0 0 300 280" role="img" aria-label="Atributos">${pentagono(A)}</svg>
        <div class="attr-lista">${ATR.map(([k, n, s]) => `<div><div class="v">${A[k] || 0}</div><div class="rotulo">${s}</div><div class="edit-only" style="display:flex; justify-content:center; gap:3px; margin-top:4px"><button class="vbtn" style="width:24px;height:24px" data-at="${k}" data-d="-1" aria-label="Menos ${n}">−</button><button class="vbtn" style="width:24px;height:24px" data-at="${k}" data-d="1" aria-label="Mais ${n}">+</button></div></div>`).join('')}</div>
        <div class="mini-stats">
          <div><div class="rotulo">Movimento</div><div class="n">${K.mov}m</div></div>
          <div><div class="rotulo">Carga</div><div class="n">${fmtKg(K.carga)}/${fmtKg(K.cc)}</div></div>
          ${K.rd ? `<div><div class="rotulo">RD</div><div class="n">${K.rd}</div></div>` : ''}
        </div>
      </div>
      <div style="display:grid; gap:14px; align-content:start; min-width:0">
        <div class="ident">
          ${[['Jogador', F.jogador], ['Idade', F.idade], ['Classe', `${F.classe} / ${F.subclasse}`], ['Patente', `${K.pat.nome}, limite ${K.pat.limite}`]].map(([k, v]) => `<div class="linha"><span class="k rotulo">${k}</span><span class="v">${esc(v || '—')}</span></div>`).join('')}
        </div>
        <div class="edit-only grade-campos">
          <div class="campo"><label class="rotulo" for="e-nivel">Nível</label><select id="e-nivel">${Array.from({ length: 12 }, (_, i) => `<option ${+F.nivel === i + 1 ? 'selected' : ''}>${i + 1}</option>`).join('')}</select></div>
          <div class="campo"><label class="rotulo" for="e-vetor">Vetor</label><input type="text" id="e-vetor" data-campo="vetor" value="${esc(F.vetor)}"></div>
          <div class="campo"><label class="rotulo" for="e-vont">Vontade</label><select id="e-vont">${SIS.vontades.map(v => `<option ${v.nome === F.vontade ? 'selected' : ''}>${esc(v.nome)}</option>`).join('')}</select></div>
          <div class="campo"><label class="rotulo" for="e-foto">Retrato</label><input type="file" id="e-foto" accept="image/*"></div>
        </div>
        ${['pv', 'ps', 'pst'].map(k => `<div class="vital ${k}"><div class="cab"><span class="nome">${{ pv: 'PV · Vida', ps: 'PS · Sanidade', pst: 'PST · Stamina' }[k]}</span><span class="faint mono" style="font-size:11px">${K.form[k]} = ${K.max[k]}</span></div>
          <div class="ctrl"><button class="vbtn" data-v="${k}" data-d="-5" ${podeEditar ? '' : 'disabled'}>−5</button><button class="vbtn" data-v="${k}" data-d="-1" ${podeEditar ? '' : 'disabled'}>−1</button>
          <div class="trilho"><div class="cheio" style="width:${Math.min(100, (F.atual[k] / (K.max[k] || 1)) * 100)}%"></div><div class="txt">${F.atual[k]} / ${K.max[k]}</div></div>
          <button class="vbtn" data-v="${k}" data-d="1" ${podeEditar ? '' : 'disabled'}>+1</button><button class="vbtn" data-v="${k}" data-d="5" ${podeEditar ? '' : 'disabled'}>+5</button></div></div>`).join('')}
      </div>
    </section>

    <div class="abas" role="tablist">${[['pericias', 'Perícias'], ['combate', 'Combate'], ['habilidades', 'Habilidades'], ['rituais', 'Rituais'], ['inventario', 'Inventário'], ['descricao', 'Descrição']].map(([k, n]) => `<button class="${aba === k ? 'aqui' : ''}" data-aba="${k}">${n}</button>`).join('')}</div>
    <section id="sec">${secao(K, C, S)}</section>
    </div>`;
    ligarFicha(K);
  }

  function secao(K, C, S) {
    const barra = `<div class="caixa barra-teste"><div class="campo"><label class="rotulo" for="dt">DT do teste</label><input type="number" id="dt" value="${window._dt ?? 20}"></div><div class="campo"><label class="rotulo" for="bonus">Bônus extra</label><input type="number" id="bonus" value="${window._bonus ?? 0}"></div><span class="dim" style="font-size:13px; margin-left:auto">${esc(K.pat.nome)}: limite <b class="mono" style="color:var(--ouro)">${K.pat.limite}</b> por perícia</span></div>`;
    if (aba === 'pericias') {
      const nomes = mostrarTodas || editando ? SIS.pericias.map(p => p.nome) : [...new Set([...(F.pericias || []).filter(p => p.pontos > 0).map(p => p.nome), ...(vontade(F.vontade)?.pericias || [])])];
      return `<div style="display:grid; gap:12px">${barra}
        <div class="grade-per">${nomes.map(n => { const P = dadosPericia(F, n);
          return `<div class="per ${P.pontos + P.vt ? '' : 'zero'}"><div class="topo-p"><b>${esc(n)}</b><div class="pips">${Array.from({ length: Math.max(K.pat.limite, P.pontos) }, (_, k) => `<span class="pip ${k < P.pontos ? 'on' : ''}"></span>`).join('')}${P.vt ? '<span class="pip vt" title="+1 da Vontade"></span>' : ''}</div></div>
          <div class="mono dim" style="font-size:12px">${P.dados}d20 + ${P.mod} (${SIGLA[P.atr]})</div>
          <div class="edit-only" style="display:flex; gap:6px; align-items:center"><button class="vbtn" data-pp="${esc(n)}" data-d="-1">−</button><button class="vbtn" data-pp="${esc(n)}" data-d="1">+</button>
            <select data-patr="${esc(n)}" style="width:auto; padding:4px">${ATR.map(([k, , s]) => `<option value="${k}" ${P.atr === k ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
          <button class="btn ouro mini" style="justify-self:start" data-teste="${esc(n)}">Rolar teste</button><div class="res" data-res="${esc(n)}"></div></div>`; }).join('')}</div>
        ${editando ? '' : `<button class="btn sec" id="todas" style="justify-self:start">${mostrarTodas ? 'Mostrar só as treinadas' : 'Mostrar todas as perícias'}</button>`}</div>`;
    }
    if (aba === 'combate') {

      return `<div style="display:grid; gap:12px">${barra}${armas.length ? `<div class="lista">${armas.map(([it, i]) => { const P = dadosPericia(F, it.pericia || 'Armas Brancas');

      ${podeEditar ? `<textarea id="d-${k}" data-texto="${k}">${esc(F[k])}</textarea>` : `<p class="dim">${nl(F[k]) || '—'}</p>`}</div>`).join('')}</div>`;

  const cardHab = (h, lista, i) => `<article class="hab"><div class="cab"><span class="nm">${esc(h.nome)}</span>${podeEditar ? `<button class="btn-x" data-rm="${lista}" data-i="${i}" aria-label="Remover">×</button>` : ''}</div>${h.origem ? `<span class="faint" style="font-size:12px">${esc(h.origem)}</span>` : ''}<p>${nl(h.texto)}</p></article>`;
  const cardRitual = (r, i) => `<article class="hab"><div class="cab"><span class="nm">${esc(r.nome)}</span><span style="display:flex; gap:6px; align-items:center">${r.elemento ? elTag(r.elemento) : ''}${podeEditar ? `<button class="btn-x" data-rm="rituais" data-i="${i}" aria-label="Remover">×</button>` : ''}</span></div>

  function ligarFicha(K) {

    $('#e-vont')?.addEventListener('change', e => salvar({ vontade: e.target.value }));
    $('#e-vetor')?.addEventListener('change', e => salvar({ vetor: e.target.value }));

    $$('[data-pp]').forEach(b => b.onclick = () => { const n = b.dataset.pp; const lista = F.pericias || []; let p = lista.find(x => x.nome === n);
      if (!p) { p = { nome: n, pontos: 0, atributo: SIS.pericias.find(x => x.nome === n)?.atributo || 'inteligencia' }; lista.push(p); }
      p.pontos = Math.max(0, Math.min(9, p.pontos + +b.dataset.d)); F.pericias = lista; salvar({ pericias: lista }); render(); });
    $$('[data-patr]').forEach(s => s.onchange = () => { const n = s.dataset.patr; const lista = F.pericias || []; let p = lista.find(x => x.nome === n);
      if (!p) { p = { nome: n, pontos: 0 }; lista.push(p); } p.atributo = s.value; salvar({ pericias: lista }); render(); });
    // testes
    $$('[data-teste]').forEach(b => b.onclick = () => { const n = b.dataset.teste, P = dadosPericia(F, n), mod = P.mod + bnv(); const r = teste(P.dados, mod);
      $(`[data-res="${CSS.escape(n)}"]`).innerHTML = `${r.detalhe} = <b>${r.total}</b>${veredito(r.total, dtv())}${r.nat20 ? ' <span class="critico">20 natural</span>' : ''}`; publicarRolagem(F, n, r); });
    $$('[data-acerto]').forEach(b => b.onclick = () => { const it = F.equipamentos[+b.dataset.acerto]; const P = dadosPericia(F, it.pericia || 'Armas Brancas'); const r = teste(P.dados, P.mod + bnv());
      $('#res-' + b.dataset.acerto).innerHTML = `Acerto ${r.detalhe} = <b>${r.total}</b>${veredito(r.total, dtv())}${r.nat20 ? ' <span class="critico">20 natural</span>' : ''}`; publicarRolagem(F, `Acerto · ${it.nome}`, r); });
    $$('[data-dano]').forEach(b => b.onclick = () => { const i = +b.dataset.dano, it = F.equipamentos[i]; const base = rolar(it.dano); if (!base) return toast('Dano da arma em formato que não sei rolar.');
      const crit = $('#crit-' + i).checked; let total = crit ? base.total * (it.mult || 1) : base.total; let txt = `${esc(it.dano)} → ${base.detalhe} = ${base.total}`;
      if (crit) txt += ` <span class="critico">× ${it.mult || 1} = ${total}</span>`;
      const ex = $('#extra-' + i).value.trim(); if (ex) { const r2 = rolar(ex); if (r2) { total += r2.total; txt += `<br>+ ${esc(ex)} → ${r2.detalhe} = ${r2.total} <span class="faint">(fora do crítico)</span>`; } }
      $('#res-' + i).innerHTML = `${txt}<br>Dano total: <b>${total}</b>`; publicarRolagem(F, `Dano · ${it.nome}${crit ? ' (crítico)' : ''}`, { total, detalhe: base.detalhe }); });
    $('#rolar-livre')?.addEventListener('click', () => { const ex = $('#livre').value; const r = rolar(ex); $('#res-livre').innerHTML = r ? `${r.detalhe} = <b>${r.total}</b>` : '<span class="falha">Formato inválido. Ex.: 2d6+3, 3d20m+4</span>'; if (r) publicarRolagem(F, ex, r); });
    $$('[data-rit]').forEach(b => b.onclick = () => { const r = rolar(b.dataset.expr); if (!r) return; $('#res-rit-' + b.dataset.rit).innerHTML = `${esc(b.dataset.expr)} → ${r.detalhe} = <b>${r.total}</b>`; publicarRolagem(F, `${F.rituais[+b.dataset.rit].nome}`, r); });
    // remover itens/habilidades/rituais
    $$('[data-rm]').forEach(b => b.onclick = () => { const l = b.dataset.rm; F[l].splice(+b.dataset.i, 1); salvar({ [l]: F[l] }); render(); });
    $$('[data-rm-item]').forEach(b => b.onclick = () => { F.equipamentos.splice(+b.dataset.rmItem, 1); salvar({ equipamentos: F.equipamentos }); render(); });
    // adicionar
    const add = (lista, obj) => { F[lista] = [...(F[lista] || []), obj]; salvar({ [lista]: F[lista] }); render(); };
    $('#add-passiva')?.addEventListener('click', () => seletor('Habilidades passivas', SIS.passivas, p => `<b>${esc(p.nome)}</b><p>${esc(p.texto)}</p>`, p => add('passivas', p)));

    $('#novo-item')?.addEventListener('click', () => formItem(it => add('equipamentos', it)));

    $$('[data-texto]').forEach(t => t.addEventListener('input', debounce(() => salvar({ [t.dataset.texto]: t.value }), 800)));

function rolaveis(txt) { return [...new Set((String(txt || '').match(/\b\d+d\d+(?:\s*\+\s*\d+(?:d\d+)?)*\b/g) || []).map(x => x.replace(/\s/g, '')))].slice(0, 3); }
function pentagono(A) {
  const cx = 150, cy = 148, R = 104; const esc_ = Math.max(5, ...ATR.map(a => A?.[a[0]] || 0));
  const pt = (i, r) => { const ang = -Math.PI / 2 + i * 2 * Math.PI / 5; return [cx + r * Math.cos(ang), cy + r * Math.sin(ang)]; };
  let s = '';
  for (let k = 1; k <= esc_; k++) s += `<polygon points="${ATR.map((_, i) => pt(i, R * k / esc_).join(',')).join(' ')}" fill="none" stroke="rgba(190,198,224,${k === esc_ ? .28 : .1})"/>`;
  ATR.forEach((_, i) => { const [x, y] = pt(i, R); s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(190,198,224,.1)"/>`; });
  s += `<polygon points="${ATR.map((a, i) => pt(i, R * Math.max(.04, (A?.[a[0]] || 0) / esc_)).join(',')).join(' ')}" fill="rgba(180,51,59,.28)" stroke="#e3666d" stroke-width="1.5"/>`;
  ATR.forEach((a, i) => { const [x, y] = pt(i, R * Math.max(.04, (A?.[a[0]] || 0) / esc_)); s += `<circle cx="${x}" cy="${y}" r="3.5" fill="#e3666d"/>`; const [lx, ly] = pt(i, R + 20); s += `<text x="${lx}" y="${ly + 4}" text-anchor="middle" fill="#8f95ab" font-family="Barlow, sans-serif" font-size="11" letter-spacing="1.5">${a[2]}</text>`; });
  return s;
}

function ouvirCampanha(id, aoMudar) {
  const st = { camp: null, agentes: {}, fichas: {}, membros: [], rolagens: [], pistas: [], relatorios: [], combate: null };
  const subsFicha = {};
  assinar(db.doc('campanhas/' + id).onSnapshot(s => { st.camp = s.exists ? { id, ...s.data() } : false; aoMudar(st); }));
  assinar(db.collection(`campanhas/${id}/agentes`).onSnapshot(s => {
    const ids = s.docs.map(x => x.id); st.agentes = Object.fromEntries(s.docs.map(x => [x.id, x.data()]));
    ids.forEach(fid => { if (!subsFicha[fid]) subsFicha[fid] = assinar(db.doc('fichas/' + fid).onSnapshot(fs => { st.fichas[fid] = fs.exists ? { id: fid, ...fs.data() } : null; aoMudar(st); })); });
    Object.keys(subsFicha).forEach(fid => { if (!ids.includes(fid)) { subsFicha[fid](); delete subsFicha[fid]; delete st.fichas[fid]; } });
    aoMudar(st);
  }));
  assinar(db.collection(`campanhas/${id}/membros`).onSnapshot(s => { st.membros = s.docs.map(x => x.data()); aoMudar(st); }));
  assinar(db.collection(`campanhas/${id}/rolagens`).orderBy('t', 'desc').limit(40).onSnapshot(s => { st.rolagens = s.docs.map(x => ({ id: x.id, ...x.data() })); aoMudar(st, 'rolagens'); }));
  assinar(db.doc(`campanhas/${id}/publico/pistas`).onSnapshot(s => { st.pistas = s.exists ? s.data().itens || [] : []; aoMudar(st); }));
  assinar(db.doc(`campanhas/${id}/publico/relatorios`).onSnapshot(s => { st.relatorios = s.exists ? s.data().itens || [] : []; aoMudar(st); }));
  assinar(db.doc(`campanhas/${id}/publico/combate`).onSnapshot(s => { st.combate = s.exists ? s.data() : null; aoMudar(st); }));
  return st;
}

  }

        fichaAmeacaModal({ ...base, nome: x.nome, elemento: x.elemento, nivel: x.nivel, ficha: x.ficha }, { pv: x.pv, pvMax: x.pvMax,
          aoPV: v => { x.pv = v; salvarE(); render(); }, aoRolar: (rot, r) => rolarMestre(`${x.nome}: ${rot}`, r, true) }); });
    }
    if (aba === 'investigacao') {
      corpo.innerHTML = `<div class="cab-pagina"><h2>Fichas de investigação</h2><button class="btn" id="nova-p">Adicionar</button></div><p class="dim">Pistas ficam escondidas até você revelar. Reveladas aparecem para os jogadores na aba Pistas.</p>
        <div class="lista">${E.pistas.map((p, i) => `<div class="item"><div class="cab"><span class="nm">${esc(p.titulo)}</span><span style="display:flex; gap:8px; align-items:center"><button class="btn mini ${p.revelada ? 'sec' : 'ouro'}" data-rev="${i}">${p.revelada ? 'Esconder' : 'Revelar'}</button><button class="btn mini sec" data-edp="${i}">Editar</button><button class="btn-x" data-rmp="${i}" aria-label="Apagar">×</button></span></div><p class="dim">${nl(p.texto)}</p>${p.revelada ? '<span class="tag crit" style="justify-self:start">Visível aos jogadores</span>' : ''}</div>`).join('') || '<div class="vazio">Nenhuma pista ainda.</div>'}</div>`;
      const formP = (p, aoSalvar) => abrirModal(p ? 'Editar pista' : 'Nova pista', `<div class="campo"><label class="rotulo" for="p-t">Título</label><input type="text" id="p-t" value="${esc(p?.titulo)}"></div><div class="campo"><label class="rotulo" for="p-x">Conteúdo</label><textarea id="p-x">${esc(p?.texto)}</textarea></div><div class="campo"><label class="rotulo" for="p-i">Imagem (opcional)</label><input type="file" id="p-i" accept="image/*"></div><button class="btn" id="p-ok">Salvar</button>`, (m, fechar) => {
        let img = p?.imagem || ''; m.querySelector('#p-i').onchange = async e => { const u = e.target.files[0] && await enviarImagem(e.target.files[0]); if (u) img = u; };
        m.querySelector('#p-ok').onclick = () => { const t = m.querySelector('#p-t').value.trim(); if (!t) return toast('Dê um título.'); aoSalvar({ ...(p || { id: uid8(), revelada: false }), titulo: t, texto: m.querySelector('#p-x').value, imagem: img }); fechar(); }; });
      $('#nova-p').onclick = () => formP(null, p => { E.pistas.push(p); salvarE(); render(); });
      $$('[data-edp]').forEach(b => b.onclick = () => formP(E.pistas[+b.dataset.edp], p => { E.pistas[+b.dataset.edp] = p; salvarE(); if (p.revelada) publicarPistas(); render(); }));
      $$('[data-rev]').forEach(b => b.onclick = () => { const p = E.pistas[+b.dataset.rev]; p.revelada = !p.revelada; salvarE(); publicarPistas(); render(); });
      $$('[data-rmp]').forEach(b => b.onclick = () => { const p = E.pistas.splice(+b.dataset.rmp, 1)[0]; salvarE(); if (p.revelada) publicarPistas(); render(); });
    }
    if (aba === 'relatorios') {
      corpo.innerHTML = `<div class="cab-pagina"><h2>Relatórios de missão</h2><button class="btn" id="novo-r">Adicionar</button></div><p class="dim">Relatórios são publicados para os jogadores.</p>
        <div class="lista">${st.relatorios.map((r, i) => `<div class="item"><div class="cab"><span class="nm">${esc(r.titulo)}</span><span style="display:flex; gap:8px; align-items:center"><span class="faint">${dataBR(r.t)}</span><button class="btn-x" data-rmr="${i}" aria-label="Apagar">×</button></span></div><p class="dim">${nl(r.texto)}</p></div>`).join('') || '<div class="vazio">Nenhum relatório.</div>'}</div>`;
      const gravarR = itens => db.doc(`campanhas/${id}/publico/relatorios`).set({ itens }).catch(() => toast('Não deu para salvar o relatório.'));
      $('#novo-r').onclick = () => abrirModal('Novo relatório', `<div class="campo"><label class="rotulo" for="r-t">Título</label><input type="text" id="r-t" placeholder="Operação Miasma"></div><div class="campo"><label class="rotulo" for="r-x">Relatório</label><textarea id="r-x" style="min-height:200px"></textarea></div><button class="btn" id="r-ok">Publicar</button>`, (m, fechar) => {
        m.querySelector('#r-ok').onclick = () => { const t = m.querySelector('#r-t').value.trim(); if (!t) return toast('Dê um título.'); gravarR([...st.relatorios, { titulo: t, texto: m.querySelector('#r-x').value, t: Date.now() }]); fechar(); }; });
      $$('[data-rmr]').forEach(b => b.onclick = () => gravarR(st.relatorios.filter((_, i) => i !== +b.dataset.rmr)));
    }
    if (aba === 'dados') {
      corpo.innerHTML = `<div class="caixa" style="display:grid; gap:10px"><span class="rotulo">Rolar dados</span>
        <div style="display:flex; gap:8px; flex-wrap:wrap"><input type="text" id="m-expr" style="flex:1" placeholder="2d6+3 ou 3d20m+4 (m = fica o maior)"><button class="btn ${publico ? 'ouro' : 'sec'}" id="m-vis">${publico ? 'Público' : 'Oculto'}</button><button class="btn" id="m-rolar">Rolar</button></div>
        <div class="res" id="m-res"></div><p class="faint" style="font-size:13px">Oculto: só aparece no seu feed. Público: vai para a aba Rolagens dos jogadores.</p></div>`;
      $('#m-vis').onclick = () => { publico = !publico; render(); };
      const go = () => { const ex = $('#m-expr').value; const r = rolar(ex); if (!r) return toast('Formato inválido.'); $('#m-res').innerHTML = `${r.detalhe} = <b>${r.total}</b>`; rolarMestre(ex, r, !publico); };
      $('#m-rolar').onclick = go; $('#m-expr').onkeydown = e => { if (e.key === 'Enter') go(); };
    }
    if (aba === 'anotacoes') {
      corpo.innerHTML = [['geral', 'Geral', 'Informações gerais ao longo da sessão…'], ['futuras', 'Sessões futuras', 'Notas de possíveis eventos futuros…'], ['anteriores', 'Sessões anteriores', 'O que já aconteceu…']].map(([k, l, ph]) => `<div class="campo" style="margin-bottom:14px"><label class="rotulo" for="an-${k}">${l}</label><textarea id="an-${k}" data-an="${k}" style="min-height:160px" placeholder="${ph}">${esc(E.anotacoes[k])}</textarea></div>`).join('') + '<p class="faint" style="font-size:13px">Salvo automaticamente. Só você lê.</p>';
      $$('[data-an]').forEach(t => t.oninput = () => { E.anotacoes[t.dataset.an] = t.value; salvarE(); });
    }
  }
  render(); desenharFeed();
};

/* =================================================================
   LOGIN
   ================================================================= */
ROTAS.entrar = async () => {
  app.className = 'pagina estreita';
  if (!sb) { app.innerHTML = '<div class="aviso">O site não encontrou a configuração do Supabase (config.js).</div>'; return; }
  if (ME) {
    app.innerHTML = `<div><span class="rotulo">Sua conta</span><h1>${esc(PERFIL?.nome || 'Agente')}</h1></div>
      <div class="caixa" style="display:grid; gap:12px"><div class="campo"><label class="rotulo" for="meu-nome">Nome que aparece na mesa</label><input type="text" id="meu-nome" value="${esc(PERFIL?.nome || '')}"></div>
      <div style="display:flex; gap:8px; flex-wrap:wrap"><button class="btn" id="salvar-nome">Salvar nome</button><button class="btn sec" id="sair-conta">Sair da conta</button></div>
      ${DONO ? '<span class="tag crit" style="justify-self:start">Administrador</span>' : ''}</div>`;
    $('#salvar-nome').onclick = async () => { const nome = $('#meu-nome').value.trim(); if (!nome) return toast('Escreva um nome.');
      const { error } = await sb.from('perfis').update({ nome }).eq('id', ME); if (error) return toast('Não deu para salvar: ' + error.message);
      PERFIL.nome = nome; PERFIS[ME] = nome; desenharQuem(); toast('Nome salvo.'); };
    $('#sair-conta').onclick = async () => { await sb.auth.signOut(); location.hash = 'inicio'; location.reload(); };
    return;
  }
  app.innerHTML = `<div><span class="rotulo">Acesso ao arquivo</span><h1>Entrar</h1></div>
    <div class="caixa" style="display:grid; gap:14px">
      <p class="dim">Digite seu e-mail. Você recebe um link de acesso, sem senha.</p>
      <div class="campo"><label class="rotulo" for="email">E-mail</label><input type="text" id="email" inputmode="email" autocomplete="email" placeholder="voce@exemplo.com"></div>
      <button class="btn" id="enviar-link" style="justify-self:start">Enviar link de acesso</button>
      <div id="msg-login" class="dim"></div>
      <hr style="border:none; border-top:1px solid var(--linha); width:100%">
      <button class="btn sec" id="discord" style="justify-self:start">Entrar com Discord</button>
    </div>`;
  $('#enviar-link').onclick = async () => {
    const email = $('#email').value.trim(); if (!/^\S+@\S+\.\S+$/.test(email)) return toast('E-mail inválido.');
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
    $('#msg-login').innerHTML = error ? `<span class="falha">${esc(error.message)}</span>` : 'Link enviado. Abra o e-mail neste mesmo navegador.';
  };
  $('#discord').onclick = async () => { const { error } = await sb.auth.signInWithOAuth({ provider: 'discord', options: { redirectTo: location.origin + location.pathname } }); if (error) toast('Discord não está ativado no Supabase: ' + error.message); };
};
function desenharQuem() {
  $('#quem').innerHTML = ME ? `<a href="#entrar" style="display:flex; gap:8px; align-items:center; color:var(--lua-dim); text-decoration:none"><span>${esc(PERFIL?.nome || '')}</span><span class="ava" style="background:${corDe(ME)}">${esc(iniciais(PERFIL?.nome || '?'))}</span></a>`
    : '<a class="btn mini" href="#entrar" style="text-decoration:none">Entrar</a>';
}

/* =================================================================
   INÍCIO DO APP
   ================================================================= */
async function carregarSessao(session) {
  ME = session?.user?.id || null; DONO = false; PERFIL = null;
  db = ME ? criarBanco(sb) : null;
  if (ME) {
    const { data } = await sb.from('perfis').select('id,nome,papel').eq('id', ME).maybeSingle();
    PERFIL = data || { id: ME, nome: session.user.email?.split('@')[0] || 'Agente', papel: 'jogador' };
    DONO = PERFIL.papel === 'admin'; PERFIS[ME] = PERFIL.nome;
  }
  desenharQuem();
}
(async function iniciar() {
  try { await carregarBase(); } catch (e) { app.innerHTML = '<div class="aviso">Não deu para carregar os dados do sistema. Abra o site por um servidor (não direto do arquivo) e recarregue.</div>'; return; }
  const cfg = window.ADR_CONFIG;
  if (window.supabase && cfg?.url && cfg?.chave) {
    sb = window.supabase.createClient(cfg.url, cfg.chave, { auth: { persistSession: true, detectSessionInUrl: true } });
    const { data } = await sb.auth.getSession();
    await carregarSessao(data.session);
    let primeiro = true;
    sb.auth.onAuthStateChange(async (ev, session) => {
      if (primeiro) { primeiro = false; if (ev === 'INITIAL_SESSION') return; }
      if ((session?.user?.id || null) !== ME) { await carregarSessao(session); if (location.hash === '#entrar' && ME) location.hash = 'agentes'; else rotear(); }
    });
  } else desenharQuem();
  rotear();
})();
</script>
