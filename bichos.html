        <div class="caixa campo"><label class="rotulo" for="notas-e">Anotações do Mestre</label><textarea id="notas-e">${esc(E.notas)}</textarea></div>`;
      A.querySelectorAll('[data-sol]').forEach(i => i.onchange = () => salvarE({ solucao: { ...E.solucao, [i.dataset.sol]: i.value } }));
      A.querySelector('#notas-e').onchange = ev => salvarE({ notas: ev.target.value });
      A.querySelector('#add-p').onclick = async () => { const t = A.querySelector('#nova-p').value.trim(); if (!t) return; await salvarE({ pistasOcultas: [...(E.pistasOcultas || []), { id: uid8(), txt: t }] }); desenharAba(); };
      A.querySelectorAll('[data-excluir]').forEach(b => b.onclick = async () => { if (!confirm('Excluir esta pista do Mural para sempre?')) return; await salvarC({ pistas: C.pistas.filter(x => x.id !== b.dataset.excluir) }); desenharAba(); });
      A.querySelectorAll('[data-esconder]').forEach(b => b.onclick = async () => { const p = C.pistas.find(x => x.id === b.dataset.esconder); await salvarC({ pistas: C.pistas.filter(x => x.id !== p.id) }); await salvarE({ pistasOcultas: [...(E.pistasOcultas || []), { id: p.id, txt: p.txt }] }); desenharAba(); });
      A.querySelectorAll('[data-apaga]').forEach(b => b.onclick = async () => { if (!confirm('Apagar esta pista escondida?')) return; await salvarE({ pistasOcultas: E.pistasOcultas.filter(p => p.id !== b.dataset.apaga) }); desenharAba(); });
      A.querySelectorAll('[data-rev]').forEach(b => b.onclick = async () => {
        const p = E.pistasOcultas.find(x => x.id === b.dataset.rev);
        await salvarC({ pistas: [...(C.pistas || []), { id: p.id, txt: p.txt, t: Date.now() }] });
        await salvarE({ pistasOcultas: E.pistasOcultas.filter(x => x.id !== p.id), reveladas: [...(E.reveladas || []), p] });
        await postarC('Nova pista no Mural!', 'sistema'); desenharAba();
      });
    } else {
      const faltam = B.PRONTOS.filter(p => !(C.suspeitos || []).some(x => x.id === p.id));
      const falsas = Object.entries(E.inv || {}).filter(([, v]) => v.falsa).map(([k]) => 'p-' + k);
      A.innerHTML = (faltam.length ? `<div class="caixa btns" style="align-items:center;justify-content:space-between"><span>${faltam.length} suspeito(s) pronto(s) fora do Mural: ${faltam.map(p => esc(p.nome)).join(', ')}</span><button class="btn mini" id="su-prontos">Trazer para o Mural</button></div>` : '') + muralHtml(C, true, falsas, QE) + `<div class="caixa btns" style="align-items:center;justify-content:space-between"><span>Fichas, fotos e suspeitos novos ficam na aba Suspeitos.</span><button class="btn mini" id="su-ir">Abrir fichário</button></div>`;
      A.querySelectorAll('[data-esconder]').forEach(b => b.onclick = async () => { const p = C.pistas.find(x => x.id === b.dataset.esconder); await salvarC({ pistas: C.pistas.filter(x => x.id !== p.id) }); await salvarE({ pistasOcultas: [...(E.pistasOcultas || []), { id: p.id, txt: p.txt }] }); desenharAba(); });
      A.querySelectorAll('[data-excluir]').forEach(b => b.onclick = async () => { if (!confirm('Excluir esta pista do Mural para sempre?')) return; await salvarC({ pistas: C.pistas.filter(x => x.id !== b.dataset.excluir) }); desenharAba(); });
      A.querySelectorAll('[data-expor]').forEach(b => b.onclick = async () => { const p = C.pistas.find(x => x.id === b.dataset.expor); await salvarC({ pistas: C.pistas.map(x => x.id === p.id ? { ...x, falsa: !x.falsa } : x) }); if (!p.falsa) await postarC('Uma pista do Mural foi exposta como FALSA!', 'sistema'); desenharAba(); });
      A.querySelectorAll('[data-inoc]').forEach(b => b.onclick = async () => { const x = C.suspeitos.find(y => y.id === b.dataset.inoc); const v = !inocentado(x, QE); QE = { ...QE, inoc: { ...(QE.inoc || {}), [x.id]: v } }; await salvarQ(id, { inoc: { [x.id]: v } }); desenharAba(); });
      A.querySelectorAll('[data-tirasus]').forEach(b => b.onclick = async () => { if (b.dataset.tirasus === E.pronto) { toast('Esse é o Culpado. Troque o Culpado antes de remover.'); return; } if (!confirm('Remover este suspeito do caso?')) return; await salvarC({ suspeitos: C.suspeitos.filter(s => s.id !== b.dataset.tirasus) }); desenharAba(); });
      A.querySelector('#su-prontos')?.addEventListener('click', async () => { await salvarC({ suspeitos: [...(C.suspeitos || []), ...faltam.map(p => ({ id: p.id, nome: p.nome, especie: p.especie, txt: p.txt, inocente: false }))] }); desenharAba(); });
      A.querySelector('#su-ir').onclick = () => { ABA_ESCUDO = 'suspeitos'; desenharAba(); };
    }
  };
  const cardAcao = a => `<div class="acao-c"><div class="top"><b>${esc(a.nome)}</b><button class="btn mini perigo" data-acao="${a.id}" ${a.id === 'atropelar' ? 'disabled' : ''}>Usar</button></div><span class="meta">Cena: ${esc(a.cena)} · Custo: ${a.custo ? a.custo + ' PL' : 'Sem custo'}</span><p>${esc(a.txt)}</p></div>`;
  const desenhar = () => { $('#c-nome').textContent = C.nome; $('#c-placar').innerHTML = placar(C, `<div><span class="rotulo">PL do Culpado</span><span class="big">${E.pl}</span></div>`); };
  $('#abas').onclick = e => { const b = e.target.closest('[data-aba]'); if (b) { ABA_ESCUDO = b.dataset.aba; desenharAba(); } };
  const ocupado = () => document.activeElement?.matches('input, textarea, select') && $('#aba').contains(document.activeElement);
  desenhar(); desenharAba();
  assinar(ref.onSnapshot(s => { if (!s.exists) return; C = s.data(); desenhar(); if (!ocupado()) desenharAba(); }));
  assinar(db.doc(caminhoQ(id)).onSnapshot(s => { QE = s.exists ? (s.data() || {}) : {}; if (ABA_ESCUDO === 'mural' && !ocupado()) desenharAba(); }));
  assinar(eRef.onSnapshot(s => { if (!s.exists) return; E = s.data(); desenhar(); if (!ocupado()) desenharAba(); }));
  const recarregarDets = async () => { DETS = await detetivesDoCaso(id); if (!ocupado()) desenharAba(); };
  assinar(db.collection(`bichos-casos/${id}/detetives`).onSnapshot(() => recarregarDets()));
  assinar(db.collection(`bichos-casos/${id}/rolagens`).orderBy('t', 'desc').limit(60).onSnapshot(s => {
    ROLS = s.docs.map(d => ({ id: d.id, ...d.data() })); LIDOS = new Set(); $('#c-feed').innerHTML = ROLS.length ? ROLS.map(r => linhaRol(r, E.interrog?.[r.id])).join('') : '<div class="vazio">Silêncio no condado.</div>';
    if (ABA_ESCUDO === 'interrog' && !ocupado()) desenharAba();
    aplicarPendentes(s.docs); recarregarDets();
  }));
};

/* =================================================================
   PARTIDA
   ================================================================= */
(async function iniciar() {
  const cfg = window.ADR_CONFIG;
  try {
    sb = window.supabase.createClient(cfg.url, cfg.chave, { auth: { persistSession: true, detectSessionInUrl: false } });
    db = window.criarBanco(sb);
    const { data } = await sb.auth.getSession();
    await sessao(data.session);
    sb.auth.onAuthStateChange(async (ev, s) => { if ((s?.user?.id || null) !== ME) { await sessao(s); rotear(); } });
  } catch (e) { console.error(e); }
  rotear();
})();
async function sessao(s) {
  ME = s?.user?.id || null; MEU_NOME = '';
  if (ME) {
    try { const { data } = await sb.from('perfis').select('nome').eq('id', ME).maybeSingle(); MEU_NOME = data?.nome || s.user.email?.split('@')[0] || 'Detetive'; } catch (e) { MEU_NOME = 'Detetive'; }
  }
  $('#quem').innerHTML = ME ? `<span>🔍 ${esc(MEU_NOME)}</span>` : '<a class="btn mini" href="./#entrar">Entrar</a>';
}
</script>
