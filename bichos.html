ROTAS.mesas = async () => {
  if (!ME) { app.innerHTML = `<div class="cab"><h2>Mesas</h2></div>${precisaEntrar()}`; return; }
  app.innerHTML = `<div class="cab"><div><h2>Mesas</h2><p>Cada mesa é um caso aberto, com Mural, rolagens e o Escudo do Mestre.</p></div><div class="btns"><button class="btn sec" id="entrar">Entrar com código</button><button class="btn" id="criar">Abrir caso</button></div></div><div class="grade" id="lista"><div class="vazio">Folheando os arquivos…</div></div>`;
  const PART = await carregarPart();
  const mestre = (await db.collection('bichos-casos').where('mestre', '==', ME).get()).docs.map(d => ({ id: d.id, ...d.data() }));
  const outros = (await Promise.all(PART.casos.filter(c => !mestre.some(x => x.id === c)).map(c => db.doc('bichos-casos/' + c).get()))).filter(s => s.exists).map(s => ({ id: s.id, ...s.data() }));
  const todos = [...mestre, ...outros];
  $('#lista').innerHTML = todos.length ? todos.map(c => `<a class="card-det" href="#${c.mestre === ME ? 'escudo' : 'caso'}-${c.id}"><span class="ava" style="--sc:${c.mestre === ME ? 'var(--vermelho)' : 'var(--teal)'}">${c.mestre === ME ? 'M' : '🔍'}</span><div><div class="nm">${esc(c.nome)}</div><div class="sub">${c.mestre === ME ? 'Você é o Mestre' : 'Detetive'} · ${FASES[c.fase || 'livre']}</div></div></a>`).join('') : '<div class="vazio">Nenhum caso aberto. Ainda.</div>';
  $('#criar').onclick = () => abrirModal('Abrir caso', `<div class="campo"><label class="rotulo" for="c-nome">Nome do caso</label><input type="text" id="c-nome" value="O Mistério dos Ovos Desaparecidos" maxlength="80"></div>
    <div class="campo"><label class="rotulo" for="c-pr">Culpado (secreto)</label><select id="c-pr">${B.PRONTOS.map(p => `<option value="${p.id}">${esc(p.nome)} (${esc(p.especie)})</option>`).join('')}</select></div>
    <p class="tag">Os quatro prontos entram como suspeitos no Mural. Só você sabe quem é o Culpado.</p><button class="btn" id="c-ok">Abrir</button>`, (m, fechar) => {
    m.querySelector('#c-ok').onclick = async () => {
      const b = m.querySelector('#c-ok'); b.disabled = true;
      try {
        const pr = PRONTO[m.querySelector('#c-pr').value];
        const ref = await db.collection('bichos-casos').add({ mestre: ME, mestreNome: MEU_NOME, nome: m.querySelector('#c-nome').value.trim() || 'Caso sem nome', fase: 'livre', culpado: pr.dados, palheiro: 0, pistas: [], criado: Date.now(),
          suspeitos: B.PRONTOS.map(p => ({ id: p.id, nome: p.nome, especie: p.especie, txt: p.txt, inocente: false })) });
        await db.doc(`mestre/${ME}/bichos/${ref.id}`).set(escudoDe(pr));
        fechar(); location.hash = 'escudo-' + ref.id;
      } catch (e) { toast('Não deu: ' + e.message); b.disabled = false; }
    };
  });
  $('#entrar').onclick = () => abrirModal('Entrar com código', `<div class="campo"><label class="rotulo" for="cod">Código do caso</label><input type="text" id="cod" placeholder="Cole o código que o Mestre mandou"></div><button class="btn" id="cod-ok">Entrar</button>`, (m, fechar) => {
    m.querySelector('#cod-ok').onclick = async () => {
      const id = m.querySelector('#cod').value.trim().replace(/^.*[#-]/, '');
      if (!/^[A-Za-z0-9]{6,40}$/.test(id)) { toast('Código estranho, confere aí.'); return; }
      const s = await db.doc('bichos-casos/' + id).get().catch(() => null);
      if (!s?.exists) { toast('Nenhum caso com esse código.'); return; }
      await entrarCaso(id); fechar(); location.hash = 'caso-' + id;
    };
  });
};
const escudoDe = pr => ({ pronto: pr.id, nome: pr.nome, perfis: [...pr.perfis], pl: pr.pl, pecas: pr.pecas, pecasUsadas: 0, acoes: [...pr.acoes], golpe: pr.golpe, alvo: pr.alvo, cena: 0,
  solucao: { quem: pr.nome, porque: '', onde: '' }, pistasOcultas: [], notas: '' });
async function entrarCaso(id) {
  await db.doc(`bichos-casos/${id}/membros/${ME}`).set({ uid: ME, nome: MEU_NOME, entrou: Date.now() });
  const P = await carregarPart(); if (!P.casos.includes(id)) { P.casos.push(id); await salvarPart(P); }
}
async function levarDetetive(casoId, f) {
  await db.doc(`bichos-casos/${casoId}/detetives/${f.id}`).set({ por: ME, ficha: f.id, entrou: Date.now() });
  await db.doc('bichos-detetives/' + f.id).update({ casos: [casoId, ...(f.casos || []).filter(c => c !== casoId)] });
}

/* ---------- peças comuns da mesa ---------- */
function linhaRol(r) {
  const cls = r.tipo === 'culpado' ? 'culpado' : r.tipo === 'sistema' ? 'sistema' : (r.ok === false ? 'falhou' : '');
  const ef = (r.efeitos || []).length ? `<span class="ef">${r.aplicado ? '✔' : '⏳ aguardando o Mestre'} · ${r.efeitos.map(x => x.t === 'culpado' ? `Culpado ${x.n > 0 ? '+' : ''}${x.n}` : x.t === 'palheiro' ? `Palheiro ${x.n > 0 ? '+' : ''}${x.n}` : x.t === 'completa' ? 'Dedução completa' : `${x.t === 'deducao' ? 'Dedução' : 'Compostura'} de aliado +${x.n}`).join(' · ')}</span>` : '';
  const quem = r.tipo === 'culpado' ? '🦹 O Culpado' : r.tipo === 'sistema' ? '📋 Mestre' : `${esc(r.fnome)} <span style="opacity:.7">${esc(ESP[r.especie]?.nome || '')}</span>`;
  return `<div class="rol ${cls}"><div class="top"><b>${quem}</b><span class="hora">${horaBR(r.t)}</span></div>
    ${r.dados ? `<div class="fila-dados">${r.dados.map(v => dado(v, v >= r.dt ? (v === 6 ? 'ok seis' : 'ok') : 'falha')).join('')}<span class="res">${r.ok ? 'Sucesso' : 'Falha'}</span><span class="hora">${r.suc} em ${r.dt}+${r.complexo ? ' · Complexo' : ''}${r.estilo ? ' · ' + B.ESTILOS[r.estilo].nome : ''}</span></div>` : ''}
    <div>${esc(r.texto)}</div>${ef}</div>`;
}
function placar(C, extra = '') {
  return `<div class="placar">
    <div><span class="rotulo">Cena</span><span class="fase ${C.fase || 'livre'}">${FASES[C.fase || 'livre']}</span></div>
    <div class="culp"><span class="rotulo">Pilha do Culpado</span><span class="big">${C.culpado ?? 0}</span><div class="fila-dados">${Array.from({ length: Math.min(C.culpado || 0, 12) }, () => dado(6)).join('')}</div></div>
    <div><span class="rotulo">Palheiro</span><span class="big">${C.palheiro ?? 0}</span></div>${extra}</div>`;
}
const muralHtml = (C, mestre) => `
  <div class="caixa bloco"><h3>📌 Pistas</h3><div class="mural">${(C.pistas || []).length ? C.pistas.map(p => `<div class="pista">${nl(p.txt)}${mestre ? ` <button class="btn mini sec" data-esconder="${p.id}">Esconder</button>` : ''}</div>`).join('') : '<div class="vazio">Nenhuma pista no mural ainda.</div>'}</div></div>
  <div class="caixa bloco"><h3>🕵️ Suspeitos</h3>${(C.suspeitos || []).map(s => `<div class="suspeito ${s.inocente ? 'inocente' : ''}"><b>${esc(s.nome)}</b><span class="tg">${esc(s.especie)}</span><p>${esc(s.txt)}</p>${mestre ? `<div class="btns"><button class="btn mini sec" data-inoc="${s.id}">${s.inocente ? 'Voltar a suspeito' : 'Marcar inocente'}</button><button class="btn mini perigo" data-tirasus="${s.id}">Remover</button></div>` : ''}</div>`).join('') || '<div class="vazio">Ninguém sob suspeita. Suspeito.</div>'}</div>`;

async function detetivesDoCaso(id) {
  const s = await db.collection(`bichos-casos/${id}/detetives`).get();
  const fs = await Promise.all(s.docs.map(d => db.doc('bichos-detetives/' + d.id).get()));
  return fs.filter(x => x.exists).map(x => ({ id: x.id, ...x.data() })).sort((a, b) => B.ESPECIES.findIndex(e => e.id === a.especie) - B.ESPECIES.findIndex(e => e.id === b.especie));
}

/* ---------- visão do jogador ---------- */
ROTAS.caso = async id => {
  if (!ME) { app.innerHTML = precisaEntrar(); return; }
  const ref = db.doc('bichos-casos/' + id);
  const s0 = await ref.get(); if (!s0.exists) { app.innerHTML = '<div class="vazio">Esse caso foi arquivado.</div>'; return; }
  if (s0.data().mestre !== ME) { const P = await carregarPart(); if (!P.casos.includes(id)) await entrarCaso(id); }
  let C = s0.data(), DETS = [], ROLS = [];
  app.innerHTML = `<div class="cab"><div><span class="fita">Mesa</span><h2 id="c-nome" style="margin-top:8px"></h2><p id="c-sub"></p></div><div class="btns" id="c-btns"></div></div>
    <div id="c-placar"></div><div class="mesa"><div class="bloco"><div class="caixa bloco"><h3>Detetives na mesa</h3><div class="bloco" id="c-dets"></div></div><div id="c-mural" class="bloco"></div></div>
    <div class="bloco"><h3>Rolagens</h3><div class="feed" id="c-feed"></div></div></div>`;
  const desenhar = () => {
    $('#c-nome').textContent = C.nome; $('#c-sub').textContent = `Mestre: ${C.mestreNome || '?'}${C.aviso ? ' · ' + C.aviso : ''}`;
    $('#c-placar').innerHTML = placar(C);
    const meus = DETS.filter(f => f.dono === ME);
    $('#c-btns').innerHTML = `${C.mestre === ME ? `<a class="btn" href="#escudo-${id}">Escudo do Mestre</a>` : ''}${meus.filter(f => !f.fora).map(f => `<button class="btn" data-rolar="${f.id}">🎲 ${esc(f.nome)}</button>`).join('')}<button class="btn sec" id="levar">Levar detetive</button>`;
    $('#c-dets').innerHTML = DETS.length ? DETS.map(f => `<div class="det-mesa ${f.fora ? 'fora' : ''}">${avatar(f)}<div><a class="nm" href="#detetive-${f.id}" style="color:inherit;text-decoration:none">${esc(f.nome)}</a>
      <div class="st"><span>${esc(ESP[f.especie]?.nome)}</span><span>Compostura <b>${f.pilha}</b></span>${C.fase === 'acareacao' ? `<span>Dedução <b>${f.deducao || 0}</b>${f.deducaoCompleta ? ' ✔' : ''}</span>` : ''}<span>PF <b>${f.pf}</b></span>${f.galo ? `<span>Galo <b>${f.galo}</b></span>` : ''}${f.enrolado ? `<span>Enrolado <b>${f.enrolado}</b></span>` : ''}${f.agarrado ? '<span><b>Agarrado</b></span>' : ''}${f.fora ? '<span><b>Fora do caso</b></span>' : ''}</div></div></div>`).join('') : '<div class="vazio">Nenhum detetive ainda.</div>';
    $('#c-mural').innerHTML = muralHtml(C, false);
    $('#c-btns').onclick = async e => {
      const r = e.target.closest('[data-rolar]'); if (r) { abrirRolagem({ ...DETS.find(f => f.id === r.dataset.rolar) }, { id, ...C }); return; }
      if (e.target.closest('#levar')) {
        const s = await db.collection('bichos-detetives').where('dono', '==', ME).get();
        const l = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(f => !DETS.some(x => x.id === f.id));
        escolherDetetive('Levar qual detetive?', l, async f => { try { await levarDetetive(id, f); toast(`${f.nome} chegou na cena do crime.`); recarregarDets(); } catch (er) { toast('Não deu: ' + er.message); } });
      }
    };
  };
  const desenharFeed = () => { $('#c-feed').innerHTML = ROLS.length ? ROLS.map(linhaRol).join('') : '<div class="vazio">Silêncio no condado.</div>'; };
  const recarregarDets = async () => { DETS = await detetivesDoCaso(id); desenhar(); };
  assinar(ref.onSnapshot(s => { if (s.exists) { C = s.data(); desenhar(); } }));
  assinar(db.collection(`bichos-casos/${id}/detetives`).onSnapshot(() => recarregarDets()));
  assinar(db.collection(`bichos-casos/${id}/rolagens`).orderBy('t', 'desc').limit(60).onSnapshot(s => { ROLS = s.docs.map(d => d.data()); desenharFeed(); recarregarDets(); }));
};

/* ---------- escudo do mestre ---------- */
let ABA_ESCUDO = 'culpado';
ROTAS.escudo = async id => {
  if (!ME) { app.innerHTML = precisaEntrar(); return; }
  const ref = db.doc('bichos-casos/' + id), eRef = db.doc(`mestre/${ME}/bichos/${id}`);
  const s0 = await ref.get();
  if (!s0.exists) { app.innerHTML = '<div class="vazio">Esse caso foi arquivado.</div>'; return; }
  if (s0.data().mestre !== ME) { location.hash = 'caso-' + id; return; }
  let C = s0.data(), E = (await eRef.get()).data() || escudoDe(B.PRONTOS[0]), DETS = [], ROLS = [];
  const aplicando = new Set();
  // gravações no caso passam numa fila: update é ler-mesclar-gravar, e duas ao mesmo tempo se atropelam
  let fila = Promise.resolve();
  const emFila = fn => (fila = fila.then(fn, fn));

  app.innerHTML = `<div class="cab"><div><span class="fita" style="background:repeating-linear-gradient(-45deg,var(--vermelho) 0 14px,#b23a31 14px 28px);color:#fff">Escudo do Mestre</span><h2 id="c-nome" style="margin-top:8px"></h2>
    <p>Código para os jogadores: <span class="codigo">${id}</span></p></div><div class="btns"><a class="btn sec" href="#caso-${id}">Ver como jogador</a></div></div>
    <div id="c-placar"></div>
    <div class="mesa"><div class="bloco"><div class="abas" id="abas">${[['culpado', 'Culpado'], ['mesa', 'Mesa'], ['pistas', 'Pistas e solução'], ['mural', 'Mural']].map(([k, n]) => `<button data-aba="${k}">${n}</button>`).join('')}</div><div id="aba" class="bloco"></div></div>
    <div class="bloco"><h3>Rolagens</h3><div class="feed" id="c-feed"></div></div></div>`;

  const salvarE = async p => { E = { ...E, ...p }; try { await eRef.set(E); } catch (e) { toast('Escudo não salvou: ' + e.message); } };
  const salvarC = async p => { C = { ...C, ...p }; try { await emFila(() => ref.update(p)); } catch (e) { toast('Não salvou: ' + e.message); } };
  const postarC = (texto, tipo = 'culpado') => db.collection(`bichos-casos/${id}/rolagens`).add({ uid: ME, tipo, texto, t: Date.now(), aplicado: true }).catch(e => toast('Feed: ' + e.message));
  const gastarPL = async (n, oque) => { if (n && E.pl < n) { toast(`Faltam PL: ${oque} custa ${n}.`); return false; } if (n) await salvarE({ pl: E.pl - n }); return true; };
  const fichaRef = fid => db.doc('bichos-detetives/' + fid);
  const escolherAlvo = (titulo, cb) => escolherDetetive(titulo, DETS.filter(f => !f.fora), cb);

  async function darGalo(f, { atropelar = false } = {}) {
    if ((C.culpado || 0) < 1) { toast('O Culpado está sem dados.'); return; }
    const v = d6();
    await salvarC({ culpado: C.culpado - 1, palheiro: (C.palheiro || 0) + 1 });
    const s = await fichaRef(f.id).get(); const x = s.data();
    if (v === 6 && !atropelar) {
      await fichaRef(f.id).update({ fora: true });
      await postarC(`Deu um Galo em ${f.nome} e tirou 6: ${f.nome} está FORA DO CASO`);
      abrirModal('Tirou 6!', `<div class="resultado">${dado(6, 'g ok seis rola')}<p><b>${esc(f.nome)}</b> está fora do caso.</p>${E.pl >= 4 ? `<button class="btn" id="atp">Atropelar (4 PL): Deixar no caso com +3 Tiques</button>` : ''}</div>`, (m, fechar) => {
        m.querySelector('#atp')?.addEventListener('click', async () => {
          if (!(await gastarPL(4, 'Atropelar'))) return;
          const t = (x.tiques || 0) + 3;
          await fichaRef(f.id).update({ fora: false, tiques: t, galo: Math.max(x.galo || 0, t) });
          await postarC(`Atropelou ${f.nome}: continua no caso, todo estropiado (+3 Tiques)`); fechar();
        });
      });
      return;
    }
    const tiques = (x.tiques || 0) + 1;
    const galo = Math.max((x.galo || 0) + v, tiques);
    await fichaRef(f.id).update({ galo, tiques });
    await postarC(`Deu um Galo em ${f.nome}: dado ${v}, Galo agora ${galo}, Tique ${tiques}`);
    toast(`Galo ${v} em ${f.nome}.`);
  }

  async function usarAcao(aid) {
    const a = ACAO[aid];
    if (aid === 'galo') return escolherAlvo('Dar um Galo em quem?', f => darGalo(f));
    if (aid === 'atropelar') { toast('Atropelar aparece quando Dar um Galo tira 6.'); return; }
    if (aid === 'sumir') return encerrarAcareacao(true);
    if (aid === 'peca') {
      if (C.fase === 'acareacao' && E.pecasUsadas >= E.pecas) { toast(`Já usou as ${E.pecas} Peças desta Acareação.`); return; }
      await salvarE({ pecasUsadas: (E.pecasUsadas || 0) + (C.fase === 'acareacao' ? 1 : 0) });
      await postarC('Pregou uma Peça: TODOS fazem Teste de Espanto!'); await salvarC({ aviso: 'Teste de Espanto para todos!' }); return;
    }
    if (aid === 'rastros') { await salvarE({ alvo: (E.alvo || 4) + 1 }); await postarC('Apagou rastros: a dedução ficou mais difícil'); return; }
    if (aid === 'tirar') return escolherAlvo('Tirar quem do caso?', async f => {
      if (C.fase === 'acareacao' && f.pilha >= (C.culpado || 0)) { toast(`${f.nome} tem ${f.pilha} dados: Precisa ter menos que a sua Pilha (${C.culpado}).`); return; }
      await fichaRef(f.id).update({ fora: true }); await postarC(`Tirou ${f.nome} do caso`);
    });
    if (aid === 'zombar') { await salvarE({ pl: E.pl + 1 }); await postarC('Zombou de um 6 dos detetives (+1 PL)'); return; }
    if (!(await gastarPL(a.custo || 0, a.nome))) return;
    if (aid === 'enrolar') return escolherAlvo('Enrolar quem?', async f => { await fichaRef(f.id).update({ enrolado: 3 }); await postarC(`Enrolou ${f.nome} (Enrolado 3: Todos os testes viram Complexos)`); });
    if (aid === 'aliciar') return escolherAlvo('Aliciar quem?', async f => { await fichaRef(f.id).update({ aliciado: 1 }); await postarC(`Algo mudou em ${f.nome}…`); });
    if (aid === 'agarrar') return escolherAlvo('Agarrar quem?', async f => { await fichaRef(f.id).update({ agarrado: true }); await postarC(`Agarrou ${f.nome}: sem Dedução e o Galo sobe a cada turno`); });
    if (aid === 'desmoralizar') return escolherAlvo('Desmoralizar quem?', f => {
      const e = ESP[f.especie];
      abrirModal('Qual Estilo?', `<div class="btns">${e.estilos.map(k => `<button class="btn sec" data-k="${k}">${B.ESTILOS[k].nome}</button>`).join('')}</div>`, (m, fechar) => {
        m.onclick = async ev => { const b = ev.target.closest('[data-k]'); if (!b) return; fechar(); await fichaRef(f.id).update({ desmoralizados: [...new Set([...(f.desmoralizados || []), b.dataset.k])] }); await postarC(`Desmoralizou ${f.nome}: ${B.ESTILOS[b.dataset.k].nome} fora de combate`); };
      });
    });
    if (aid === 'casca') return escolherAlvo('Casca de Banana em quem (falhou no Espanto)?', f => darGalo(f));
    await postarC(`Usou ${a.nome}`);
  }

  async function encerrarAcareacao(sumiu) {
    for (const f of DETS) {
      const s = await fichaRef(f.id).get(); const x = s.data();
      await fichaRef(f.id).update({ pilha: clamp((x.pilha || 0) + (x.deducao || 0), 0, 6), deducao: 0, deducaoCompleta: false, agarrado: false });
    }
    await salvarC({ fase: 'livre', culpado: (C.culpado || 0) + (sumiu ? 1 : 0), aviso: '' });
    await salvarE({ pecasUsadas: 0 });
    await postarC(sumiu ? 'Sumiu no Mato! A Acareação acabou (+1 dado para o Culpado)' : 'A Acareação acabou', sumiu ? 'culpado' : 'sistema');
  }

  /* efeitos das rolagens dos jogadores: só o Mestre mexe na Pilha do Culpado e no Palheiro */
  async function aplicarPendentes(docs) {
    for (const d of docs) {
      const r = d.data();
      if (r.aplicado || !(r.efeitos || []).length || aplicando.has(d.id)) continue;
      aplicando.add(d.id);
      await emFila(async () => { try {
        const cs = (await ref.get()).data(); let cul = cs.culpado || 0, pal = cs.palheiro || 0;
        for (const x of r.efeitos) {
          if (x.t === 'culpado') cul = Math.max(0, cul + x.n);
          else if (x.t === 'palheiro') pal = Math.max(0, pal + x.n);
          else if (x.t === 'pilha' || x.t === 'deducao') { const fs = await fichaRef(x.ficha).get(); if (fs.exists) { const v = fs.data(); await fichaRef(x.ficha).update(x.t === 'pilha' ? { pilha: clamp((v.pilha || 0) + x.n, 0, 6) } : { deducao: (v.deducao || 0) + x.n }); } }
          else if (x.t === 'completa') await fichaRef(x.ficha).update({ deducaoCompleta: true }).catch(() => {});
        }
        await ref.update({ culpado: cul, palheiro: pal }); C.culpado = cul; C.palheiro = pal;
        await db.doc(`bichos-casos/${id}/rolagens/${d.id}`).update({ aplicado: true });
      } catch (e) { aplicando.delete(d.id); console.warn(e); } });
    }
  }

  const desenharAba = () => {
    $$('#abas button').forEach(b => b.classList.toggle('aqui', b.dataset.aba === ABA_ESCUDO));
    const A = $('#aba');
    if (ABA_ESCUDO === 'culpado') {
      const pr = PRONTO[E.pronto];
      A.innerHTML = `<div class="caixa bloco">
        <div class="btns" style="justify-content:space-between;align-items:center"><div><h3>${esc(E.nome)}</h3><span class="tag">${E.perfis.map(p => B.PERFIS[p].nome).join(' + ')}</span></div>
          <select id="e-pr" style="width:auto">${B.PRONTOS.map(p => `<option value="${p.id}" ${p.id === E.pronto ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}</select></div>
        ${pr ? `<p style="margin:0"><i>"${esc(pr.frase)}"</i></p>` : ''}
        <div class="placar">
          <div><span class="rotulo">Pontos de Lorota</span><span class="big">${E.pl}</span><div class="ctrl"><button data-pl="-1">−</button><button data-pl="1">+</button></div></div>
          <div class="culp"><span class="rotulo">Pilha do Culpado</span><span class="big">${C.culpado || 0}</span><div class="ctrl"><button data-cul="-1">−</button><button data-cul="1">+</button></div></div>
          <div><span class="rotulo">Palheiro</span><span class="big">${C.palheiro || 0}</span><div class="ctrl"><button data-pal="-1">−</button><button data-pal="1">+</button></div></div>
          <div><span class="rotulo">Peças nesta Acareação</span><span class="big">${E.pecasUsadas || 0}/${E.pecas}</span></div>
        </div></div>
        <div class="caixa bloco"><h3>Ações Gerais</h3><div class="lista-acoes">${B.ACOES_GERAIS.map(a => cardAcao(a)).join('')}</div></div>
        <div class="caixa bloco"><h3>Ações Únicas</h3><div class="lista-acoes">${E.acoes.map(k => cardAcao(B.ACOES_UNICAS[k])).join('')}</div></div>
        <div class="caixa bloco"><h3>Golpe Baixo</h3>${(() => { const g = B.GOLPES[E.golpe]; return `<div class="acao-c"><div class="top"><b>${esc(g.nome)}</b><button class="btn mini perigo" data-golpe>Usar</button></div><span class="meta">Cena: ${esc(g.cena)} · Custo: ${esc(g.custo)} PL · Recarga: ${esc(g.recarga)}</span><p>${esc(g.txt)}</p></div>`; })()}</div>
        <div class="caixa bloco"><h3>Intentos (ganhar PL)</h3><div class="intentos">${[...B.INTENTOS, ...E.perfis.map(p => [B.PERFIS[p].intento + ' (Intento Único)', 0])].map(([t, n], i) => `<button data-int="${n}" data-i="${i}">${esc(t)}<span>${n ? '+' + n : '+?'}</span></button>`).join('')}</div></div>`;
      A.querySelector('#e-pr').onchange = async ev => { const pr = PRONTO[ev.target.value]; if (!confirm(`Trocar o Culpado para ${pr.nome}? PL, ações e golpe voltam ao padrão dele.`)) { ev.target.value = E.pronto; return; } await salvarE({ ...escudoDe(pr), solucao: { ...E.solucao, quem: pr.nome }, pistasOcultas: E.pistasOcultas, notas: E.notas }); await salvarC({ culpado: pr.dados }); desenharAba(); };
      A.querySelectorAll('[data-pl]').forEach(b => b.onclick = async () => { await salvarE({ pl: Math.max(0, E.pl + +b.dataset.pl) }); desenharAba(); });
      A.querySelectorAll('[data-cul]').forEach(b => b.onclick = async () => { await salvarC({ culpado: Math.max(0, (C.culpado || 0) + +b.dataset.cul) }); desenharAba(); });
      A.querySelectorAll('[data-pal]').forEach(b => b.onclick = async () => { await salvarC({ palheiro: Math.max(0, (C.palheiro || 0) + +b.dataset.pal) }); desenharAba(); });
      A.querySelectorAll('[data-acao]').forEach(b => b.onclick = async () => { await usarAcao(b.dataset.acao); desenharAba(); });
      A.querySelector('[data-golpe]').onclick = async () => {
        const g = B.GOLPES[E.golpe]; const custo = g.id === 'cheiro' ? 2 * Math.max(1, DETS.length) : g.custo;
        if (!(await gastarPL(custo, g.nome))) return; await postarC(`Golpe Baixo: ${g.nome}! ${g.txt}`); desenharAba();
      };
      A.querySelectorAll('[data-int]').forEach(b => b.onclick = async () => {
        let n = +b.dataset.int; if (!n) { const v = prompt('Quantos PL esse Intento Único rendeu?', '1'); n = Math.max(0, parseInt(v, 10) || 0); if (!n) return; }
        await salvarE({ pl: E.pl + n }); toast(`+${n} PL`); desenharAba();
      });
    } else if (ABA_ESCUDO === 'mesa') {
      A.innerHTML = `<div class="caixa bloco"><span class="rotulo">Cena</span><div class="btns">${Object.entries(FASES).map(([k, n]) => `<button class="btn ${C.fase === k ? '' : 'sec'} mini" data-fase="${k}">${n}</button>`).join('')}${C.fase === 'acareacao' ? '<button class="btn perigo mini" id="encerrar">Encerrar Acareação</button>' : ''}</div>
        <div class="campo"><label class="rotulo" for="aviso">Aviso para a mesa</label><input type="text" id="aviso" value="${esc(C.aviso)}" placeholder="Ex.: Todos rolam Espanto!"></div>
        <div class="btns" style="align-items:center"><span class="rotulo">Tamanho da Pilha de Dedução (secreto)</span><span class="big" style="font:400 26px var(--f-disp)">${E.alvo}</span><div class="ctrl"><button data-alvo="-1">−</button><button data-alvo="1">+</button></div></div>
        ${C.fase !== 'acareacao' && DETS.some(f => !f.fora && f.pilha < (C.culpado || 0)) ? '<p class="tag">A Pilha do Culpado já supera a de algum detetive: dá para começar uma Acareação.</p>' : ''}</div>
        <div class="bloco">${DETS.map(f => `<div class="det-mesa ${f.fora ? 'fora' : ''}">${avatar(f)}<div><a class="nm" href="#detetive-${f.id}" style="color:inherit;text-decoration:none">${esc(f.nome)}</a>
          <div class="st"><span>${esc(ESP[f.especie]?.nome)}</span><span>Compostura <b>${f.pilha}</b></span><span>Dedução <b>${f.deducao || 0}/${E.alvo}</b>${(f.deducao || 0) >= E.alvo || f.deducaoCompleta ? ' <b style="color:var(--teal)">✔ Pista Quente!</b>' : ''}</span><span>PF <b>${f.pf}</b></span><span>Galo <b>${f.galo || 0}</b></span><span>Tique <b>${f.tiques || 0}</b></span>${f.enrolado ? `<span>Enrolado <b>${f.enrolado}</b></span>` : ''}${f.aliciado ? `<span>Aliciado <b>${f.aliciado}</b></span>` : ''}${f.agarrado ? '<span><b>Agarrado</b></span>' : ''}${(f.desmoralizados || []).length ? `<span>Desmoralizado: <b>${f.desmoralizados.map(k => B.ESTILOS[k].nome).join(', ')}</b></span>` : ''}</div></div>
          <div class="acoes-m">${f.fora ? `<button class="btn mini sec" data-volta="${f.id}">Voltar ao caso</button>` : `<button class="btn mini perigo" data-galo="${f.id}">Dar um Galo</button><button class="btn mini sec" data-pf="${f.id}">+1 PF (desafio)</button><button class="btn mini sec" data-espanto="${f.id}">Pedir Espanto</button>${f.agarrado ? `<button class="btn mini sec" data-solta="${f.id}">Soltar</button>` : ''}${(f.desmoralizados || []).length ? `<button class="btn mini sec" data-recomp="${f.id}">Se Recompor</button>` : ''}`}<button class="btn mini sec" data-tirad="${f.id}">Tirar da mesa</button></div></div>`).join('') || '<div class="vazio">Nenhum detetive. Passe o código para os jogadores.</div>'}</div>`;
      A.querySelectorAll('[data-fase]').forEach(b => b.onclick = async () => {
        const nova = b.dataset.fase;
        if (nova === 'acareacao' && C.fase !== 'acareacao') { await salvarE({ pecasUsadas: 0 }); for (const f of DETS) await fichaRef(f.id).update({ deducao: 0, deducaoCompleta: false }); await postarC('ACAREAÇÃO! O Culpado está agindo bem debaixo do bico de vocês.', 'culpado'); }
        else if (C.fase === 'acareacao' && nova !== 'acareacao') { await encerrarAcareacao(false); }
        await salvarC({ fase: nova }); desenharAba();
      });
      A.querySelector('#encerrar')?.addEventListener('click', async () => { await encerrarAcareacao(false); desenharAba(); });
      A.querySelector('#aviso').onchange = ev => salvarC({ aviso: ev.target.value.trim() });
      A.querySelectorAll('[data-alvo]').forEach(b => b.onclick = async () => { await salvarE({ alvo: clamp(E.alvo + +b.dataset.alvo, 1, 6) }); desenharAba(); });
      const F_ = x => DETS.find(f => f.id === x);
      A.querySelectorAll('[data-galo]').forEach(b => b.onclick = () => darGalo(F_(b.dataset.galo)));
      A.querySelectorAll('[data-pf]').forEach(b => b.onclick = async () => { const f = F_(b.dataset.pf); await fichaRef(f.id).update({ pf: clamp(f.pf + 1, 0, 10) }); await postarC(`${f.nome} topou o desafio: +1 PF`, 'sistema'); });
      A.querySelectorAll('[data-espanto]').forEach(b => b.onclick = async () => { const f = F_(b.dataset.espanto); await postarC(`${f.nome}: Teste de Espanto!`, 'sistema'); });
      A.querySelectorAll('[data-volta]').forEach(b => b.onclick = async () => { await fichaRef(b.dataset.volta).update({ fora: false }); });
      A.querySelectorAll('[data-solta]').forEach(b => b.onclick = async () => { await fichaRef(b.dataset.solta).update({ agarrado: false }); });
      A.querySelectorAll('[data-recomp]').forEach(b => b.onclick = async () => { await fichaRef(b.dataset.recomp).update({ desmoralizados: [] }); });
      A.querySelectorAll('[data-tirad]').forEach(b => b.onclick = async () => { if (!confirm('Tirar este detetive da mesa?')) return; await db.doc(`bichos-casos/${id}/detetives/${b.dataset.tirad}`).delete(); });
    } else if (ABA_ESCUDO === 'pistas') {
      A.innerHTML = `<div class="papel bloco"><h3>A solução (só você vê)</h3>
        ${[['quem', 'Quem pegou os ovos'], ['porque', 'Por quê'], ['onde', 'Onde estão agora']].map(([k, n]) => `<div class="campo"><label class="rotulo" for="s-${k}">${n}</label><input type="text" id="s-${k}" data-sol="${k}" value="${esc(E.solucao?.[k])}" style="background:#fffaf0;color:var(--tinta);border-color:#c9b48e"></div>`).join('')}</div>
        <div class="caixa bloco"><h3>Pistas escondidas</h3><p class="tag">Revele no Mural quando um detetive achar.</p>
          ${(E.pistasOcultas || []).map(p => `<div class="acao-c" style="border-left-color:var(--ambar)"><p style="color:var(--texto)">${nl(p.txt)}</p><div class="btns"><button class="btn mini teal" data-rev="${p.id}">Revelar no Mural</button><button class="btn mini perigo" data-apaga="${p.id}">Apagar</button></div></div>`).join('') || '<div class="vazio">Nenhuma pista escondida.</div>'}
          <div class="campo"><label class="rotulo" for="nova-p">Nova pista</label><textarea id="nova-p" placeholder="Ex.: Uma pena de doninha presa no trinco do galinheiro."></textarea></div><button class="btn" id="add-p">Guardar pista</button></div>
        <div class="caixa campo"><label class="rotulo" for="notas-e">Anotações do Mestre</label><textarea id="notas-e">${esc(E.notas)}</textarea></div>`;
      A.querySelectorAll('[data-sol]').forEach(i => i.onchange = () => salvarE({ solucao: { ...E.solucao, [i.dataset.sol]: i.value } }));
      A.querySelector('#notas-e').onchange = ev => salvarE({ notas: ev.target.value });
      A.querySelector('#add-p').onclick = async () => { const t = A.querySelector('#nova-p').value.trim(); if (!t) return; await salvarE({ pistasOcultas: [...(E.pistasOcultas || []), { id: uid8(), txt: t }] }); desenharAba(); };
      A.querySelectorAll('[data-apaga]').forEach(b => b.onclick = async () => { await salvarE({ pistasOcultas: E.pistasOcultas.filter(p => p.id !== b.dataset.apaga) }); desenharAba(); });
      A.querySelectorAll('[data-rev]').forEach(b => b.onclick = async () => {
        const p = E.pistasOcultas.find(x => x.id === b.dataset.rev);
        await salvarC({ pistas: [...(C.pistas || []), { id: p.id, txt: p.txt, t: Date.now() }] });
        await salvarE({ pistasOcultas: E.pistasOcultas.filter(x => x.id !== p.id), reveladas: [...(E.reveladas || []), p] });
        await postarC('Nova pista no Mural!', 'sistema'); desenharAba();
      });
    } else {
      A.innerHTML = muralHtml(C, true) + `<div class="caixa bloco"><h3>Novo suspeito</h3><div class="campo"><label class="rotulo" for="su-n">Nome</label><input type="text" id="su-n"></div><div class="campo"><label class="rotulo" for="su-e">Espécie</label><input type="text" id="su-e"></div><div class="campo"><label class="rotulo" for="su-t">Descrição</label><textarea id="su-t"></textarea></div><button class="btn" id="su-ok">Pôr no Mural</button></div>`;
      A.querySelectorAll('[data-esconder]').forEach(b => b.onclick = async () => { const p = C.pistas.find(x => x.id === b.dataset.esconder); await salvarC({ pistas: C.pistas.filter(x => x.id !== p.id) }); await salvarE({ pistasOcultas: [...(E.pistasOcultas || []), { id: p.id, txt: p.txt }] }); desenharAba(); });
      A.querySelectorAll('[data-inoc]').forEach(b => b.onclick = async () => { await salvarC({ suspeitos: C.suspeitos.map(s => s.id === b.dataset.inoc ? { ...s, inocente: !s.inocente } : s) }); desenharAba(); });
      A.querySelectorAll('[data-tirasus]').forEach(b => b.onclick = async () => { await salvarC({ suspeitos: C.suspeitos.filter(s => s.id !== b.dataset.tirasus) }); desenharAba(); });
      A.querySelector('#su-ok').onclick = async () => { const n = A.querySelector('#su-n').value.trim(); if (!n) return; await salvarC({ suspeitos: [...(C.suspeitos || []), { id: uid8(), nome: n, especie: A.querySelector('#su-e').value.trim(), txt: A.querySelector('#su-t').value.trim(), inocente: false }] }); desenharAba(); };
    }
  };
  const cardAcao = a => `<div class="acao-c"><div class="top"><b>${esc(a.nome)}</b><button class="btn mini perigo" data-acao="${a.id}" ${a.id === 'atropelar' ? 'disabled' : ''}>Usar</button></div><span class="meta">Cena: ${esc(a.cena)} · Custo: ${a.custo ? a.custo + ' PL' : 'Sem custo'}</span><p>${esc(a.txt)}</p></div>`;
  const desenhar = () => { $('#c-nome').textContent = C.nome; $('#c-placar').innerHTML = placar(C, `<div><span class="rotulo">PL do Culpado</span><span class="big">${E.pl}</span></div>`); };
  $('#abas').onclick = e => { const b = e.target.closest('[data-aba]'); if (b) { ABA_ESCUDO = b.dataset.aba; desenharAba(); } };
  const ocupado = () => document.activeElement?.matches('input, textarea, select') && $('#aba').contains(document.activeElement);
  desenhar(); desenharAba();
  assinar(ref.onSnapshot(s => { if (!s.exists) return; C = s.data(); desenhar(); if (!ocupado()) desenharAba(); }));
  assinar(eRef.onSnapshot(s => { if (!s.exists) return; E = s.data(); desenhar(); if (!ocupado()) desenharAba(); }));
  const recarregarDets = async () => { DETS = await detetivesDoCaso(id); if (!ocupado()) desenharAba(); };
  assinar(db.collection(`bichos-casos/${id}/detetives`).onSnapshot(() => recarregarDets()));
  assinar(db.collection(`bichos-casos/${id}/rolagens`).orderBy('t', 'desc').limit(60).onSnapshot(s => {
    ROLS = s.docs.map(d => d.data()); $('#c-feed').innerHTML = ROLS.length ? ROLS.map(linhaRol).join('') : '<div class="vazio">Silêncio no condado.</div>';
    aplicarPendentes(s.docs); recarregarDets();
  }));
};

/* =================================================================
   PARTIDA
   ================================================================= */
(async function iniciar() {
  const cfg = window.ADR_CONFIG;
  try {
    sb = window.supabase.createClient(cfg.url, cfg.chave, { auth: { persistSession: true, detectSessionInUrl: false } });
    db = window.criarBanco(sb);
    const { data } = await sb.auth.getSession();
    await sessao(data.session);
    sb.auth.onAuthStateChange(async (ev, s) => { if ((s?.user?.id || null) !== ME) { await sessao(s); rotear(); } });
  } catch (e) { console.error(e); }
  rotear();
})();
async function sessao(s) {
  ME = s?.user?.id || null; MEU_NOME = '';
  if (ME) {
    try { const { data } = await sb.from('perfis').select('nome').eq('id', ME).maybeSingle(); MEU_NOME = data?.nome || s.user.email?.split('@')[0] || 'Detetive'; } catch (e) { MEU_NOME = 'Detetive'; }
  }
  $('#quem').innerHTML = ME ? `<span>🔍 ${esc(MEU_NOME)}</span>` : '<a class="btn mini" href="./#entrar">Entrar</a>';
}
</script>
</body>
</html>
