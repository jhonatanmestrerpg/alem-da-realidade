<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a110a">
<meta name="color-scheme" content="dark">
<meta name="description" content="Deu a Louca nos Bichos: o mistério dos ovos desaparecidos da Baronesa Cleusa. Extensão do Além da Realidade.">
<title>Deu a Louca nos Bichos · A.R.</title>
<link rel="icon" href="img/icone/favicon.svg" type="image/svg+xml">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="banco.js"></script>
<script src="bichos-dados.js"></script>
<style>
:root {
  color-scheme: dark;
  --madeira: #1a110a; --madeira-2: #24170d; --tabua: #2e1e11; --tabua-2: #3a2716; --veio: rgba(242,182,50,.12);
  --papel: #f3e6c8; --papel-2: #e6d4ac; --tinta: #2a1a0e;
  --ambar: #f2b632; --ambar-hi: #ffd36b; --fita: #f4c430; --vermelho: #e4574d; --teal: #3fb8a3; --azul: #5aa8e8;
  --texto: #f6ead2; --texto-dim: #c9b48e; --texto-faint: #8c7656;
  --f-disp: 'Luckiest Guy', 'Arial Black', sans-serif;
  --f-maq: 'Special Elite', 'Courier New', monospace;
  --f-body: 'Nunito', system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--madeira); }
body { margin: 0; color: var(--texto); font: 16px/1.55 var(--f-body); min-height: 100vh;
  background: radial-gradient(70vmax 50vmax at 50% -10%, rgba(242,182,50,.16), transparent 60%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 2px, transparent 2px 140px), var(--madeira);
  background-attachment: fixed; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--ambar); }
img { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--ambar); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-disp); font-weight: 400; letter-spacing: .02em; line-height: 1.05; margin: 0; }
h2 { font-size: clamp(26px, 4vw, 38px); color: var(--ambar); text-shadow: 2px 2px 0 #000; }
h3 { font-size: 21px; color: var(--ambar-hi); }

/* topo */
.topo { position: sticky; top: 0; z-index: 20; background: #120b06; border-bottom: 3px solid #000; }
.topo::after { content: ""; display: block; height: 12px; background: repeating-linear-gradient(-45deg, var(--fita) 0 16px, #111 16px 32px); }
.topo-in { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 10px 20px; padding: 8px 16px; flex-wrap: wrap; }
.marca { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--texto); }
.marca svg { width: 34px; height: 34px; }
.marca b { font: 400 21px/1 var(--f-disp); }
.marca b i { font-style: normal; color: var(--ambar); }
.nav { display: flex; gap: 2px 18px; flex-wrap: wrap; flex: 1; }
.nav a { color: var(--texto-dim); text-decoration: none; font-weight: 800; font-size: 15px; padding: 6px 0; border-bottom: 3px solid transparent; }
.nav a.aqui, .nav a:hover { color: var(--ambar); border-color: var(--ambar); }
.quem { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--texto-dim); }
.volta { font: 12px var(--f-maq); color: var(--texto-faint); text-decoration: none; border: 1px dashed var(--texto-faint); padding: 3px 8px; }
.volta:hover { color: var(--ambar); border-color: var(--ambar); }

@media (max-width: 640px) { .nav { order: 3; flex-basis: 100%; gap: 2px 16px; } .marca b { font-size: 18px; } .volta { display: none; } }
main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 80px; }
.pagina { display: grid; gap: 22px; }
.cab { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.cab p { margin: 6px 0 0; color: var(--texto-dim); }
.vazio { padding: 40px 16px; text-align: center; color: var(--texto-dim); font-family: var(--f-maq); }

/* botões e campos */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; background: var(--ambar); color: #1a0f05; border: 2px solid #000; box-shadow: 3px 3px 0 #000; font-weight: 800; text-decoration: none; border-radius: 6px; transition: transform .08s, box-shadow .08s; }
.btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 #000; }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.btn.sec { background: var(--tabua-2); color: var(--texto); }
.btn.perigo { background: var(--vermelho); color: #fff; }
.btn.teal { background: var(--teal); }
.btn.mini { padding: 4px 10px; font-size: 13px; box-shadow: 2px 2px 0 #000; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.campo { display: grid; gap: 4px; }
.rotulo { font: 12px var(--f-maq); color: var(--texto-dim); text-transform: uppercase; letter-spacing: .08em; }
input[type=text], input[type=number], input[type=url], select, textarea { width: 100%; padding: 9px 11px; background: #120b06; border: 2px solid var(--tabua-2); border-radius: 6px; color: var(--texto); }
input:focus, select:focus, textarea:focus { border-color: var(--ambar); outline: none; }
textarea { min-height: 80px; resize: vertical; }

/* caixas */
.caixa { background: linear-gradient(180deg, var(--tabua), var(--madeira-2)); border: 2px solid #000; border-radius: 10px; box-shadow: 4px 4px 0 rgba(0,0,0,.6); padding: 16px; }
.papel { background: var(--papel); color: var(--tinta); border-radius: 4px; box-shadow: 3px 4px 0 rgba(0,0,0,.55); padding: 16px 18px; position: relative; }
.papel h3 { color: var(--tinta); }
.papel .rotulo { color: #7a5a35; }
.fita { display: inline-block; background: repeating-linear-gradient(-45deg, var(--fita) 0 14px, #f0b820 14px 28px); color: #111; font: 400 15px var(--f-disp); padding: 4px 14px; border: 2px solid #000; transform: rotate(-1.5deg); letter-spacing: .04em; }
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.tag { display: inline-block; font: 12px var(--f-maq); padding: 2px 8px; border-radius: 4px; background: rgba(0,0,0,.35); border: 1px solid var(--tabua-2); }
.est { align-self: center; display: inline-block; font-weight: 800; font-size: 12px; padding: 2px 9px; border-radius: 999px; color: #111; background: var(--ec); border: 2px solid #000; }
.est.off { background: #555; color: #bbb; text-decoration: line-through; }

/* capa */
.capa { position: relative; border: 3px solid #000; border-radius: 12px; overflow: hidden; box-shadow: 6px 6px 0 #000; }
.capa img { width: 100%; height: auto; aspect-ratio: 1677/938; object-fit: cover; }
.convoca { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(260px, .8fr); gap: 20px; align-items: start; }
.convoca .papel p { margin: 0 0 10px; }
.convoca .papel h3 { margin: 12px 0 6px; }
.conv-sel { font-family: var(--f-maq); font-size: 15px; }
.citacao { font: italic 18px/1.4 var(--f-body); color: var(--ambar-hi); border-left: 4px solid var(--ambar); padding: 6px 14px; margin: 0; }
.aviso-ovo { text-align: center; font-family: var(--f-maq); color: var(--texto-dim); }
@media (max-width: 860px) { .convoca { grid-template-columns: 1fr; } }

/* regras */
.regras { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 22px; align-items: start; }
.sumario { position: sticky; top: 90px; display: grid; gap: 4px; }
.sumario button { text-align: left; background: none; border: 0; border-left: 3px solid var(--tabua-2); padding: 7px 12px; color: var(--texto-dim); font-weight: 800; }
.sumario button.aqui { color: var(--ambar); border-color: var(--ambar); background: rgba(242,182,50,.07); }
.texto-regra { display: grid; gap: 14px; }
.texto-regra h3 { margin-top: 10px; }
.texto-regra p, .texto-regra li { margin: 0; color: var(--texto); }
.texto-regra p + p { margin-top: 8px; }
.texto-regra .lead { font-size: 18px; color: var(--ambar-hi); }
.texto-regra b { color: var(--ambar-hi); }
.texto-regra ol, .texto-regra ul { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.glossario { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.glossario div { background: var(--papel); color: var(--tinta); padding: 8px 10px; border-radius: 4px; display: grid; }
.glossario b { color: var(--tinta) !important; font-weight: 800; }
.glossario span { font: 12px var(--f-maq); color: #7a5a35; } .glossario span::before { content: "no Brutal: "; }
.regra-card { background: var(--papel); color: var(--tinta); border-radius: 4px; padding: 12px 14px; box-shadow: 2px 3px 0 rgba(0,0,0,.5); display: grid; gap: 4px; }
.regra-card b { color: var(--tinta) !important; font: 400 18px var(--f-disp); letter-spacing: .02em; }
.regra-card .meta { font: 12px var(--f-maq); color: #7a5a35; }
.regra-card p { color: var(--tinta) !important; margin: 0; }
.regra-card i { color: #6b4a28; }
.cards-regra { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
@media (max-width: 860px) { .regras { grid-template-columns: 1fr; } .sumario { position: static; display: flex; flex-wrap: wrap; } .sumario button { border-left: 0; border-bottom: 3px solid var(--tabua-2); } }

/* espécie */
.especie { display: grid; align-content: start; gap: 8px; background: var(--papel); color: var(--tinta); border-radius: 6px; padding: 14px; box-shadow: 3px 4px 0 rgba(0,0,0,.55); border-top: 8px solid var(--sc); }
.especie .nm { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.especie .nm b { font: 400 24px var(--f-disp); }
.texto-regra .especie p, .texto-regra .especie b, .texto-regra .especie span:not(.est), .texto-regra .especie i { color: var(--tinta); }
.texto-regra .especie .tg, .texto-regra .especie .nm span { color: #7a5a35; }
.especie .nm span { font: 12px var(--f-maq); color: #7a5a35; }
.especie .tg { font: 12px var(--f-maq); color: #7a5a35; }
.especie p { margin: 0; font-size: 14.5px; }
.especie .hab { border-top: 2px dashed rgba(0,0,0,.25); padding-top: 8px; display: grid; gap: 2px; font-size: 14px; }
.especie .hab b { font-weight: 800; }
.especie.escolher { cursor: pointer; border: 3px solid transparent; transition: transform .1s; }
.especie.escolher:hover { transform: rotate(-.6deg) translateY(-2px); }
.especie.escolher.aqui { border-color: var(--teal); box-shadow: 0 0 0 3px #000, 4px 6px 0 rgba(0,0,0,.6); }

/* avatar */
.ava { width: 56px; height: 56px; flex: none; border-radius: 50%; border: 3px solid #000; background: var(--sc) center/cover no-repeat; display: grid; place-items: center; font: 400 22px var(--f-disp); color: #1a0f05; box-shadow: 2px 2px 0 #000; }
.ava.g { width: 112px; height: 112px; font-size: 44px; }
.ava.fora { filter: grayscale(1) brightness(.6); }

/* cartão de detetive */
.card-det { display: flex; gap: 12px; align-items: center; padding: 12px; background: var(--tabua); border: 2px solid #000; border-radius: 10px; box-shadow: 3px 3px 0 #000; text-decoration: none; color: var(--texto); }
.card-det:hover { background: var(--tabua-2); }
.card-det .nm { font: 400 20px var(--f-disp); }
.card-det .sub { font: 12px var(--f-maq); color: var(--texto-dim); }
.card-det.fora .nm { text-decoration: line-through; text-decoration-color: var(--vermelho); }

/* dados */
.d6 { --t: 30px; width: var(--t); height: var(--t); flex: none; background: #fbf4e2; border: 2px solid #000; border-radius: 22%; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: calc(var(--t) * .12); box-shadow: 2px 2px 0 #000; }
.d6 i { width: 100%; height: 100%; border-radius: 50%; background: transparent; transform: scale(.78); }
.d6 i.p { background: #1a0f05; }
.d6.ok { background: var(--teal); } .d6.ok i.p { background: #04110e; }
.d6.falha { background: #6b5a48; opacity: .75; } .d6.falha i.p { background: #2a1a0e; }
.d6.seis { background: var(--ambar); }
.d6.vazio { background: transparent; border-style: dashed; border-color: var(--texto-faint); box-shadow: none; }
.d6.g { --t: 46px; }
.d6.rola { animation: rola .5s ease both; }
@keyframes rola { 0% { transform: rotate(-200deg) scale(.4); opacity: 0; } 70% { transform: rotate(15deg) scale(1.1); } 100% { transform: none; opacity: 1; } }
.fila-dados { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

/* ficha */
.ficha { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.ficha-topo { grid-column: 1 / -1; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.ficha-topo h2 { font-size: clamp(30px, 5vw, 46px); }
.ficha-topo .sub { font: 14px var(--f-maq); color: var(--texto-dim); }
.pilha { display: grid; gap: 8px; }
.pilha .cab-p { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.pilha .cab-p b { font: 400 19px var(--f-disp); color: var(--ambar-hi); }
.pilha .num { font: 400 28px var(--f-disp); }
.ctrl { display: inline-flex; gap: 4px; }
.ctrl button { width: 34px; height: 34px; border: 2px solid #000; background: var(--tabua-2); color: var(--texto); border-radius: 6px; font-weight: 800; box-shadow: 2px 2px 0 #000; }
.ctrl button:disabled { opacity: .35; cursor: default; }
.faro { display: flex; gap: 4px; flex-wrap: wrap; }
.faro button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #000; background: #120b06; padding: 0; }
.faro button.on { background: var(--teal); box-shadow: 0 0 10px rgba(63,184,163,.7); }
.encrencas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.encrenca { display: grid; gap: 6px; justify-items: center; text-align: center; background: #120b06; border: 2px solid #000; border-radius: 8px; padding: 10px 6px; }
.encrenca b { font: 400 16px var(--f-disp); }
.encrenca.ativa { border-color: var(--vermelho); box-shadow: inset 0 0 18px rgba(228,87,77,.35); }
.encrenca .val { font: 400 30px var(--f-disp); color: var(--vermelho); }
.encrenca .val.zero { color: var(--texto-faint); }
.bloco { display: grid; gap: 10px; }
.vant { display: grid; gap: 2px; padding: 10px 12px; background: #120b06; border-left: 4px solid var(--vc, var(--ambar)); border-radius: 4px; }
.vant b { font-weight: 800; } .vant .meta { font: 12px var(--f-maq); color: var(--texto-dim); } .vant p { margin: 0; font-size: 14px; }
.vant.off { opacity: .45; }
.apego { display: grid; gap: 4px; }
.apego .linha { display: flex; gap: 8px; align-items: center; }
.apego .linha input[type=text] { flex: 1; }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--texto-dim); white-space: nowrap; }
.fora-banner { grid-column: 1 / -1; text-align: center; padding: 20px; border: 3px solid #000; border-radius: 10px; background: repeating-linear-gradient(-45deg, var(--fita) 0 22px, #111 22px 44px); }
.fora-banner span { display: inline-block; background: #000; color: var(--fita); font: 400 clamp(22px, 4vw, 34px) var(--f-disp); padding: 6px 20px; }
@media (max-width: 860px) { .ficha { grid-template-columns: 1fr; } }

/* mesa / caso */
.mesa { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, .85fr); gap: 18px; align-items: start; }
.placar { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.placar > div { background: #120b06; border: 2px solid #000; border-radius: 10px; padding: 12px; display: grid; gap: 6px; }
.placar .rotulo { color: var(--texto-dim); }
.placar .big { font: 400 34px var(--f-disp); color: var(--ambar); line-height: 1; }
.placar .d6 { --t: 20px; }
.placar .culp .big { color: var(--vermelho); }
.fase { justify-self: start; display: inline-flex; align-items: center; gap: 8px; font: 400 18px var(--f-disp); padding: 4px 14px; border: 2px solid #000; border-radius: 999px; background: var(--teal); color: #04110e; }
.fase.suspense { background: var(--ambar); }
.fase.investigacao { background: var(--azul); color: #06121e; }
.relogio { display: flex; gap: 5px; flex-wrap: wrap; }
.relogio i { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #000; background: #120b06; }
.relogio i.on { background: var(--vermelho); box-shadow: 0 0 8px rgba(228,87,77,.7); }
.ponto { display: grid; gap: 4px; padding: 10px 12px; background: #120b06; border: 2px dashed var(--azul); border-radius: 8px; }
.ponto b { font: 400 17px var(--f-disp); color: var(--ambar-hi); }
.ponto p { margin: 0; font-size: 14px; color: var(--texto-dim); }
.ponto.achado { border-style: solid; border-color: var(--teal); opacity: .7; }
.ponto .segredo { color: var(--fita); font-size: 13.5px; }
.pista.falsa { background: repeating-linear-gradient(-45deg, #f3e6c8 0 14px, #f0d9a8 14px 28px); }
.pista.falsa::after { content: "FALSA"; position: absolute; right: 10px; top: 8px; font: 400 18px var(--f-disp); color: var(--vermelho); transform: rotate(8deg); border: 2px solid var(--vermelho); padding: 0 6px; }
.fase.acareacao { background: var(--vermelho); color: #fff; animation: pulso 1.4s ease-in-out infinite; }
@keyframes pulso { 50% { box-shadow: 0 0 18px rgba(228,87,77,.9); } }
.feed { display: grid; gap: 8px; max-height: 70vh; overflow: auto; padding-right: 4px; }
.rol { background: var(--papel); color: var(--tinta); border-radius: 4px; padding: 10px 12px; display: grid; gap: 6px; box-shadow: 2px 3px 0 rgba(0,0,0,.5); border-left: 6px solid var(--rc, var(--teal)); }
.rol.falhou { --rc: var(--vermelho); }
.rol.culpado { background: #2a0f0c; color: #ffd9d4; --rc: var(--vermelho); }
.rol.sistema { background: #1d2a26; color: #d6f5ee; --rc: var(--teal); }
.rol .top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.rol .top b { font-weight: 800; }
.rol .hora { font: 11px var(--f-maq); opacity: .7; }
.rol .res { font: 400 18px var(--f-disp); }
.rol .ef { font: 12px var(--f-maq); opacity: .8; }
.rol .d6 { --t: 24px; }
.mural { display: grid; gap: 10px; }
.pista { background: var(--papel); color: var(--tinta); padding: 10px 14px; border-radius: 3px; box-shadow: 2px 3px 0 rgba(0,0,0,.5); position: relative; font-size: 15px; }
.pista::before { content: ""; position: absolute; top: -6px; left: 50%; width: 14px; height: 14px; border-radius: 50%; background: var(--vermelho); border: 2px solid #000; transform: translateX(-50%); }
.pista:nth-child(odd) { transform: rotate(-.7deg); } .pista:nth-child(even) { transform: rotate(.6deg); }
.suspeito { display: grid; gap: 4px; background: #120b06; border: 2px dashed var(--texto-faint); border-radius: 8px; padding: 10px 12px; }
.suspeito b { font: 400 18px var(--f-disp); color: var(--ambar-hi); }
.suspeito .tg { font: 12px var(--f-maq); color: var(--texto-dim); }
.suspeito p { margin: 0; font-size: 14px; }
.suspeito.inocente { opacity: .5; } .suspeito.inocente b::after { content: " · inocente"; color: var(--teal); font-size: 13px; }
.det-mesa { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px; background: #120b06; border: 2px solid #000; border-radius: 8px; }
.det-mesa .nm { font: 400 17px var(--f-disp); }
.det-mesa .st { display: flex; gap: 10px; flex-wrap: wrap; font: 12px var(--f-maq); color: var(--texto-dim); }
.det-mesa .st b { color: var(--texto); }
.det-mesa .acoes-m { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.det-mesa.fora { opacity: .5; }
.abas { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 3px solid #000; }
.abas button { background: var(--tabua); border: 2px solid #000; border-bottom: 0; border-radius: 8px 8px 0 0; padding: 8px 14px; font-weight: 800; color: var(--texto-dim); }
.abas button.aqui { background: var(--ambar); color: #1a0f05; }
.acao-c { display: grid; gap: 4px; padding: 10px 12px; background: #120b06; border: 2px solid #000; border-left: 5px solid var(--vermelho); border-radius: 6px; }
.acao-c .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.acao-c b { font: 400 17px var(--f-disp); }
.acao-c .meta { font: 12px var(--f-maq); color: var(--texto-dim); }

  background: radial-gradient(circle at 20% 30%, rgba(255,255,255,.05) 0 2px, transparent 3px) 0 0 / 14px 14px, radial-gradient(circle at 70% 60%, rgba(0,0,0,.18) 0 2px, transparent 3px) 0 0 / 11px 11px, linear-gradient(135deg, #b98a55, #a77744 50%, #b48552);
  box-shadow: inset 0 0 0 14px #6b4424, inset 0 0 0 17px #000, inset 0 0 60px rgba(0,0,0,.45); }

      <svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="22" rx="12" ry="15" fill="#fbf4e2" stroke="#000" stroke-width="2"/><path d="M8 24 l5 -4 l4 4 l5 -5 l4 5 l5 -4 l2 2" fill="none" stroke="#000" stroke-width="2"/><circle cx="29" cy="11" r="6" fill="none" stroke="#f2b632" stroke-width="2.5"/><path d="m33 15 4 4" stroke="#f2b632" stroke-width="3" stroke-linecap="round"/></svg>
      <b>Deu a Louca <i>nos Bichos</i></b>

  </div>
</header>
<main><div id="app" class="pagina"><div class="vazio">Abrindo o arquivo do caso…</div></div></main>
<div id="camada"></div>

<script>
'use strict';
const B = window.BICHOS;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nl = s => esc(s).replace(/\n/g, '<br>');
const app = $('#app');
const ESP = Object.fromEntries(B.ESPECIES.map(e => [e.id, e]));
const PRONTO = Object.fromEntries(B.PRONTOS.map(p => [p.id, p]));
const ACAO = { ...Object.fromEntries(B.ACOES_GERAIS.map(a => [a.id, a])), ...B.ACOES_UNICAS };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const d6 = () => { const a = new Uint32Array(1); crypto.getRandomValues(a); return 1 + (a[0] % 6); };
const uid8 = () => Math.random().toString(36).slice(2, 10);
const horaBR = t => t ? new Date(t).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
const iniciais = n => (n || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const FASES = { livre: 'Cena Livre', investigacao: 'Investigação', suspense: 'Suspense', acareacao: 'Acareação' };
const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
const dado = (v, cls = '') => `<span class="d6 ${cls}" title="${v || ''}">${Array.from({ length: 9 }, (_, i) => `<i class="${v && PIPS[v].includes(i) ? 'p' : ''}"></i>`).join('')}</span>`;
const estTag = (k, off) => `<span class="est ${off ? 'off' : ''}" style="--ec:${B.ESTILOS[k].cor}">${B.ESTILOS[k].nome}</span>`;
const avatar = (f, g = '') => { const e = ESP[f.especie] || {}; return `<span class="ava ${g} ${f.fora ? 'fora' : ''}" style="--sc:${e.cor || '#888'};${f.foto ? `background-image:url('${esc(f.foto)}')` : ''}">${f.foto ? '' : esc(iniciais(f.nome))}</span>`; };

/* ---------- modal ---------- */
function abrirModal(titulo, corpo, ligar) {
  const camada = $('#camada');
  camada.innerHTML = `<div class="fundo-modal"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><div class="cab-m"><h2>${esc(titulo)}</h2><button class="btn-x" data-fechar aria-label="Fechar">×</button></div>${corpo}</div></div>`;
  const fechar = () => { camada.innerHTML = ''; };
  camada.querySelector('[data-fechar]').onclick = fechar;
  camada.querySelector('.fundo-modal').addEventListener('click', e => { if (e.target.classList.contains('fundo-modal')) fechar(); });
  ligar?.(camada.querySelector('.modal'), fechar);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#camada').innerHTML = ''; });
function escolherDetetive(titulo, lista, aoEscolher) {
  abrirModal(titulo, lista.length ? `<div class="grade">${lista.map(f => `<button class="card-det" data-f="${f.id}" style="text-align:left">${avatar(f)}<div><div class="nm">${esc(f.nome)}</div><div class="sub">${esc(ESP[f.especie]?.nome)}</div></div></button>`).join('')}</div>` : '<div class="vazio">Nenhum detetive aqui.</div>', (m, fechar) => {
    m.addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b) { fechar(); aoEscolher(lista.find(f => f.id === b.dataset.f)); } });
  });
}

/* ---------- conexão ---------- */
let sb = null, db = null, ME = null, MEU_NOME = '';
let SUBS = [];
const assinar = f => SUBS.push(f);
const limparSubs = () => { SUBS.forEach(f => { try { f(); } catch (e) {} }); SUBS = []; };
const precisaEntrar = () => `<div class="caixa vazio"><p>Para abrir fichas e mesas você precisa entrar com a sua conta do Além da Realidade.</p><a class="btn" href="./#entrar">Entrar pelo A.R.</a></div>`;
async function carregarPart() { if (!ME) return { casos: [] }; const s = await db.doc(`data/users/${ME}/bichos`).get(); return s.exists ? { casos: [], ...s.data() } : { casos: [] }; }
async function salvarPart(p) { await db.doc(`data/users/${ME}/bichos`).set(p); }

/* ---------- roteador ---------- */
const ROTAS = {};
async function rotear() {
  limparSubs(); $('#camada').innerHTML = '';
  const h = location.hash.slice(1) || 'inicio';
  const [base, ...resto] = h.split('-'); const arg = resto.join('-');
  const sec = { detetive: 'detetives', novo: 'detetives', caso: 'mesas', escudo: 'mesas', historico: 'mesas' }[base] || base;
  $$('#nav a').forEach(a => a.classList.toggle('aqui', a.dataset.sec === sec));
  const fn = ROTAS[base] || ROTAS.inicio;
  try { await fn(arg); } catch (e) { console.error(e); app.innerHTML = `<div class="vazio">Deu ruim abrindo esta página: ${esc(e.message || e.code || e)}</div>`; }
  scrollTo({ top: 0 });
}
addEventListener('hashchange', rotear);

/* =================================================================
   INÍCIO
   ================================================================= */
ROTAS.inicio = async () => {
  app.innerHTML = `
  <div class="capa"><img src="img/bichos/capa.webp" alt="Texugo, coruja e raposa detetives diante do ninho vazio da Baronesa, cercado por fita de cena do crime." width="1677" height="938"></div>
  <div class="convoca">
    <div class="papel">
      <span class="fita">🪺 GansoTopolópis</span>
      <p class="conv-sel" style="margin-top:14px">"Os ovos da Baronesa Cleusa desapareceram na madrugada. O condado inteiro… é suspeito."</p>
      <h3>🪶 O Crime</h3>
      <p>Na manhã fria de terça-feira, a Baronesa Gansa Cleusa, nobre soberana do Condado de GansoTopolópis, acordou para o horror: seu ninho estava vazio. Seus preciosos ovos, herdeiros legítimos do título baronial, haviam sumido sem deixar rastro. Sem penas. Sem testemunhas. Sem explicação.</p>
      <h3>🔍 A Investigação</h3>
      <p>Diante do escândalo que abalou toda a nobreza animal, uma equipe de detetives foi convocada às pressas. Coelhos analistas, corvos investigadores, raposas interrogadoras e tatus farejadores agora percorrem cada canto do condado em busca de pistas, rastros e contradições nos depoimentos.</p>
      <h3>🏰 O Condado</h3>
      <p>GansoTopolópis parece pacato à primeira vista, com seus campos de trigo e lagos tranquilos. Porém, conforme a investigação avança, segredos antigos começam a emergir. Rivalidades entre vizinhos, alianças suspeitas e testemunhos contraditórios revelam que nem todo animal é tão inocente quanto aparenta.</p>
      <h3>⚠️ O Caso</h3>
      <p>Cabe a vocês vasculharem o condado, interrogarem os suspeitos e desvendarem o mistério antes que as pistas desapareçam… e os ovos também.</p>
    </div>
    <div class="bloco">
      <div class="caixa bloco">
        <h3>Como entrar no caso</h3>
        <ol style="margin:0;padding-left:20px;display:grid;gap:6px">
          <li>Leia as <a href="#regras">regras</a>. É o Brutal com penas.</li>
          <li>Crie seu <a href="#detetives">detetive</a> escolhendo uma das 12 espécies.</li>
          <li>Entre na <a href="#mesas">mesa</a> com o código que o Mestre mandar.</li>
        </ol>
        <div class="btns"><a class="btn" href="#novo">Criar detetive</a><a class="btn sec" href="#mesas">Mesas</a></div>
      </div>
      <blockquote class="citacao">Alguém no condado sabe onde estão os ovos. E esse alguém está muito, muito quieto.</blockquote>
      <div class="caixa bloco">
        <h3>Suspeitos conhecidos</h3>
        ${B.PRONTOS.map(p => `<div class="suspeito"><b>${esc(p.nome)}</b><span class="tg">${esc(p.especie)}</span><p>"${esc(p.frase)}"</p></div>`).join('')}
      </div>
    </div>
  </div>
  <p class="aviso-ovo">🥚 Extensão do Além da Realidade · adaptado do Brutal: Corte Rápido 🥚</p>`;
};

/* =================================================================
   REGRAS
   ================================================================= */
const cardRegra = (x, extra = '') => `<div class="regra-card"><b>${esc(x.nome)}</b>${extra}<p>${esc(x.txt)}</p></div>`;
function especieCard(e, cls = '') {
  return `<div class="especie ${cls}" style="--sc:${e.cor}" data-esp="${e.id}">
    <div class="nm"><b>${esc(e.nome)}</b><span>${esc(e.papel)}</span></div>
    <div class="tg">${esc(e.tags)}</div>
    <div class="btns">${e.estilos.map(k => estTag(k)).join('')}</div>
    <p>${esc(e.desc)}</p>
    <div class="hab"><b>${esc(e.hab.nome)}</b><i>"${esc(e.hab.frase)}"</i><span class="tg">Cena: ${esc(e.hab.cena)} · Recarga: ${esc(e.hab.recarga)}</span><span>${esc(e.hab.txt)}</span></div>
  </div>`;
}
ROTAS.regras = async arg => {

/* imagens: igual ao site principal (encolhe para webp, sobe na pasta da conta, sem sobrescrever) */
async function encolherImagem(file, lado = 1600) {
  if (!/^image\/(jpeg|png|webp|bmp|heic|heif)/i.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file); const k = Math.min(1, lado / Math.max(bmp.width, bmp.height));
    if (k === 1 && file.size < 900 * 1024) return file;
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(ok => cv.toBlob(ok, 'image/webp', 0.86)); if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.[^.]+$/, '') + '.webp', { type: 'image/webp' });
  } catch (e) { return file; }
}
async function enviarImagem(file) {
  if (!sb || !ME) { toast('Entre na sua conta para enviar imagens.'); return null; }
  file = await encolherImagem(file);
  if (file.size > 8 * 1024 * 1024) { toast('Imagem acima de 8 MB. Reduza e tente de novo.'); return null; }
  const ext = (file.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '') || 'png';
  const caminho = `${ME}/${Date.now()}-${uid8()}.${ext}`;
  const { error } = await sb.storage.from('imagens').upload(caminho, file, { contentType: file.type || 'image/png', upsert: false });
  if (error) { toast('Não deu para enviar a imagem: ' + error.message); return null; }
  return sb.storage.from('imagens').getPublicUrl(caminho).data.publicUrl;
}

function editarFicha(F, ref) {
  abrirModal('Editar detetive', `<div class="campo"><label class="rotulo" for="e-nome">Nome</label><input type="text" id="e-nome" value="${esc(F.nome)}" maxlength="60"></div>
    <div class="campo"><label class="rotulo" for="e-esp">Espécie</label><select id="e-esp">${B.ESPECIES.map(e => `<option value="${e.id}" ${e.id === F.especie ? 'selected' : ''}>${esc(e.nome)} ${esc(e.papel)}</option>`).join('')}</select></div>
    <div class="campo"><label class="rotulo" for="e-foto">Retrato (link de imagem)</label><input type="text" inputmode="url" id="e-foto" value="${esc(F.foto)}" placeholder="https://…"></div>
    <div class="campo"><label class="rotulo" for="e-arq">Ou envie uma imagem</label><input type="file" id="e-arq" accept="image/*"></div>
    <div class="btns"><button class="btn" id="e-ok">Salvar</button></div>`, (m, fechar) => {
    m.addEventListener('paste', ev => { const f = [...(ev.clipboardData?.files || [])].find(x => x.type.startsWith('image/')); if (!f) return; ev.preventDefault(); const dt = new DataTransfer(); dt.items.add(f); m.querySelector('#e-arq').files = dt.files; toast('Imagem colada. Clique em Salvar.'); });
    m.querySelector('#e-ok').onclick = async () => {
      const b = m.querySelector('#e-ok'); b.disabled = true; b.textContent = 'Enviando…';
      try {
        let foto = m.querySelector('#e-foto').value.trim();
        const arq = m.querySelector('#e-arq').files[0];
        if (arq) { foto = await enviarImagem(arq); if (!foto) { b.disabled = false; b.textContent = 'Salvar'; return; } }
        await ref.update({ nome: m.querySelector('#e-nome').value.trim() || F.nome, especie: m.querySelector('#e-esp').value, foto });
        fechar();
      } catch (e) { toast('Não salvou: ' + (e.message || e)); b.disabled = false; b.textContent = 'Salvar'; }
    };
  });
}

  { id: 'jogar', nome: 'Se Jogar na Frente', sub: 'Acareação · Descarta tudo', acar: true, semRolar: true },
];

async function abrirRolagem(F, CASO, opt = {}) {
  const LER = opt.ler || null;
  const e = ESP[F.especie];
  const fase = CASO?.fase || 'livre';
  let acao = (LER || opt.interrogar) ? 'interrogar' : fase === 'acareacao' ? 'rastro' : fase === 'investigacao' ? 'vasculhar' : 'teste';
  const INV = CASO?.inv || null;
  const pontosLivres = (INV?.pontos || []).filter(p => !p.achado);
  let aliados = [];
  if (CASO) { try { const s = await db.collection(`bichos-casos/${CASO.id}/detetives`).get(); const ids = s.docs.map(d => d.id).filter(x => x !== F.id); aliados = (await Promise.all(ids.map(x => db.doc('bichos-detetives/' + x).get()))).filter(x => x.exists).map(x => ({ id: x.id, ...x.data() })); } catch (er) {} }
  abrirModal(`Arriscar dados · ${F.nome}`, `
    <p class="tag" style="justify-self:start">${CASO ? `${esc(CASO.nome)} · ${FASES[fase]}` : 'Sem mesa: A rolagem fica só aqui'}</p>
    <div class="opcoes-rol" id="r-acoes">${ACOES_ROL.filter(a => (a.acar ? fase === 'acareacao' : a.inv ? fase === 'investigacao' : a.foraAcar ? fase !== 'acareacao' : true)).map(a => `<button data-a="${a.id}"><b>${a.nome}</b><span>${a.sub}</span></button>`).join('')}</div>
    <div id="r-corpo"></div>`, (m, fechar) => {
    const corpo = m.querySelector('#r-corpo');
    const pinta = () => {
      m.querySelectorAll('[data-a]').forEach(b => b.classList.toggle('aqui', b.dataset.a === acao));
      const A = ACOES_ROL.find(a => a.id === acao);
      if (acao === 'interrogar' && !LER) {
        const sus = (CASO?.suspeitos || []).filter(x => !x.inocente);
        corpo.innerHTML = CASO ? `<p>Escolha quem interrogar e faça três perguntas. O Mestre responde com uma verdade, uma meia-verdade e uma mentira. Depois você rola para ler o bicho.</p>
          <div class="campo"><label class="rotulo" for="i-npc">Quem</label><select id="i-npc">${sus.map(x => `<option value="${esc(x.nome)}">${esc(x.nome)} (${esc(x.especie)})</option>`).join('')}<option value="__outro">Outra testemunha…</option></select></div>
          <div class="campo" id="i-outro-c" hidden><label class="rotulo" for="i-outro">Nome da testemunha</label><input type="text" id="i-outro" maxlength="60"></div>
          ${[1, 2, 3].map(i => `<div class="campo"><label class="rotulo" for="i-p${i}">Pergunta ${i}</label><input type="text" id="i-p${i}" maxlength="200"></div>`).join('')}
          <button class="btn" id="i-ok">Fazer as perguntas</button>` : '<p class="tag">Interrogatório só acontece numa mesa.</p>';
        const sel = m.querySelector('#i-npc'); if (sel) sel.onchange = () => { m.querySelector('#i-outro-c').hidden = sel.value !== '__outro'; };
        const alvoSala = opt.interrogar || CASO?.sala?.npc;
        if (sel && alvoSala) { if ([...sel.options].some(o => o.value === alvoSala)) sel.value = alvoSala; else { sel.value = '__outro'; m.querySelector('#i-outro').value = alvoSala; m.querySelector('#i-outro-c').hidden = false; } }
        m.querySelector('#i-ok')?.addEventListener('click', async () => {
          const npc = sel.value === '__outro' ? m.querySelector('#i-outro').value.trim() : sel.value;
          const perguntas = [1, 2, 3].map(i => m.querySelector('#i-p' + i).value.trim());
          if (!npc || perguntas.some(x => !x)) { toast('Faça as três perguntas, detetive.'); return; }
          const b = m.querySelector('#i-ok'); b.disabled = true;
          try {
            const iid = 'i' + Date.now().toString(36) + uid8();
            await db.doc(`bichos-casos/${CASO.id}/rolagens/${iid}`).set({ id: iid, uid: ME, ficha: F.id, fnome: F.nome, especie: F.especie, t: Date.now(), aplicado: true, tipo: 'interrogatorio', texto: `Interrogou ${npc}`, npc, perguntas, respostas: null, revelado: null, lido: false });
            toast('Perguntas feitas. Agora é com o Mestre.'); fechar();
          } catch (er) { toast('Não deu: ' + er.message); b.disabled = false; }
        });
        return;
      }
      if (A.semRolar) {
        corpo.innerHTML = acao === 'respirar' ? `<p>Você recebe 1 dado na Pilha de Compostura (máximo 6).</p><button class="btn" id="r-ir">Respirar fundo</button>`
          : `<p>Escolha quem completa a Pilha de Dedução na hora. Você descarta ${e.id === 'texugo' ? 'todos os seus dados menos um (Deixa Comigo)' : 'todos os seus dados'}. Uma vez por sessão.</p>
            <div class="campo"><label class="rotulo" for="r-alvo">Quem</label><select id="r-alvo"><option value="${F.id}">${esc(F.nome)} (você)</option>${aliados.map(a => `<option value="${a.id}">${esc(a.nome)}</option>`).join('')}</select></div><button class="btn perigo" id="r-ir">Se jogar na frente</button>`;
      } else {
        const max = acao === 'espanto' ? 1 : F.pilha;
        const pt = acao === 'vasculhar' ? pontosLivres[0] : null;
        const est = A.estilo || pt?.estilo || (acao === 'interrogar' ? 'sagaz' : '');
        const cxPonto = !!pt?.complexo;
        corpo.innerHTML = `
          <div class="campo"><span class="rotulo">Quantos dados arriscar (você tem ${F.pilha})</span><div class="btns" id="r-n">${Array.from({ length: max }, (_, i) => `<button class="btn sec mini" data-n="${i + 1}">${i + 1}</button>`).join('') || '<span class="tag">Sem dados na Pilha de Compostura.</span>'}</div></div>
          ${acao === 'espanto' ? '' : `<div class="campo"><label class="rotulo" for="r-est">Estilo</label><select id="r-est" ${A.estilo ? 'disabled' : ''}><option value="">Nenhum dos seus (sucesso em 4+)</option>${Object.entries(B.ESTILOS).map(([k, x]) => `<option value="${k}" ${k === est ? 'selected' : ''}>${x.nome}${e.estilos.includes(k) ? (F.desmoralizados || []).includes(k) ? ' · desmoralizado' : ' · seu (3+)' : ''}</option>`).join('')}</select></div>
          <label class="chk"><input type="checkbox" id="r-cx" ${A.complexo || F.enrolado || cxPonto ? 'checked' : ''} ${A.complexo || F.enrolado || acao === 'vasculhar' ? 'disabled' : ''}> Teste Complexo (2 sucessos)${F.enrolado ? ' · você está Enrolado' : ''}</label>`}
          ${acao === 'vasculhar' ? (pontosLivres.length ? `<div class="campo"><label class="rotulo" for="r-ponto">Ponto de Interesse</label><select id="r-ponto">${pontosLivres.map(p => `<option value="${p.id}">${esc(p.nome)} · ${B.ESTILOS[p.estilo]?.nome || 'Livre'}${p.complexo ? ' · Complexo' : ''}</option>`).join('')}</select></div>` : '<p class="tag">Nenhum ponto sobrando neste local.</p>') : ''}
          ${acao === 'interrogar' && LER ? `<p class="tag">Lendo o interrogatório de ${esc(opt.npc || '?')}. Escolha Sagaz, Desenrolado ou Potente. 1 sucesso revela a mentira, 2 revelam também a verdade.</p>` : ''}
          ${acao === 'ligar' ? ((CASO?.pistas || []).length > 1 ? `<div class="campo"><label class="rotulo" for="r-p1">Pista 1</label><select id="r-p1">${CASO.pistas.map(p => `<option value="${p.id}">${esc(p.txt.slice(0, 80))}</option>`).join('')}</select></div><div class="campo"><label class="rotulo" for="r-p2">Pista 2</label><select id="r-p2">${CASO.pistas.map((p, i) => `<option value="${p.id}" ${i === 1 ? 'selected' : ''}>${esc(p.txt.slice(0, 80))}</option>`).join('')}</select></div>` : '<p class="tag">Precisa de pelo menos duas pistas no Mural.</p>') : ''}
          ${acao === 'tempo' && INV?.tempoUsado ? '<p class="tag">Alguém já Ganhou Tempo nesta cena.</p>' : ''}
          ${acao === 'cobertura' ? `<div class="campo"><label class="rotulo" for="r-alvo">Cobrir quem</label><select id="r-alvo">${aliados.map(a => `<option value="${a.id}">${esc(a.nome)}</option>`).join('')}</select></div>` : ''}
          ${acao === 'teste' && e.id === 'ornitorrinco' && fase !== 'acareacao' ? '<label class="chk"><input type="checkbox" id="r-disf"> Agindo disfarçado (Fachada de Bicho Bobo, 1 vez por sessão, só teste Ligeiro)</label>' : ''}
          ${acao === 'teste' ? '<div class="campo"><label class="rotulo" for="r-txt">O que você está tentando</label><input type="text" id="r-txt" maxlength="120" placeholder="Ex.: Revistar o galinheiro"></div>' : ''}
          <div id="r-res"></div>`;
        m.querySelectorAll('[data-n]').forEach(b => b.onclick = () => rolar(+b.dataset.n));
        m.querySelector('#r-ponto')?.addEventListener('change', ev => { const q = pontosLivres.find(x => x.id === ev.target.value); if (!q) return; const se = m.querySelector('#r-est'); if (se && q.estilo) se.value = q.estilo; m.querySelector('#r-cx').checked = !!q.complexo || !!F.enrolado; });
      }
      m.querySelector('#r-ir')?.addEventListener('click', () => semRolar());
    };
    m.querySelector('#r-acoes').onclick = ev => { const b = ev.target.closest('[data-a]'); if (b) { acao = b.dataset.a; pinta(); } };
    pinta();

    const postar = async (rol) => {
      if (!CASO) return;
      await db.collection(`bichos-casos/${CASO.id}/rolagens`).add({ uid: ME, ficha: F.id, fnome: F.nome, especie: F.especie, t: Date.now(), aplicado: !(rol.efeitos || []).length, ...rol });
    };
    async function semRolar() {
      const b = m.querySelector('#r-ir'); b.disabled = true;
      try {
        if (acao === 'respirar') {
          const nv = clamp(F.pilha + 1, 0, 6);
          await db.doc('bichos-detetives/' + F.id).update({ pilha: nv }); F.pilha = nv;
          await postar({ tipo: 'respirar', texto: 'Respirou fundo (+1 dado)', efeitos: [] });
          toast('Ufa. +1 dado.'); fechar();
        } else {
          const alvo = m.querySelector('#r-alvo').value;
          const fica = e.id === 'texugo' && F.pilha > 0 ? 1 : 0;
          const desc = F.pilha - fica;
          await db.doc('bichos-detetives/' + F.id).update({ pilha: fica });
          const ef = [{ t: 'palheiro', n: desc }];
          if (alvo === F.id) await db.doc('bichos-detetives/' + F.id).update({ deducaoCompleta: true });
          else ef.push({ t: 'completa', ficha: alvo });
          const nomeAlvo = alvo === F.id ? F.nome : aliados.find(a => a.id === alvo)?.nome;
          await postar({ tipo: 'jogar', texto: `Se jogou na frente: ${nomeAlvo} completa a Pilha de Dedução (${desc} dado(s) para o Palheiro)`, efeitos: ef });
          toast('Que coragem. Ou burrice.'); fechar();
        }
      } catch (er) { toast('Não deu: ' + er.message); b.disabled = false; }
    }
    async function rolar(n) {
      m.querySelectorAll('[data-n]').forEach(b => b.disabled = true);
      const A = ACOES_ROL.find(a => a.id === acao);
      const est = acao === 'espanto' ? '' : (A.estilo || m.querySelector('#r-est')?.value || '');
      const seuEst = est && e.estilos.includes(est) && !(F.desmoralizados || []).includes(est);
      const dt = seuEst ? 3 : 4;
      if (acao === 'vasculhar' && !m.querySelector('#r-ponto')) { toast('Não tem ponto para vasculhar.'); m.querySelectorAll('[data-n]').forEach(b => b.disabled = false); return; }
      if (acao === 'ligar' && (!m.querySelector('#r-p1') || m.querySelector('#r-p1').value === m.querySelector('#r-p2').value)) { toast('Escolha duas pistas diferentes.'); m.querySelectorAll('[data-n]').forEach(b => b.disabled = false); return; }
      const complexo = acao !== 'espanto' && (!!m.querySelector('#r-cx')?.checked);
      const vals = Array.from({ length: n }, d6);
      const suc = vals.filter(v => v >= dt).length, seis = vals.filter(v => v === 6).length;
      const ok = suc >= (complexo ? 2 : 1);
      const falhas = n - suc;
      const disfarce = !!m.querySelector('#r-disf')?.checked && est === 'ligeiro';
      const descarta = acao === 'espanto' || fase === 'acareacao' || (disfarce && ok);
      const efeitos = []; const p = {};
      let pilha = F.pilha, ded = F.deducao || 0, texto = '';
      if (acao !== 'cobertura') pilha -= falhas;
      if (falhas && acao !== 'cobertura') efeitos.push({ t: descarta ? 'palheiro' : 'culpado', n: falhas });
      if (F.aliciado && falhas) p.aliciado = clamp(F.aliciado + falhas, 0, 6);
      if (acao === 'rastro' && F.agarrado) texto = 'Tentou seguir o rastro, mas está Agarrado: nada vai para a Dedução';
      else if (acao === 'rastro') {
        pilha -= suc; ded += suc;
        for (let i = 0; i < seis; i++) { if (pilha > 0) { pilha--; ded++; } else { ded++; efeitos.push({ t: 'palheiro', n: -1 }); } }
        texto = `Seguiu o rastro: +${ded - (F.deducao || 0)} na Dedução`;
      } else if (acao === 'apertar') {
        texto = ok ? 'Apertou o Culpado: Ele descarta 1 dado' : 'Tentou apertar o Culpado e nada';
        if (ok) efeitos.push({ t: 'culpado', n: -1 }, { t: 'palheiro', n: 1 });
      } else if (acao === 'cena') texto = ok ? 'Fez uma cena: Tirar do Caso custa 1 dado e 3 PL a mais para o Culpado' : 'Fez uma cena e ninguém ligou';
      else if (acao === 'cobertura') {
        const alvo = m.querySelector('#r-alvo')?.value; const nomeAlvo = aliados.find(a => a.id === alvo)?.nome || '?';
        const pato = aliados.find(a => a.id === alvo)?.especie === 'pato';
        if (suc && alvo) { pilha -= suc; efeitos.push({ t: e.id === 'cavalo' ? 'deducao' : 'pilha', ficha: alvo, n: suc }); }
        texto = `Deu cobertura para ${nomeAlvo}: ${suc} dado(s)${e.id === 'cavalo' ? ' direto na Dedução (Pode tirar o cavalinho da chuva, se ainda não usou)' : ''}${pato ? ' · Pato: Se usar Carência, devolva os dados' : ''}`;
      } else if (acao === 'espanto') texto = ok ? 'Passou no Teste de Espanto' : 'Levou um baita susto';
      else if (acao === 'vasculhar') {
        const pt = pontosLivres.find(x => x.id === m.querySelector('#r-ponto').value);
        texto = ok ? `Vasculhou ${pt.nome} e achou algo!` : `Vasculhou ${pt.nome} e não achou nada`;
        if (ok) efeitos.push({ t: 'ponto', id: pt.id });
      } else if (acao === 'interrogar') {
        texto = suc >= 2 ? `Leu ${opt.npc} como um livro aberto: verdade e mentira reveladas` : suc === 1 ? `Pegou ${opt.npc} numa mentira` : `${opt.npc} enrolou direitinho`;
        efeitos.push({ t: 'ler', iid: LER, suc });
      } else if (acao === 'ligar') {
        const nomeP = id => (CASO.pistas.find(x => x.id === id)?.txt || '?').slice(0, 60);
        texto = `Ligou os pontos entre "${nomeP(m.querySelector('#r-p1').value)}" e "${nomeP(m.querySelector('#r-p2').value)}" · ${ok ? 'o Mestre diz se batem' : 'não chegou a lugar nenhum'}`;
      } else if (acao === 'vigia') { texto = ok ? 'Ficou de vigia: a próxima Peça desta cena não pega' : 'Ficou de vigia e cochilou'; if (ok) efeitos.push({ t: 'vigia', nome: F.nome }); }
      else if (acao === 'tempo') { texto = ok ? 'Ganhou tempo: o relógio não avança nesta rodada' : 'Tentou enrolar e ninguém caiu'; if (ok) efeitos.push({ t: 'tempo' }); }
      else texto = (m.querySelector('#r-txt')?.value.trim() || 'Teste') + (disfarce ? (ok ? ' · disfarçado: falhas foram para o Palheiro' : ' · o disfarce falhou: Culpado +1 PL') : '');
      p.pilha = clamp(pilha, 0, 6); if (acao === 'rastro' && !F.agarrado) p.deducao = ded;
      let ganhouPf = 0; if (e.id === 'raposa' && seis) { ganhouPf = seis; p.pf = clamp(F.pf + seis, 0, 10); }
      const corpoRes = m.querySelector('#r-res');
      corpoRes.innerHTML = `<div class="resultado"><div class="fila-dados">${vals.map((v, i) => dado(v, `g rola ${v >= dt ? (v === 6 ? 'ok seis' : 'ok') : 'falha'}`).replace('class="d6', `style="animation-delay:${i * 80}ms" class="d6`)).join('')}</div>
        <div class="veredito ${ok ? 'ok' : 'no'}">${ok ? 'Sucesso!' : 'Falhou!'}</div>
        <div>${suc} sucesso(s) em ${dt}+${complexo ? ' · Complexo' : ''}${falhas && acao !== 'cobertura' ? ` · ${falhas} dado(s) ${descarta ? 'descartado(s) no Palheiro' : 'sacrificado(s) para o Culpado'}` : ''}${ganhouPf ? ` · +${ganhouPf} PF (Olha Pra Mim)` : ''}</div>
        ${acao === 'espanto' && !ok && e.id === 'coruja' ? '<p class="tag">Coruja: Você pode repetir este Teste de Espanto (rola de novo antes de aceitar).</p>' : ''}
        <button class="btn sec" data-fechar2>Fechar</button></div>`;
      corpoRes.querySelector('[data-fechar2]').onclick = fechar;
      try {
        await db.doc('bichos-detetives/' + F.id).update(p); Object.assign(F, p);
        await postar({ tipo: acao, texto, dados: vals, dt, complexo, suc, ok, efeitos, estilo: est || null });
      } catch (er) { toast('A rolagem não foi salva: ' + er.message); }
    }
  });
}

ROTAS.mesas = async () => {
  if (!ME) { app.innerHTML = `<div class="cab"><h2>Mesas</h2></div>${precisaEntrar()}`; return; }
  app.innerHTML = `<div class="cab"><div><h2>Mesas</h2><p>Cada mesa é um caso aberto, com Mural, rolagens e o Escudo do Mestre.</p></div><div class="btns"><button class="btn sec" id="entrar">Entrar com código</button><button class="btn" id="criar">Abrir caso</button></div></div><div class="grade" id="lista"><div class="vazio">Folheando os arquivos…</div></div>`;
  const PART = await carregarPart();
  const mestre = (await db.collection('bichos-casos').where('mestre', '==', ME).get()).docs.map(d => ({ id: d.id, ...d.data() }));
  const outros = (await Promise.all(PART.casos.filter(c => !mestre.some(x => x.id === c)).map(c => db.doc('bichos-casos/' + c).get()))).filter(s => s.exists).map(s => ({ id: s.id, ...s.data() }));
  const todos = [...mestre, ...outros];
  $('#lista').innerHTML = todos.length ? todos.map(c => `<a class="card-det" href="#${c.mestre === ME ? 'escudo' : 'caso'}-${c.id}"><span class="ava" style="--sc:${c.mestre === ME ? 'var(--vermelho)' : 'var(--teal)'}">${c.mestre === ME ? 'M' : '🔍'}</span><div><div class="nm">${esc(c.nome)}</div><div class="sub">${c.mestre === ME ? 'Você é o Mestre' : 'Detetive'} · ${FASES[c.fase || 'livre']}</div></div></a>`).join('') : '<div class="vazio">Nenhum caso aberto. Ainda.</div>';
  $('#criar').onclick = () => abrirModal('Abrir caso', `<div class="campo"><label class="rotulo" for="c-nome">Nome do caso</label><input type="text" id="c-nome" value="O Mistério dos Ovos Desaparecidos" maxlength="80"></div>
    <div class="campo"><label class="rotulo" for="c-pr">Culpado (secreto)</label><select id="c-pr">${B.PRONTOS.map(p => `<option value="${p.id}">${esc(p.nome)} (${esc(p.especie)})</option>`).join('')}</select></div>
    <p class="tag">Os quatro prontos entram como suspeitos no Mural. Só você sabe quem é o Culpado.</p><button class="btn" id="c-ok">Abrir</button>`, (m, fechar) => {
    m.querySelector('#c-ok').onclick = async () => {
      const b = m.querySelector('#c-ok'); b.disabled = true;
      try {
        const pr = PRONTO[m.querySelector('#c-pr').value];
        const ref = await db.collection('bichos-casos').add({ mestre: ME, mestreNome: MEU_NOME, nome: m.querySelector('#c-nome').value.trim() || 'Caso sem nome', fase: 'livre', culpado: pr.dados, palheiro: 0, pistas: [], criado: Date.now(),
          suspeitos: B.PRONTOS.map(p => ({ id: p.id, nome: p.nome, especie: p.especie, txt: p.txt, inocente: false })) });
        await db.doc(`mestre/${ME}/bichos/${ref.id}`).set(escudoDe(pr));
        fechar(); location.hash = 'escudo-' + ref.id;
      } catch (e) { toast('Não deu: ' + e.message); b.disabled = false; }
    };
  });
  $('#entrar').onclick = () => abrirModal('Entrar com código', `<div class="campo"><label class="rotulo" for="cod">Código do caso</label><input type="text" id="cod" placeholder="Cole o código que o Mestre mandou"></div><button class="btn" id="cod-ok">Entrar</button>`, (m, fechar) => {
    m.querySelector('#cod-ok').onclick = async () => {
      const id = m.querySelector('#cod').value.trim().replace(/^.*[#-]/, '');
      if (!/^[A-Za-z0-9]{6,40}$/.test(id)) { toast('Código estranho, confere aí.'); return; }
      const s = await db.doc('bichos-casos/' + id).get().catch(() => null);
      if (!s?.exists) { toast('Nenhum caso com esse código.'); return; }
      await entrarCaso(id); fechar(); location.hash = 'caso-' + id;
    };
  });
};
/* ficha secreta de suspeito: fica no escudo do mestre (mestre/<uid>/bichos/<caso>.suspeitos) */
const FICHA_VAZIA = { especie: '', frase: '', txt: '', segredo: '', foto: '', perfis: ['trambiqueiro', 'mandante'], dados: 4, pl: 2, pecas: 2, acoes: [], golpe: 'planob', alvo: 4, habs: [] };
function fichaSusp(E, C, id) {
  if (E?.suspeitos?.[id]) return { ...FICHA_VAZIA, ...E.suspeitos[id], id };
  const pr = PRONTO[id], pub = (C?.suspeitos || []).find(x => x.id === id) || {};
  if (pr) return { ...FICHA_VAZIA, ...JSON.parse(JSON.stringify(pr)), foto: pub.foto || '', segredo: '', id };

/* estado da mesa que os jogadores mexem: bichos-casos/<id>/quadro/estado

const caminhoQ = id => `bichos-casos/${id}/quadro/estado`;

const todasPistas = C => (C.pistas || []);

const papelPista = p => `<div class="pista ${p.falsa ? 'falsa' : ''}">${nl(p.txt)}</div>`;

/* quadro de cortiça: suspeitos, pistas e anotações, ligados por barbante */
function montarQuadro(el, id, getC, getQ) {
  let ligando = false, sel = null, arr = null, zTop = 10; const Z = {};
  const itens = () => {
    const C = getC(), Q = getQ() || {}, out = [];
    const sus = C.suspeitos || [], pis = todasPistas(C), notas = Object.entries(Q.notas || {}).filter(([, v]) => v);
    const linhasS = Math.ceil(sus.length / 8);
    sus.forEach((x, i) => out.push({ k: 's:' + x.id, tipo: 's', x, def: { x: 7 + (i % 8) * 12.2, y: 18 + Math.floor(i / 8) * 26 } }));
    pis.forEach((x, i) => out.push({ k: 'p:' + x.id, tipo: 'p', x, def: { x: 9 + (i % 6) * 15.5, y: Math.min(90, 22 + linhasS * 26 + Math.floor(i / 6) * 20) } }));
    notas.forEach(([nid, v], i) => out.push({ k: 'n:' + nid, tipo: 'n', x: { id: nid, ...v }, def: { x: 88, y: 40 + i * 14 } }));
    return out.map(it => ({ ...it, pos: Q.pos?.[it.k] || it.def, r: ((it.k.split('').reduce((a, c) => a + c.charCodeAt(0), 0) % 9) - 4) }));
  };
  const desenhar = () => {
    if (arr) return;
    const C = getC(), Q = getQ() || {}, its = itens(), at = Object.fromEntries(its.map(i => [i.k, i]));
    const fios = Object.entries(Q.fios || {}).filter(([k, v]) => v && k.split('|').every(x => at[x]));
    el.classList.toggle('ligando', ligando);
    el.innerHTML = `<svg class="fios">${fios.map(([k]) => { const [ka, kb] = k.split('|'), a = at[ka].pos, b = at[kb].pos, d = `data-a="${esc(ka)}" data-b="${esc(kb)}" x1="${a.x}%" y1="${a.y}%" x2="${b.x}%" y2="${b.y}%"`; return `<line class="hit" data-fio="${esc(k)}" ${d}></line><line ${d}></line>`; }).join('')}</svg>
      ${its.map(it => {
        const st = `left:${it.pos.x}%;top:${it.pos.y}%;--r:${it.r}deg${Z[it.k] ? ';z-index:' + Z[it.k] : ''}`, c = `q-item ${sel === it.k ? 'sel' : ''}`;
        if (it.tipo === 's') return `<div class="${c} q-pol ${inocentado(it.x, Q) ? 'inoc' : ''}" data-k="${it.k}" style="${st}" title="${esc(it.x.txt)}"><div class="ft" style="${it.x.foto ? `background-image:url('${esc(it.x.foto)}')` : ''}">${it.x.foto ? '' : esc(iniciais(it.x.nome))}</div><b>${esc(it.x.nome)}</b><span>${esc(it.x.especie)}</span></div>`;
        if (it.tipo === 'p') return `<div class="${c} q-pap ${it.x.falsa ? 'falsa' : ''}" data-k="${it.k}" style="${st}" title="${esc(it.x.txt)}"><span class="dia-t">${it.x.dia ? 'Dia ' + it.x.dia : 'Hoje'}</span>${esc(it.x.txt.length > 150 ? it.x.txt.slice(0, 147) + '…' : it.x.txt)}</div>`;
        return `<div class="${c} q-nota" data-k="${it.k}" style="${st}" title="Toque para ler ou editar">${esc(it.x.txt)}</div>`;
      }).join('')}`;
  };
  // arrastar
  el.addEventListener('pointerdown', e => {
    const it = e.target.closest('.q-item'); if (!it || e.button > 0) return;
    if (ligando) return;
    e.preventDefault(); const r = el.getBoundingClientRect();
    arr = { el: it, k: it.dataset.k, r, moveu: false, dx: e.clientX, dy: e.clientY };
    document.body.classList.add('arrastando-q'); Z[it.dataset.k] = ++zTop; it.style.zIndex = zTop; it.setPointerCapture(e.pointerId); it.classList.add('arrastando');
  });
  el.addEventListener('pointermove', e => {
    if (!arr) return;
    if (Math.abs(e.clientX - arr.dx) + Math.abs(e.clientY - arr.dy) > 3) arr.moveu = true;
    const x = clamp((e.clientX - arr.r.left) / arr.r.width * 100, 3, 97), y = clamp((e.clientY - arr.r.top) / arr.r.height * 100, 5, 95);
    arr.el.style.left = x + '%'; arr.el.style.top = y + '%'; arr.x = x; arr.y = y;
    // barbantes acompanham
    el.querySelectorAll('line').forEach(l => { if (l.dataset.a === arr.k) { l.setAttribute('x1', x + '%'); l.setAttribute('y1', y + '%'); } if (l.dataset.b === arr.k) { l.setAttribute('x2', x + '%'); l.setAttribute('y2', y + '%'); } });
  });
  const soltar = async () => {
    if (!arr) return; const a = arr; arr = null; a.el.classList.remove('arrastando'); document.body.classList.remove('arrastando-q');
    if (a.moveu && a.x != null) { const Q = getQ() || {}; Q.pos = { ...(Q.pos || {}), [a.k]: { x: +a.x.toFixed(2), y: +a.y.toFixed(2) } }; desenhar(); await salvarQ(id, { pos: { [a.k]: Q.pos[a.k] } }); }
    else { desenhar(); abrirItem(a.k); }
  };
  const rotulo = k => { const C = getC(), Q = getQ() || {}, t = k[0], i = k.slice(2); if (t === 's') return '🖼️ ' + ((C.suspeitos || []).find(x => x.id === i)?.nome || '?'); if (t === 'p') { const x = todasPistas(C).find(y => y.id === i)?.txt || '?'; return '📄 ' + (x.length > 50 ? x.slice(0, 48) + '…' : x); } const n = Q.notas?.[i]?.txt || '?'; return '📝 ' + (n.length > 50 ? n.slice(0, 48) + '…' : n); };
  const fiosDe = k => Object.entries((getQ() || {}).fios || {}).filter(([f, v]) => v && f.split('|').includes(k)).map(([f]) => f);
  const cortar = async lista => { const Q = getQ() || {}, p = Object.fromEntries(lista.map(f => [f, null])); Q.fios = { ...(Q.fios || {}), ...p }; desenhar(); await salvarQ(id, { fios: p }); };
  const blocoFios = k => { const l = fiosDe(k); return `<div class="fios-lista"><span class="rotulo">🧶 Barbantes (${l.length})</span>${l.map(f => `<div class="linha"><span>${esc(rotulo(f.split('|').find(x => x !== k)))}</span><button class="btn mini perigo" data-cortar="${esc(f)}">✂️ Cortar</button></div>`).join('') || '<span class="tag">Nada ligado aqui. Use "Ligar com barbante".</span>'}${l.length > 1 ? '<button class="btn mini perigo" data-cortar-todos style="justify-self:start">✂️ Cortar todos</button>' : ''}</div>`; };
  const ligarCortes = (m, k, reabrir) => {
    m.querySelectorAll('[data-cortar]').forEach(b => b.onclick = async () => { await cortar([b.dataset.cortar]); reabrir(); });
    m.querySelector('[data-cortar-todos]')?.addEventListener('click', async () => { if (!confirm('Cortar todos os barbantes deste item?')) return; await cortar(fiosDe(k)); reabrir(); });
  };
  const abrirItem = k => {
    const C = getC(), Q = getQ() || {}, [t, iid] = [k.slice(0, 1), k.slice(2)];
    const reabrir = () => abrirItem(k);
    if (t === 's') { const x = (C.suspeitos || []).find(y => y.id === iid); if (!x) return; abrirModal(x.nome, `<div class="btns" style="align-items:center"><span class="foto-s g" style="${x.foto ? `background-image:url('${esc(x.foto)}')` : ''}">${x.foto ? '' : esc(iniciais(x.nome))}</span><div><span class="tag">${esc(x.especie)}</span>${inocentado(x, Q) ? ' <span class="tag" style="color:var(--teal)">Inocentado</span>' : ''}</div></div><p>${nl(x.txt)}</p>${blocoFios(k)}`, m => ligarCortes(m, k, reabrir)); return; }
    if (t === 'p') { const x = todasPistas(C).find(y => y.id === iid); if (!x) return; abrirModal(x.dia ? `Pista do Dia ${x.dia}` : 'Pista de hoje', `<div class="pista ${x.falsa ? 'falsa' : ''}" style="font-size:16px">${nl(x.txt)}</div>${blocoFios(k)}`, m => ligarCortes(m, k, reabrir)); return; }
    const atual = Q.notas?.[iid]?.txt || '';
    abrirModal('Anotação', `<textarea id="nt-t" style="min-height:120px">${esc(atual)}</textarea><div class="btns"><button class="btn" id="nt-ok">Salvar</button><button class="btn perigo" id="nt-del">Arrancar do quadro</button></div>${blocoFios(k)}`, (m, fechar) => {
      ligarCortes(m, k, reabrir);
      const gravar = async v => { const Q2 = getQ() || {}; Q2.notas = { ...(Q2.notas || {}), [iid]: v }; fechar(); desenhar(); await salvarQ(id, { notas: { [iid]: v } }); };
      m.querySelector('#nt-ok').onclick = () => { const v = m.querySelector('#nt-t').value.trim(); gravar(v ? { txt: v } : null); };
      m.querySelector('#nt-del').onclick = async () => { const l = fiosDe(k); if (l.length) await cortar(l); gravar(null); };
    });
  };
  el.addEventListener('pointerup', soltar); el.addEventListener('pointercancel', soltar);
  // ligar com barbante / cortar barbante
  el.addEventListener('click', async e => {
    const fio = e.target.closest('[data-fio]');
    if (fio) { if (!confirm('Cortar este barbante?')) return; const Q = getQ() || {}; Q.fios = { ...(Q.fios || {}), [fio.dataset.fio]: null }; desenhar(); await salvarQ(id, { fios: { [fio.dataset.fio]: null } }); return; }
    if (!ligando) return;
    const it = e.target.closest('.q-item'); if (!it) return;
    if (!sel) { sel = it.dataset.k; desenhar(); return; }
    if (sel === it.dataset.k) { sel = null; desenhar(); return; }
    const k = [sel, it.dataset.k].sort().join('|'); sel = null;
    const Q = getQ() || {}; Q.fios = { ...(Q.fios || {}), [k]: true }; desenhar(); await salvarQ(id, { fios: { [k]: true } });
  });
  return {
    desenhar,
    ligar(v) { ligando = v; sel = null; desenhar(); },
    async nota() { const txt = prompt('O que escrever no papelzinho?'); if (!txt?.trim()) return; const nid = uid8(), Q = getQ() || {}; Q.notas = { ...(Q.notas || {}), [nid]: { txt: txt.trim() } }; desenhar(); await salvarQ(id, { notas: { [nid]: { txt: txt.trim() } } }); },
  };
}

async function detetivesDoCaso(id) {

        const caber = () => { const cheio = document.fullscreenElement === wrap || wrap.classList.contains('tela-cheia'); const w = wrap.clientWidth - 6, h = (cheio ? wrap.clientHeight - 60 : Infinity) - 6; return Math.max(.2, Math.min(w / 1600, h / 1000, 1.4)); };
        const aplicar = z => { zoom = Math.max(.2, Math.min(2, z)); qd.style.transform = `scale(${zoom})`; palco.style.width = 1600 * zoom + 'px'; palco.style.height = 1000 * zoom + 'px'; $('#q-zv').textContent = Math.round(zoom * 100) + '%'; };

        const reajustar = () => { if (!manual && $('#q-wrap')) aplicar(inicial()); };
        addEventListener('resize', reajustar); document.addEventListener('fullscreenchange', () => { manual = false; setTimeout(reajustar, 50); });

  assinar(ref.onSnapshot(s => { if (s.exists) { C = s.data(); desenhar(); } }));

/* ---------- histórico de rolagens (todos da mesa veem) ---------- */
const TIPOS_HIST = { todos: 'Tudo', dados: 'Só rolagens de dados', teste: 'Testes', interrogatorio: 'Interrogatórios', vasculhar: 'Vasculhar', espanto: 'Testes de Espanto', rastro: 'Seguir o Rastro', apertar: 'Apertar', cena: 'Fazer Cena', cobertura: 'Dar Cobertura', culpado: 'Ações do Culpado', sistema: 'Avisos do Mestre' };
ROTAS.historico = async id => {
  if (!ME) { app.innerHTML = precisaEntrar(); return; }
  const s0 = await db.doc('bichos-casos/' + id).get();

  const C = s0.data(), mestre = C.mestre === ME;

  app.innerHTML = `<div class="cab"><div><span class="fita">Histórico</span><h2 style="margin-top:8px">${esc(C.nome)}</h2><p>Todas as rolagens e ações da mesa, da mais nova para a mais antiga.</p></div>
    <div class="btns"><a class="btn sec" href="#${mestre ? 'escudo' : 'caso'}-${id}">Voltar para a mesa</a></div></div>
    <div class="caixa hist-filtros"><div class="campo"><label class="rotulo" for="h-det">Detetive</label><select id="h-det"></select></div>
      <div class="campo"><label class="rotulo" for="h-tipo">Tipo</label><select id="h-tipo">${Object.entries(TIPOS_HIST).map(([k, n]) => `<option value="${k}">${n}</option>`).join('')}</select></div></div>
    <div class="hist-resumo" id="h-resumo"></div><div class="feed cheio" id="h-feed"><div class="vazio">Desenterrando os registros…</div></div>`;
  const desenhar = () => {
    const nomes = {}; ROLS.forEach(r => { if (r.ficha && !nomes[r.ficha]) nomes[r.ficha] = { nome: r.fnome, especie: r.especie }; });
    const selD = $('#h-det'); const atual = fDet;
    selD.innerHTML = `<option value="todos">Todos</option>${Object.entries(nomes).map(([k, v]) => `<option value="${k}" ${k === atual ? 'selected' : ''}>${esc(v.nome)}</option>`).join('')}<option value="culpado" ${atual === 'culpado' ? 'selected' : ''}>O Culpado e o Mestre</option>`;

    }).join('');
    const lista = ROLS.filter(r => (fDet === 'todos' || (fDet === 'culpado' ? !r.ficha : r.ficha === fDet))
      && (fTipo === 'todos' || (fTipo === 'dados' ? !!r.dados : r.tipo === fTipo)));

/* ---------- escudo do mestre ---------- */
let ABA_ESCUDO = 'culpado', SUSP_SEL = null, RASC = null;
ROTAS.escudo = async id => {
  if (!ME) { app.innerHTML = precisaEntrar(); return; }
  const ref = db.doc('bichos-casos/' + id), eRef = db.doc(`mestre/${ME}/bichos/${id}`);
  const s0 = await ref.get();
  if (!s0.exists) { app.innerHTML = '<div class="vazio">Esse caso foi arquivado.</div>'; return; }
  if (s0.data().mestre !== ME) { location.hash = 'caso-' + id; return; }
  let C = s0.data(), E = (await eRef.get()).data() || escudoDe(B.PRONTOS[0]), DETS = [], ROLS = [], QE = {};
  const aplicando = new Set();
  // gravações no caso passam numa fila: update é ler-mesclar-gravar, e duas ao mesmo tempo se atropelam
  let fila = Promise.resolve();
  const emFila = fn => (fila = fila.then(fn, fn));

  app.innerHTML = `<div class="cab"><div><span class="fita" style="background:repeating-linear-gradient(-45deg,var(--vermelho) 0 14px,#b23a31 14px 28px);color:#fff">Escudo do Mestre</span><h2 id="c-nome" style="margin-top:8px"></h2>
    <p>Código para os jogadores: <span class="codigo">${id}</span></p></div><div class="btns"><a class="btn sec" href="#caso-${id}">Ver como jogador</a></div></div>
    <div id="c-placar"></div>
    <div class="mesa"><div class="bloco"><div class="abas" id="abas">${[['culpado', 'Culpado'], ['suspeitos', 'Suspeitos'], ['mesa', 'Mesa'], ['investigacao', 'Investigação'], ['interrog', 'Interrogatórios'], ['pistas', 'Pistas e solução'], ['mural', 'Mural']].map(([k, n]) => `<button data-aba="${k}">${n}</button>`).join('')}</div><div id="aba" class="bloco"></div></div>
    <div class="bloco"><div class="btns" style="justify-content:space-between;align-items:center"><h3>Rolagens</h3><a class="btn mini sec" href="#historico-${id}">Histórico completo</a></div><div class="feed" id="c-feed"></div></div></div>`;

  const salvarE = async p => { E = { ...E, ...p }; try { await eRef.set(E); } catch (e) { toast('Escudo não salvou: ' + e.message); } };
  const salvarC = async p => { C = { ...C, ...p }; try { await emFila(() => ref.update(p)); } catch (e) { toast('Não salvou: ' + e.message); } };
  const postarC = (texto, tipo = 'culpado') => db.collection(`bichos-casos/${id}/rolagens`).add({ uid: ME, tipo, texto, t: Date.now(), aplicado: true }).catch(e => toast('Feed: ' + e.message));
  const gastarPL = async (n, oque) => { if (n && E.pl < n) { toast(`Faltam PL: ${oque} custa ${n}.`); return false; } if (n) await salvarE({ pl: E.pl - n }); return true; };
  const fichaRef = fid => db.doc('bichos-detetives/' + fid);
  const mantem = ['solucao', 'pistasOcultas', 'notas', 'inv', 'interrog', 'suspeitos', 'reveladas'];
  async function tornarCulpado(fc) {
    const base = escudoDe(fc), keep = Object.fromEntries(mantem.filter(k => E[k] !== undefined).map(k => [k, E[k]]));
    await salvarE({ ...base, ...keep, solucao: { ...(E.solucao || {}), quem: fc.nome } });
    await salvarC({ culpado: fc.dados });
  }
  const escolherAlvo = (titulo, cb) => escolherDetetive(titulo, DETS.filter(f => !f.fora), cb);

  async function darGalo(f, { atropelar = false } = {}) {
    if ((C.culpado || 0) < 1) { toast('O Culpado está sem dados.'); return; }
    const v = d6();
    await salvarC({ culpado: C.culpado - 1, palheiro: (C.palheiro || 0) + 1 });
    const s = await fichaRef(f.id).get(); const x = s.data();
    if (v === 6 && !atropelar) {
      await fichaRef(f.id).update({ fora: true });
      await postarC(`Deu um Galo em ${f.nome} e tirou 6: ${f.nome} está FORA DO CASO`);
      abrirModal('Tirou 6!', `<div class="resultado">${dado(6, 'g ok seis rola')}<p><b>${esc(f.nome)}</b> está fora do caso.</p>${E.pl >= 4 ? `<button class="btn" id="atp">Atropelar (4 PL): Deixar no caso com +3 Tiques</button>` : ''}</div>`, (m, fechar) => {
        m.querySelector('#atp')?.addEventListener('click', async () => {
          if (!(await gastarPL(4, 'Atropelar'))) return;
          const t = (x.tiques || 0) + 3;
          await fichaRef(f.id).update({ fora: false, tiques: t, galo: Math.max(x.galo || 0, t) });
          await postarC(`Atropelou ${f.nome}: continua no caso, todo estropiado (+3 Tiques)`); fechar();
        });
      });
      return;
    }
    const tiques = (x.tiques || 0) + 1;
    const galo = Math.max((x.galo || 0) + v, tiques);
    await fichaRef(f.id).update({ galo, tiques });
    await postarC(`Deu um Galo em ${f.nome}: dado ${v}, Galo agora ${galo}, Tique ${tiques}`);
    toast(`Galo ${v} em ${f.nome}.`);
  }

  async function usarAcao(aid) {
    const a = ACAO[aid];
    if (aid === 'galo') return escolherAlvo('Dar um Galo em quem?', f => darGalo(f));
    if (aid === 'atropelar') { toast('Atropelar aparece quando Dar um Galo tira 6.'); return; }
    if (aid === 'sumir') return encerrarAcareacao(true);
    if (aid === 'peca') {
      if (C.fase === 'acareacao' && E.pecasUsadas >= E.pecas) { toast(`Já usou as ${E.pecas} Peças desta Acareação.`); return; }
      await salvarE({ pecasUsadas: (E.pecasUsadas || 0) + (C.fase === 'acareacao' ? 1 : 0) });
      if (C.fase === 'investigacao' && C.inv?.vigia) { const vig = C.inv.vigia; await salvarC({ inv: { ...C.inv, vigia: '' } }); await postarC(`Tentou pregar uma Peça, mas ${vig} estava de vigia: não pegou`); return; }
      await postarC('Pregou uma Peça: TODOS fazem Teste de Espanto!'); await salvarC({ aviso: 'Teste de Espanto para todos!' }); return;
    }
    if (aid === 'plantar') { ABA_ESCUDO = 'investigacao'; toast('Crie o ponto na aba Investigação marcando "Pista falsa" (custa 2 PL).'); return; }
    if (aid === 'rastros') { await salvarE({ alvo: (E.alvo || 4) + 1 }); await postarC('Apagou rastros: a dedução ficou mais difícil'); return; }
    if (aid === 'tirar') return escolherAlvo('Tirar quem do caso?', async f => {
      if (C.fase === 'acareacao' && f.pilha >= (C.culpado || 0)) { toast(`${f.nome} tem ${f.pilha} dados: Precisa ter menos que a sua Pilha (${C.culpado}).`); return; }
      await fichaRef(f.id).update({ fora: true }); await postarC(`Tirou ${f.nome} do caso`);
    });
    if (aid === 'zombar') { await salvarE({ pl: E.pl + 1 }); await postarC('Zombou de um 6 dos detetives (+1 PL)'); return; }
    if (!(await gastarPL(a.custo || 0, a.nome))) return;
    if (aid === 'enrolar') return escolherAlvo('Enrolar quem?', async f => { await fichaRef(f.id).update({ enrolado: 3 }); await postarC(`Enrolou ${f.nome} (Enrolado 3: Todos os testes viram Complexos)`); });
    if (aid === 'aliciar') return escolherAlvo('Aliciar quem?', async f => { await fichaRef(f.id).update({ aliciado: 1 }); await postarC(`Algo mudou em ${f.nome}…`); });
    if (aid === 'agarrar') return escolherAlvo('Agarrar quem?', async f => { await fichaRef(f.id).update({ agarrado: true }); await postarC(`Agarrou ${f.nome}: sem Dedução e o Galo sobe a cada turno`); });
    if (aid === 'desmoralizar') return escolherAlvo('Desmoralizar quem?', f => {
      const e = ESP[f.especie];
      abrirModal('Qual Estilo?', `<div class="btns">${e.estilos.map(k => `<button class="btn sec" data-k="${k}">${B.ESTILOS[k].nome}</button>`).join('')}</div>`, (m, fechar) => {
        m.onclick = async ev => { const b = ev.target.closest('[data-k]'); if (!b) return; fechar(); await fichaRef(f.id).update({ desmoralizados: [...new Set([...(f.desmoralizados || []), b.dataset.k])] }); await postarC(`Desmoralizou ${f.nome}: ${B.ESTILOS[b.dataset.k].nome} fora de combate`); };
      });
    });
    if (aid === 'casca') return escolherAlvo('Casca de Banana em quem (falhou no Espanto)?', f => darGalo(f));
    await postarC(`Usou ${a.nome}`);
  }

  async function encerrarAcareacao(sumiu) {
    for (const f of DETS) {
      const s = await fichaRef(f.id).get(); const x = s.data();
      await fichaRef(f.id).update({ pilha: clamp((x.pilha || 0) + (x.deducao || 0), 0, 6), deducao: 0, deducaoCompleta: false, agarrado: false });
    }
    await salvarC({ fase: 'livre', culpado: (C.culpado || 0) + (sumiu ? 1 : 0), aviso: '' });
    await salvarE({ pecasUsadas: 0 });
    await postarC(sumiu ? 'Sumiu no Mato! A Acareação acabou (+1 dado para o Culpado)' : 'A Acareação acabou', sumiu ? 'culpado' : 'sistema');
  }

  /* efeitos das rolagens dos jogadores: só o Mestre mexe na Pilha do Culpado e no Palheiro */
  async function aplicarPendentes(docs) {
    for (const d of docs) {
      const r = d.data();
      if (r.aplicado || !(r.efeitos || []).length || aplicando.has(d.id)) continue;
      aplicando.add(d.id);
      await emFila(async () => { try {
        const cs = (await ref.get()).data(); let cul = cs.culpado || 0, pal = cs.palheiro || 0;
        let inv = cs.inv ? { ...cs.inv, pontos: [...(cs.inv.pontos || [])] } : null, pistas = [...(cs.pistas || [])], mudouInv = false;
        for (const x of r.efeitos) {
          if (x.t === 'culpado') cul = Math.max(0, cul + x.n);
          else if (x.t === 'palheiro') pal = Math.max(0, pal + x.n);
          else if (x.t === 'pilha' || x.t === 'deducao') { const fs = await fichaRef(x.ficha).get(); if (fs.exists) { const v = fs.data(); await fichaRef(x.ficha).update(x.t === 'pilha' ? { pilha: clamp((v.pilha || 0) + x.n, 0, 6) } : { deducao: (v.deducao || 0) + x.n }); } }
          else if (x.t === 'completa') await fichaRef(x.ficha).update({ deducaoCompleta: true }).catch(() => {});
          else if (x.t === 'ponto' && inv) {
            const i = inv.pontos.findIndex(q => q.id === x.id);
            if (i >= 0 && !inv.pontos[i].achado) {
              inv.pontos[i] = { ...inv.pontos[i], achado: true, por: r.fnome };
              const seg = E.inv?.[x.id]; pistas.push({ id: 'p-' + x.id, txt: `${inv.pontos[i].nome}: ${seg?.pista || '(o Mestre ainda não escreveu esta pista)'}`, t: Date.now() });
              mudouInv = true;
            }
          }
          else if (x.t === 'vigia' && inv) { inv.vigia = x.nome; mudouInv = true; }
          else if (x.t === 'tempo' && inv) { inv.segurar = true; inv.tempoUsado = true; mudouInv = true; }
          else if (x.t === 'ler') {
            const tipos = E.interrog?.[x.iid]; const rev = {};
            if (tipos) { if (x.suc >= 1) rev[tipos.indexOf('mentira')] = 'mentira'; if (x.suc >= 2) { rev[tipos.indexOf('verdade')] = 'verdade'; rev[tipos.indexOf('meia')] = 'meia'; } }
            await db.doc(`bichos-casos/${id}/rolagens/${x.iid}`).update({ revelado: rev, lido: true });
          }
        }
        const up = { culpado: cul, palheiro: pal }; if (mudouInv) { up.inv = inv; up.pistas = pistas; }
        await ref.update(up); Object.assign(C, up);
        await db.doc(`bichos-casos/${id}/rolagens/${d.id}`).update({ aplicado: true });
      } catch (e) { aplicando.delete(d.id); console.warn(e); } });
    }
  }
